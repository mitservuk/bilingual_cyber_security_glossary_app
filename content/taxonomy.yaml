# A certification with `comingSoon: true` is listed in the app but has no
# domains or terms yet.
certifications:
  - id: CISSP
    name: CISSP
    fullName: Certified Information Systems Security Professional
    issuer: ISC2
    comingSoon: true
  - id: KCSA
    name: KCSA
    fullName: Kubernetes and Cloud Native Security Associate
    issuer: The Linux Foundation
    comingSoon: true
  - id: CCSP
    name: CCSP
    fullName: Certified Cloud Security Professional
    issuer: ISC2
    outline: "2026-08"
    outlineLabel: ISC2 exam outline of 1 August 2026
    domains:
      - { n: 1, name: "Cloud Concepts, Architecture and Design", weight: 17 }
      - { n: 2, name: "Cloud Data Security", weight: 20 }
      - { n: 3, name: "Cloud Platform & Infrastructure Security", weight: 17 }
      - { n: 4, name: "Cloud Application Security", weight: 16 }
      - { n: 5, name: "Cloud Security Operations", weight: 17 }
      - { n: 6, name: "Legal, Risk and Compliance", weight: 13 }
