- id: law.dpia
  en:
    term: data protection impact assessment
    acronym: DPIA
    definition: An assessment required before processing that is likely to put people's rights
      at high risk, identifying the risks and the measures to reduce them.
  es:
    verdict: translated
    acronym: EIPD
    forms:
      - text: evaluación de impacto relativa a la protección de datos
        article: la
        kind: noun
        primary: true
        usedBy:
          - official
          - eu
        note: The wording of the GDPR in Spanish.
      - text: EIPD
        article: la
        kind: noun
        headline: true
        usedBy:
          - official
        note: The Spanish acronym, used by the AEPD.
      - text: evaluación de impacto en la protección de datos
        article: la
        kind: noun
        usedBy:
          - official
        note: A slightly shorter variant.
      - text: DPIA
        article: la
        kind: noun
        note: The English acronym is common in multinational companies.
    definition: Evaluación obligatoria antes de un tratamiento que probablemente entrañe un
      alto riesgo para los derechos de las personas.
    examples:
