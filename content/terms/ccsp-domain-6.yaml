      found:
        - limitación de responsabilidad
      checked: 2026-11-14
  status: sourced

- id: law.intellectual-property
  en:
    term: intellectual property
    definition: Legal rights over creations of the mind, such as software, designs, inventions
      and brands.
  es:
    verdict: translated
    forms:
      - text: propiedad intelectual
        article: la
        kind: noun
        primary: true
        usedBy:
          - official
          - eu
      - text: propiedad industrial
        article: la
        kind: noun
        usedBy:
          - official
        note: Patents, trade marks and designs, which Spanish law treats separately.
    definition: Derechos legales sobre las creaciones intelectuales, como el software, los
      diseños, las invenciones y las marcas.
    examples:
      - es: El código fuente está protegido por la propiedad intelectual.
        en: The source code is protected by intellectual property rights.
    watchOut: In Spanish law propiedad intelectual strictly means copyright. Patents and trade
      marks are propiedad industrial.
