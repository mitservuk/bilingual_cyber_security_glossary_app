    definition: Conjunto de normas y prácticas que regulan cómo se pueden recoger, usar, conservar
      y comunicar los datos personales.
    examples:
      - es: La Agencia Española de Protección de Datos vela por el cumplimiento del RGPD.
        en: The Spanish Data Protection Agency oversees compliance with the GDPR.
