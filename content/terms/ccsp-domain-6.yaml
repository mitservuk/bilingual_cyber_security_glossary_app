      url: https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673
      found:
        - la jurisdicción contencioso
      checked: 2026-11-14
    - label: BOE, Directiva (UE) 2022/2555 (NIS 2)
      url: https://www.boe.es/buscar/doc.php?id=DOUE-L-2022-81963
      found:
        - bajo jurisdicción de
      checked: 2026-11-14
  status: sourced

- id: law.applicable-law
