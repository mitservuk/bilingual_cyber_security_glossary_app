- id: law.liability
  en:
    term: liability
    definition: Legal responsibility for harm or loss, including the obligation to pay compensation;
      contracts commonly cap it.
  es:
    verdict: translated
    forms:
      - text: responsabilidad
        article: la
        kind: noun
        primary: true
        usedBy:
          - official
          - eu
      - text: responsabilidad civil
        article: la
        kind: noun
        usedBy:
          - official
        note: Civil liability, the term used in insurance.
      - text: limitación de responsabilidad
        article: la
        kind: noun
        usedBy:
          - engineers
        note: A limitation of liability clause.
    definition: Obligación legal de responder por un daño o una pérdida, incluida la de indemnizar.
    examples:
      - es: El contrato limita la responsabilidad del proveedor al importe anual del servicio.
        en: The contract limits the provider's liability to the annual fee for the service.
    watchOut: Responsabilidad covers both responsibility and liability. Context, or an adjective
      such as civil or legal, tells them apart.
  topics:
    - grc
  technology: []
  curriculum:
    - cert: CCSP
      outline: 2026-08
      domain: 6
  related:
    - law.contract
    - sec.accountability
    - grc.cyber-insurance
    - cloud.shared-responsibility
  sources:
    - label: AEPD, Gestión del riesgo y evaluación de impacto en tratamientos de datos personales
      url: https://www.aepd.es/guias/gestion-riesgo-y-evaluacion-impacto-en-tratamientos-datos-personales.pdf
      found:
        - de responsabilidad civil
      checked: 2026-11-14
    - label: BOE, Directiva (UE) 2022/2555 (NIS 2)
      url: https://www.boe.es/buscar/doc.php?id=DOUE-L-2022-81963
      found:
        - en responsabilidad civil
      checked: 2026-11-14
    - label: Paradigma Digital, blog
