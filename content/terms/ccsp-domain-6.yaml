      found:
        - del Reglamento
      checked: 2026-11-14
    - label: Reglamento (UE) 2024/1689 de Inteligencia Artificial, en el BOE
      url: https://www.boe.es/buscar/doc.php?id=DOUE-L-2024-81079
      found:
