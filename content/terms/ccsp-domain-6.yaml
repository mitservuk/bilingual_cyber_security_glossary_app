# CCSP Domain 6: Legal, Risk and Compliance.
# Format is described in content/README.md. These entries were written from
# working knowledge of usage in Spain; each `found` text was then located in a
# page already downloaded for earlier entries and confirmed with
# scripts/check_sources.py. Forms with no usedBy have not been seen in a source.

- id: law.jurisdiction
  en:
    term: jurisdiction
    definition: The authority of a country's courts and regulators over a matter, and by extension
      the territory where a given law applies.
  es:
    verdict: translated
    forms:
      - text: jurisdicción
        article: la
        kind: noun
        primary: true
        usedBy:
          - official
          - eu
    definition: Potestad de los tribunales y autoridades de un país sobre un asunto y, por
      extensión, territorio donde se aplica una ley.
    examples:
      - es: Los datos se alojan en una jurisdicción de la Unión Europea.
        en: The data is hosted in a European Union jurisdiction.
  topics:
    - grc
  technology: []
  curriculum:
    - cert: CCSP
      outline: 2026-08
      domain: 6
  related:
    - law.applicable-law
    - law.data-sovereignty
    - law.data-residency
  sources:
