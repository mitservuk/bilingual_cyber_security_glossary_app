    forms:
      - text: privacidad
        article: la
        kind: noun
        primary: true
        usedBy:
          - official
          - eu
      - text: intimidad
        article: la
        kind: noun
        usedBy:
          - official
        note: 'The word in the Spanish Constitution: el derecho a la intimidad.'
    definition: Derecho de una persona a controlar la información sobre sí misma y a no sufrir
      intromisiones injustificadas.
    examples:
      - es: La política de privacidad explica qué datos se recogen y para qué.
        en: The privacy policy explains what data is collected and why.
