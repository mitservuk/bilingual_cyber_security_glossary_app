- id: law.data-subject
  en:
    term: data subject
    definition: The identified or identifiable living person that personal data is about.
  es:
    verdict: translated
    forms:
      - text: interesado
        article: el
        kind: noun
        primary: true
        plural: los interesados
        usedBy:
          - official
          - eu
        note: The GDPR's term in Spanish. The feminine is la interesada.
      - text: afectado
        article: el
        kind: noun
        usedBy:
          - official
        note: Used alongside interesado in Spanish data protection law.
      - text: titular de los datos
        article: el
        kind: noun
        usedBy:
          - official
        note: The usual term in Latin America, also understood in Spain.
    definition: Persona física identificada o identificable a la que se refieren los datos
      personales.
    examples:
      - es: El interesado puede solicitar el acceso a sus datos en cualquier momento.
        en: The data subject may request access to their data at any time.
    watchOut: Interesado looks like 'interested party', but in data protection it means the
      data subject. A stakeholder is una parte interesada.
  topics:
    - data
    - grc
  technology: []
  curriculum:
