- id: law.regulation
  en:
    term: regulation
    definition: A binding rule made by a government or regulator; in the EU, a legal act that
      applies directly in every member state.
  es:
    verdict: translated
    forms:
      - text: reglamento
        article: el
        kind: noun
        primary: true
        usedBy:
          - official
          - eu
        note: An EU regulation, or secondary legislation in Spain. The GDPR is el Reglamento
          General de Protección de Datos.
      - text: regulación
        article: la
        kind: noun
        usedBy:
          - official
        note: 'Regulation as an activity or as the rules on a sector: la regulación financiera.'
      - text: normativa
        article: la
        kind: noun
        usedBy:
          - official
        note: The everyday catch-all for the rules that apply.
    definition: Norma obligatoria dictada por un gobierno o un regulador; en la UE, acto legislativo
      de aplicación directa en todos los Estados miembros.
    examples:
      - es: Un reglamento europeo se aplica directamente, sin transposición.
        en: A European regulation applies directly, without transposition.
    watchOut: An EU Regulation is a Reglamento and an EU Directive is a Directiva. Do not
      translate an EU Regulation as regulación.
  topics:
    - grc
  technology: []
  curriculum:
    - cert: CCSP
      outline: 2026-08
      domain: 6
  related:
    - law.legislation
    - fw.gdpr
    - grc.regulator
    - grc.regulatory-compliance
  sources:
