- id: law.consent
  en:
    term: consent
    definition: A person's freely given, specific, informed and unambiguous agreement to the
      processing of their personal data.
  es:
    verdict: translated
    forms:
      - text: consentimiento
        article: el
        kind: noun
        primary: true
        usedBy:
          - official
          - eu
      - text: consentir
        kind: verb
        usedBy:
          - official
        note: Dar or prestar el consentimiento is the more usual phrasing.
    definition: Manifestación de voluntad libre, específica, informada e inequívoca por la
      que una persona acepta el tratamiento de sus datos.
    examples:
      - es: El usuario puede retirar su consentimiento en cualquier momento.
        en: The user may withdraw their consent at any time.
  topics:
