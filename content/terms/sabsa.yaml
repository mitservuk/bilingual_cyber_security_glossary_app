- id: fw.security-services
  en:
    term: security services
    definition: In SABSA's logical layer, the technology-neutral services, such as authentication
      or audit, that deliver the business attributes; mechanisms and products implement them
      lower down.
  es:
    verdict: translated
    forms:
      - text: servicios de seguridad
        article: los
        kind: noun
        primary: true
        usedBy:
          - official
          - eu
      - text: mecanismo de seguridad
        article: el
        kind: noun
        usedBy:
          - official
        note: A security mechanism, in the physical layer.
    definition: En la capa lógica de SABSA, servicios independientes de la tecnología, como
      la autenticación o la auditoría, que proporcionan los atributos de negocio.
    examples:
      - es: Primero se definen los servicios de seguridad y después los productos que los
          implementan.
        en: The security services are defined first, and then the products that implement
          them.
  topics:
    - architecture
  technology: []
  curriculum:
