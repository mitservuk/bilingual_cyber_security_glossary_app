# EU cyber security law: the vocabulary of NIS2 and DORA.
# Format is described in content/README.md. These entries were written from
# working knowledge of usage in Spain; each `found` text was then located in a
# page the glossary already cites and confirmed with scripts/check_sources.py.
# Forms with no usedBy have not been seen in a source.

- id: fw.nis2
  en:
    term: NIS2 Directive
    definition: The EU directive on a high common level of cyber security, which sets risk-management
      and incident-reporting duties for essential and important entities.
  es:
    verdict: translated
    forms:
      - text: Directiva NIS 2
        article: la
        kind: noun
        primary: true
        usedBy:
          - official
          - microsoft
      - text: NIS2
        article: la
        kind: noun
        headline: true
        usedBy:
          - official
        note: Feminine, as a directiva.
      - text: Directiva (UE) 2022/2555
        article: la
        kind: noun
        register: formal
        usedBy:
          - official
    say: Said 'nis dos'.
    definition: Directiva de la UE sobre un elevado nivel común de ciberseguridad, que impone
      medidas de gestión de riesgos y notificación de incidentes a las entidades esenciales
      e importantes.
    examples:
      - es: La empresa entra en el ámbito de la NIS2 como entidad importante.
        en: The company falls within the scope of NIS2 as an important entity.
    watchOut: 'A directive needs national law to apply it: the word is transposición. In Spain
      that law has been slow to arrive, so check its current state.'
  topics:
    - grc
  technology: []
  frameworks:
    - NIS2
  related:
    - law.essential-entity
    - law.significant-incident
    - law.csirt
    - fw.dora
    - law.regulation
  sources:
    - label: INCIBE, blog de empresas
      url: https://www.incibe.es/empresas/blog/analisis-riesgos-pasos-sencillo
      found:
        - FAQ NIS2
      checked: 2026-11-15
    - label: Microsoft Learn, es-ES
      url: https://learn.microsoft.com/es-es/azure/azure-sovereign-clouds/sovereignty-implementation
      found:
        - NIS2
      checked: 2026-11-15
    - label: INCIBE, Guía de buenas prácticas de ciberseguridad en redes privadas 5G
      url: https://www.incibe.es/sites/default/files/2025-12/INCIBE&ULE_GuiaBuenasPracticasCiberseguridadRedesPrivadas5G.pdf
      found:
        - Directiva (UE) 2022/2555
      checked: 2026-11-15
  status: sourced

- id: law.essential-entity
  en:
    term: essential entity
    definition: Under NIS2, a large organisation in a highly critical sector, subject to the
      full regime and to supervision in advance. Important entities are supervised after the
      event.
  es:
    verdict: translated
    forms:
      - text: entidad esencial
        article: la
        kind: noun
        primary: true
        plural: las entidades esenciales
        usedBy:
          - official
          - eu
      - text: entidad importante
        article: la
        kind: noun
        plural: las entidades importantes
        usedBy:
          - official
        note: 'The second tier: lighter supervision and lower fines.'
    definition: En la NIS2, gran organización de un sector de alta criticidad, sujeta al régimen
      completo y a supervisión previa.
    examples:
      - es: Las entidades esenciales pueden ser inspeccionadas en cualquier momento.
        en: Essential entities may be inspected at any time.
  topics:
    - grc
  technology: []
  frameworks:
    - NIS2
  related:
    - fw.nis2
    - law.competent-authority
    - law.risk-management-measures
  sources:
