- id: law.near-miss
  en:
    term: near miss
    definition: An event that could have harmed systems or data but was stopped or did not
      happen; NIS2 encourages voluntary reporting of these.
  es:
    verdict: translated
    forms:
      - text: cuasiincidente
        article: el
        kind: noun
        primary: true
        plural: los cuasiincidentes
        usedBy:
          - eu
    definition: Suceso que podría haber dañado sistemas o datos, pero que se evitó o no llegó
      a producirse.
    examples:
      - es: 'El correo malicioso fue bloqueado a tiempo: se registró como cuasiincidente.'
        en: 'The malicious email was blocked in time: it was logged as a near miss.'
  topics:
    - incident
  technology: []
  frameworks:
    - NIS2
  related:
