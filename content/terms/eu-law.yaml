  status: sourced

- id: law.cyber-hygiene
  en:
    term: cyber hygiene
    definition: The basic routine practices, such as patching, strong passwords and backups,
      that keep systems and users secure.
  es:
    verdict: translated
    forms:
      - text: ciberhigiene
        article: la
        kind: noun
        primary: true
        usedBy:
          - official
          - eu
      - text: higiene digital
        article: la
        kind: noun
    definition: Prácticas básicas y rutinarias, como parchear, usar contraseñas robustas y
      hacer copias de seguridad, que mantienen seguros los sistemas y a los usuarios.
    examples:
      - es: La NIS2 exige prácticas básicas de ciberhigiene y formación.
        en: NIS2 requires basic cyber hygiene practices and training.
  topics:
