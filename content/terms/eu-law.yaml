- id: law.early-warning
  en:
    term: early warning
    definition: The first notice of a significant incident, due within 24 hours under NIS2;
      a fuller notification follows within 72 hours and a final report within a month.
  es:
    verdict: translated
    forms:
      - text: alerta temprana
        article: la
        kind: noun
        primary: true
        usedBy:
          - official
          - eu
      - text: notificación del incidente
        article: la
        kind: noun
        usedBy:
          - official
        note: The 72-hour notification that follows.
      - text: informe final
        article: el
        kind: noun
        usedBy:
          - official
        note: The final report, due within a month.
    definition: Primer aviso de un incidente significativo, que la NIS2 exige en 24 horas;
      le siguen una notificación en 72 horas y un informe final en un mes.
    examples:
      - es: Enviamos la alerta temprana antes de conocer el alcance del ataque.
        en: We sent the early warning before we knew the extent of the attack.
  topics:
    - incident
    - grc
  technology: []
  frameworks:
