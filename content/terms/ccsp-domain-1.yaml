- id: cloud.service-broker
  en:
    term: cloud service broker
    definition: >-
      An intermediary that negotiates the relationship between cloud service
      customers and providers, and may aggregate, integrate or customise
      services from several providers.
  es:
    verdict: english-kept
    forms:
      - text: cloud broker
        article: el
        kind: noun
        primary: true
        note: >-
          Given in English: no Spanish name for this role was found in the
          Spanish sources checked.
      - text: agregador de servicios de cloud
        usedBy: [official]
        article: el
        kind: noun
        note: >-
          The nearest figure in AEPD guidance, which lists "reseller" and
          "agregadores de servicios de cloud" among the partners that contract
          directly with customers.
    definition: >-
      Intermediario entre los clientes y los proveedores de servicios en la
      nube, que puede agregar o integrar servicios de varios proveedores.
    examples:
      - es: >-
          Contratamos los servicios de varios proveedores a través de un cloud
          broker.
        en: >-
          We buy services from several providers through a cloud broker.
    watchOut: >-
      Do not assume "bróker" in vendor documentation: Microsoft translates the
      broker of CASB as "agente" (agente de seguridad de acceso a la nube).
  topics: [supplychain, architecture]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
    - { cert: CISSP, outline: "2027-04", domain: 8 }
    - { cert: AZ-500, outline: "2026-01", domain: 3 }
    - { cert: SC-100, outline: "2026-10", domain: 4 }
    - { cert: GCP-PCA, outline: "current", domain: 5 }
    - { cert: GCP-PCSE, outline: "current", domain: 4 }
  related: [cloud.service-partner, cloud.service-provider, sec.casb]
  sources:
    - label: "AEPD, Orientaciones para prestadores de servicios de cloud computing (2018; marcada como obsoleta)"
      url: "https://www.aepd.es/guias/guia-cloud-prestadores.pdf"
      found: ["agregadores de servicios de cloud"]
      checked: 2026-11-14
    - label: "Microsoft Security, es-ES"
      url: "https://www.microsoft.com/es-es/security/business/security-101/what-is-a-cloud-access-security-broker-casb"
      found: ["agente de seguridad de acceso a la nube (CASB)"]
      checked: 2026-11-14
  status: draft

- id: cloud.service-partner
  en:
    term: cloud service partner
    definition: >-
      A party that supports or supplements the activities of the cloud service
      provider, the customer or both. Auditors, brokers, resellers and
      integrators are examples.
  es:
    verdict: both
    forms:
      - text: partner
        usedBy: [official, engineers, google, microsoft]
        article: el
        kind: noun
        primary: true
        plural: los partners
        note: >-
          Kept from English, including in AEPD guidance and on Google's and
          Microsoft's pages for Spain.
      - text: socio
        usedBy: [official, aws]
        headline: true
        article: el
        kind: noun
        note: >-
          The Spanish word. The AEPD writes "socios o partners"; AWS calls
          its partners "socios de AWS".
    definition: >-
      Empresa que complementa o apoya la actividad del proveedor de servicios
      en la nube o del cliente, por ejemplo un integrador o un revendedor.
    examples:
      - es: Trabajamos con un partner certificado para la migración a la nube.
        en: We're working with a certified partner on the cloud migration.
    watchOut: >-
      Socio also means a co-owner of a company or a member of a club; partner
      has only the commercial sense.
  topics: [supplychain]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
    - { cert: CISSP, outline: "2027-04", domain: 8 }
    - { cert: AZ-500, outline: "2026-01", domain: 3 }
    - { cert: SC-100, outline: "2026-10", domain: 4 }
    - { cert: GCP-PCA, outline: "current", domain: 5 }
    - { cert: GCP-PCSE, outline: "current", domain: 4 }
  related: [cloud.service-broker, cloud.auditor, cloud.service-provider]
  sources:
    - label: "AEPD, Guía para clientes que contraten servicios de cloud computing (2018; marcada como obsoleta)"
      url: "https://www.aepd.es/guias/guia-cloud-clientes.pdf"
      found: ["socios o partners de los proveedores de cloud"]
      checked: 2026-11-14
    - label: "Paradigma Digital, blog"
      url: "https://www.paradigmadigital.com/techbiz/cloud-adoption-frameworks-que-son/"
      found: ["recurrir a partners como Paradigma", "proveedores, partners y empresas"]
      checked: 2026-11-14
    - label: "Google Cloud, páginas para España"
      url: "https://cloud.google.com/partners?hl=es"
      found: ["Buscar un partner"]
      checked: 2026-11-14
    - label: "Microsoft Learn, es-ES: Partner Center"
      url: "https://learn.microsoft.com/es-es/partner-center/enroll/csp-overview"
      found: ["todos los partners interesados"]
      checked: 2026-11-14
    - label: "AWS, páginas en español"
      url: "https://aws.amazon.com/es/partners/"
      found: ["socio de AWS", "socios de AWS"]
      checked: 2026-11-14
  status: sourced

- id: cloud.auditor
  en:
    term: cloud auditor
    definition: >-
      An independent party that examines a cloud provider's controls, security
      and compliance and gives an opinion on them.
  es:
    verdict: translated
    forms:
      - text: auditor independiente
        usedBy: [microsoft, google, aws]
        article: el
        kind: noun
        primary: true
        note: >-
          How the vendors' Spanish pages refer to the third party that audits
          their services. The sources checked give the role no cloud-specific
          name.
      - text: auditor externo
        usedBy: [aws]
        article: el
        kind: noun
      - text: entidad auditora
        usedBy: [official]
        article: la
        kind: noun
        note: >-
          The AEPD's wording for the independent third party that audits a
          provider's security.
    definition: >-
      Tercero independiente que examina los controles, la seguridad y el
      cumplimiento de un proveedor de servicios en la nube y emite una
      opinión.
    examples:
      - es: Un auditor independiente revisa los controles del proveedor cada año.
        en: An independent auditor reviews the provider's controls every year.
    watchOut: >-
      The feminine is "la auditora", which is also the usual short name for an
      audit firm.
  topics: [assessment, grc]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
    - { cert: CISSP, outline: "2027-04", domain: 6 }
    - { cert: AZ-500, outline: "2026-01", domain: 4 }
    - { cert: SC-100, outline: "2026-10", domain: 2 }
    - { cert: AWS-SA-PROFESSIONAL, outline: "SAP-C02", domain: 3 }
    - { cert: AWS-SECURITY-SPECIALTY, outline: "SCS-C03", domain: 6 }
    - { cert: GCP-PCA, outline: "current", domain: 4 }
    - { cert: GCP-PCSE, outline: "current", domain: 5 }
  related: [cloud.service-partner, grc.regulator, fw.csa-star]
  sources:
    - label: "AEPD, Guía para clientes que contraten servicios de cloud computing (2018; marcada como obsoleta)"
      url: "https://www.aepd.es/guias/guia-cloud-clientes.pdf"
      found: ["un tercero independiente audite la seguridad", "la entidad auditora"]
      checked: 2026-11-14
    - label: "Microsoft Learn, es-ES: Esquema Nacional de Seguridad"
      url: "https://learn.microsoft.com/es-es/compliance/regulatory/offering-ens-spain"
      found: ["Un auditor independiente realiza la auditoría"]
      checked: 2026-11-14
    - label: "Google Cloud, páginas para España"
      url: "https://cloud.google.com/security/compliance/soc-2?hl=es"
      found: ["Los auditores independientes de Google Cloud"]
      checked: 2026-11-14
    - label: "AWS, páginas en español"
      url: "https://aws.amazon.com/es/compliance/programs/"
      found: ["Un auditor independiente externo"]
