        note: >-
          Training is el entrenamiento and to train is entrenar. Data
          poisoning is "envenenamiento de datos".
      - text: datos de prueba
        usedBy: [engineers]
        article: los
        kind: noun
        note: >-
          Test data, the part held back to evaluate the model. Also "datos de
          test".
