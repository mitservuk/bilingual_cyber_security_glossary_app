- id: grc.sla
  en:
    term: service level agreement
    acronym: SLA
    definition: >-
      The part of a service contract that fixes measurable targets, such as
      availability and response times, and the remedies owed if the provider
      misses them.
  es:
    verdict: both
    acronym: SLA
    forms:
      - text: acuerdo de nivel de servicio
        usedBy: [official, engineers, microsoft, aws]
        article: el
        kind: noun
        primary: true
        plural: los acuerdos de nivel de servicio
        note: >-
          The full term, in contracts, official guidance and job adverts,
          usually followed by "(SLA)".
      - text: SLA
        usedBy: [official, engineers, microsoft, aws]
        headline: true
        article: el
        kind: noun
        plural: los SLA
        note: >-
          The English acronym is the everyday form: "un SLA", "dentro de los
          SLA definidos".
      - text: ANS
        usedBy: [official]
        article: el
        kind: noun
        note: >-
          The Spanish acronym. INCIBE gives it alongside SLA.
    definition: >-
      Parte del contrato que fija los niveles de servicio que el proveedor se
      compromete a cumplir y las penalizaciones si no lo hace.
    examples:
      - es: >-
          El acuerdo de nivel de servicio garantiza una disponibilidad del
          99,9 %.
        en: The service level agreement guarantees 99.9% availability.
    watchOut: >-
      The plural is written without an -s: "los SLA", as Microsoft, AWS and
      Spanish job adverts do.
  topics: [grc]
  technology: [cloud-general]
  curriculum:
