      checked: 2026-11-14
  status: sourced

- id: grc.regulator
  en:
    term: regulator
    definition: >-
      A public authority with legal power to set rules for a sector, supervise
      compliance and impose sanctions, such as a data protection authority or
      a financial supervisor.
  es:
    verdict: translated
    forms:
      - text: regulador
        usedBy: [eu]
        article: el
        kind: noun
        primary: true
        plural: los reguladores
      - text: autoridad de control
        usedBy: [official]
        article: la
        kind: noun
        note: >-
          The GDPR's term for a data protection regulator (in English,
          supervisory authority). Spain's is the Agencia Española de
          Protección de Datos.
      - text: autoridad competente
        usedBy: [official]
        article: la
        kind: noun
        register: formal
        note: >-
          The wording of NIS 2 and DORA for whichever authority supervises an
          entity.
      - text: supervisor
        usedBy: [official]
        article: el
        kind: noun
        note: >-
          Used for financial regulators: DORA speaks of "supervisores
          financieros", and INCIBE calls the Banco de España the "autoridad
          supervisora" of banks.
    definition: >-
      Autoridad pública con potestad para dictar normas en un sector,
      supervisar su cumplimiento e imponer sanciones.
    examples:
      - es: Tenemos que enviar el informe al regulador antes del viernes.
        en: We have to send the report to the regulator before Friday.
    watchOut: >-
      An EU regulation, the legal act, is "un reglamento" (Reglamento DORA,
      Reglamento General de Protección de Datos). "Regulación" is regulation
      in the general sense.
  topics: [grc]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
    - { cert: CISSP, outline: "2027-04", domain: 1 }
  related: [fw.gdpr, grc.governance, cloud.auditor]
  sources:
    - label: "Reglamento (UE) 2022/2554 (DORA), texto en español publicado en el BOE"
      url: "https://www.boe.es/buscar/doc.php?id=DOUE-L-2022-81962"
      found: ["los reguladores y los organismos de normalización", "supervisores financieros", "autoridades competentes"]
      checked: 2026-11-14
    - label: "Reglamento (UE) 2016/679 (RGPD), texto en español publicado en el BOE"
      url: "https://www.boe.es/buscar/doc.php?id=DOUE-L-2016-80807"
      found: ["«autoridad de control»: la autoridad pública independiente"]
      checked: 2026-11-14
    - label: "Ley Orgánica 3/2018 (LOPDGDD)"
      url: "https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673"
      found: ["autoridad de control principal", "La Agencia Española de Protección de Datos se configura como una autoridad administrativa independiente"]
      checked: 2026-11-14
    - label: "Directiva (UE) 2022/2555 (NIS 2), texto en español publicado en el BOE"
      url: "https://www.boe.es/buscar/doc.php?id=DOUE-L-2022-81963"
      found: ["autoridades competentes de cada Estado miembro"]
      checked: 2026-11-14
    - label: "INCIBE, blog de empresas: ¿Qué es el reglamento DORA?"
      url: "https://www.incibe.es/empresas/blog/que-es-el-reglamento-dora"
      found: ["La autoridad competente puede variar", "el Banco de España actúa como autoridad supervisora"]
      checked: 2026-11-14
  status: sourced

- id: cloud.on-demand-self-service
  en:
    term: on-demand self-service
    definition: >-
      The customer can provision computing capabilities unilaterally and
      automatically, as needed, without human interaction with the provider.
  es:
    verdict: translated
    forms:
      - text: autoservicio bajo demanda
        usedBy: [official]
        article: el
        kind: noun
        primary: true
        note: >-
          The name given to this characteristic in Red.es grant rules
          published in the BOE.
      - text: autoservicio
        usedBy: [engineers, google, oracle, aws]
        article: el
        kind: noun
        note: >-
          The short form. Telefónica Tech names "la elasticidad y el
          autoservicio" as essential characteristics of cloud computing,
          citing NIST.
      - text: bajo demanda
        usedBy: [official, engineers, google]
        kind: adjective
        note: >-
          On demand. Telefónica Tech's glossary gives it as the equivalent of
          on-demand; Oracle leaves the English word in "escalabilidad
          on-demand".
      - text: administración bajo demanda
        usedBy: [eu]
        article: la
        kind: noun
        register: formal
        note: >-
          The NIS 2 Directive's Spanish wording for the same idea, in its
          definition of a cloud computing service.
    definition: >-
      Capacidad del cliente de aprovisionar recursos por sí mismo y de forma
      automática, cuando los necesita, sin intervención humana del proveedor.
    examples:
      - es: >-
          Con el autoservicio bajo demanda, cada equipo crea sus propios
          entornos de pruebas.
        en: >-
          With on-demand self-service, each team creates its own test
          environments.
  topics: [architecture]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
    - { cert: CISSP, outline: "2027-04", domain: 3 }
    - { cert: AZ-500, outline: "2026-01", domain: 3 }
    - { cert: AZ-305, outline: "2026-04", domain: 4 }
    - { cert: SC-100, outline: "2026-10", domain: 1 }
    - { cert: AWS-SA-ASSOCIATE, outline: "SAA-C03", domain: 2 }
    - { cert: AWS-SA-PROFESSIONAL, outline: "SAP-C02", domain: 2 }
    - { cert: AWS-SECURITY-SPECIALTY, outline: "SCS-C03", domain: 3 }
    - { cert: GCP-PCA, outline: "current", domain: 1 }
    - { cert: GCP-PCSE, outline: "current", domain: 4 }
  related: [cloud.cloud-computing, cloud.rapid-elasticity, cloud.measured-service]
  sources:
    - label: "Red.es, Resolución de 9 de junio de 2014 (BOE-A-2014-6641)"
      url: "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2014-6641"
      found: ["Autoservicio bajo demanda. Esta característica permite al usuario acceder de manera flexible"]
      checked: 2026-11-14
    - label: "Directiva (UE) 2022/2555 (NIS 2), texto en español publicado en el BOE"
      url: "https://www.boe.es/buscar/doc.php?id=DOUE-L-2022-81963"
      found: ["podría describirse como administración bajo demanda"]
      checked: 2026-11-14
    - label: "AEPD, Guía para clientes que contraten servicios de cloud computing (2018; marcada como obsoleta)"
      url: "https://www.aepd.es/guias/guia-cloud-clientes.pdf"
