- id: grc.governance
  en:
    term: governance
    definition: >-
      The framework of policies, roles, decision rights and oversight through
      which an organisation directs and controls its use of technology,
      including cloud services, and holds people accountable for it.
  es:
    verdict: translated
    forms:
      - text: gobernanza
        usedBy: [official, engineers, google, microsoft, aws]
        article: la
        kind: noun
        primary: true
        note: >-
          "Gobernanza de la nube", "gobernanza de la seguridad", "gobernanza
          de datos".
      - text: gobierno
        usedBy: [official, engineers, google]
        article: el
        kind: noun
        note: >-
          Just as established, above all in set phrases: "gobierno, riesgo y
          cumplimiento" (GRC), "gobierno del dato", "buen gobierno". The same
          source often uses both words.
    definition: >-
      Conjunto de políticas, funciones y mecanismos de control con los que una
      organización dirige y supervisa el uso de su tecnología.
    examples:
      - es: >-
          La gobernanza de la nube define quién puede crear recursos y con qué
          controles.
        en: >-
          Cloud governance defines who can create resources and under which
          controls.
    watchOut: >-
      Gobierno is also the everyday word for a government ("gobiernos,
      empresas e instituciones"), so read it in context. GRC is "gobierno,
      riesgo y cumplimiento" in Spanish job adverts and INCIBE material, with
      the acronym left in English.
