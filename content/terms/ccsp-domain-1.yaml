- id: cloud.service-customer
  en:
    term: cloud service customer
    definition: >-
      The organisation or person that contracts with a cloud service provider
      in order to use its services, and that keeps the customer's share of the
      security responsibilities.
  es:
    verdict: translated
    forms:
      - text: cliente
        usedBy: [official, engineers, google, microsoft, oracle, aws]
        article: el
        kind: noun
        primary: true
        note: >-
          Used on its own, set against "el proveedor", on the vendors' shared
          responsibility pages.
      - text: cliente de cloud computing
        usedBy: [official]
        article: el
        kind: noun
        note: >-
          The fuller wording in the AEPD's guide for organisations that
          contract cloud services.
      - text: usuario
        usedBy: [official]
        article: el
        kind: noun
        note: >-
          Official texts also call the customer the user: "usuarios o
          clientes" (AEPD), "usuario de la computación en nube" (NIS 2).
    definition: >-
      Organización o persona que contrata y utiliza los servicios de un
      proveedor de servicios en la nube.
    examples:
      - es: El cliente es responsable de configurar bien los permisos de acceso.
        en: The customer is responsible for configuring access permissions properly.
    watchOut: >-
      Cliente is also a client in the software sense: "un cliente ligero" is a
      thin client.
  topics: [architecture, grc]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
    - { cert: CISSP, outline: "2027-04", domain: 3 }
    - { cert: AZ-500, outline: "2026-01", domain: 3 }
    - { cert: AZ-305, outline: "2026-04", domain: 4 }
    - { cert: SC-100, outline: "2026-10", domain: 1 }
    - { cert: AWS-SA-ASSOCIATE, outline: "SAA-C03", domain: 2 }
    - { cert: AWS-SA-PROFESSIONAL, outline: "SAP-C02", domain: 2 }
    - { cert: AWS-SECURITY-SPECIALTY, outline: "SCS-C03", domain: 3 }
    - { cert: GCP-PCA, outline: "current", domain: 1 }
    - { cert: GCP-PCSE, outline: "current", domain: 4 }
  related: [cloud.service-provider, cloud.shared-responsibility, law.data-controller]
  sources:
    - label: "AEPD, Guía para clientes que contraten servicios de cloud computing (2018; marcada como obsoleta)"
      url: "https://www.aepd.es/guias/guia-cloud-clientes.pdf"
      found: ["el cliente de cloud computing", "llamaremos usuarios o clientes"]
      checked: 2026-11-14
    - label: "Directiva (UE) 2022/2555 (NIS 2), texto en español publicado en el BOE"
      url: "https://www.boe.es/buscar/doc.php?id=DOUE-L-2022-81963"
      found: ["usuario de la computación en nube", "cliente ligero"]
      checked: 2026-11-14
    - label: "Google Cloud, páginas para España"
      url: "https://cloud.google.com/learn/what-is-cloud-security?hl=es"
      found: ["obligaciones del cliente"]
      checked: 2026-11-14
    - label: "Microsoft Security, es-ES"
      url: "https://www.microsoft.com/es-es/security/business/security-101/what-is-cloud-security"
      found: ["proveedor de servicios en la nube (CSP) y el cliente"]
      checked: 2026-11-14
    - label: "Oracle España"
      url: "https://www.oracle.com/es/security/cloud-security/what-is-cloud-security/"
      found: ["entre el proveedor de la nube y el cliente"]
      checked: 2026-11-14
    - label: "AWS, documentación en español (es_es)"
      url: "https://docs.aws.amazon.com/es_es/whitepapers/latest/aws-security-incident-response-guide/shared-responsibility.html"
