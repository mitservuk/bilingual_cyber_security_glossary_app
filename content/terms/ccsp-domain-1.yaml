- id: sec.confidentiality
  en:
    term: confidentiality
    definition: >-
      The property that information is disclosed only to people, systems and
      processes authorised to see it. In the cloud it rests mainly on
      encryption, access control and isolation between tenants.
  es:
    verdict: translated
    forms:
      - text: confidencialidad
        usedBy: [official, engineers, google, microsoft, oracle]
        article: la
