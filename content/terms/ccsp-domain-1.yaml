- id: sec.zero-trust
  en:
    term: zero trust
    definition: >-
      A security model that grants no implicit trust on the basis of network
      location: every request is authenticated, authorised and checked against
      context before access is given, and access is kept to the minimum.
  es:
    verdict: both
    forms:
      - text: Zero Trust
        usedBy: [official, engineers]
        article: el
        kind: noun
        primary: true
        note: >-
          The English name, written with capitals and mostly used as a label
          after another noun: "modelo Zero Trust", "arquitectura Zero Trust",
          "enfoque Zero Trust". INCIBE's and Telefónica Tech's posts write it
          this way and add confianza cero as a gloss.
      - text: confianza cero
        usedBy: [official, engineers, google, microsoft, oracle]
        headline: true
        article: la
        kind: noun
        note: >-
          The translation, used throughout Google's and Microsoft's Spanish
          pages: "seguridad de confianza cero", "arquitectura de confianza
          cero". INCIBE glosses ZTNA as "acceso a la red de confianza cero".
    definition: >-
      Modelo de seguridad que no confía por defecto en ningún usuario ni
      dispositivo, esté dentro o fuera de la red, y verifica cada acceso.
    examples:
      - es: Estamos sustituyendo la VPN por un modelo Zero Trust.
        en: We are replacing the VPN with a zero trust model.
  topics: [architecture, iam]
  technology: [networking]
  curriculum:
