- id: sec.isolation
  en:
    term: isolation
    definition: >-
      Keeping workloads, networks or tenants apart so that a fault or
      compromise in one cannot reach the others. On shared cloud
      infrastructure it is enforced logically, by the hypervisor, the network
      and the identity layer.
  es:
    verdict: translated
    forms:
      - text: aislamiento
        usedBy: [official, engineers, google, microsoft, oracle]
        article: el
        kind: noun
        primary: true
      - text: aislar
        usedBy: [engineers]
        kind: verb
        note: To isolate.
      - text: aislado
        usedBy: [engineers, google]
        kind: adjective
        note: 'Isolated: "un entorno aislado", "entornos aislados".'
    definition: >-
      Separación entre cargas de trabajo, redes o clientes para que un fallo
      o un ataque en uno no afecte a los demás.
    examples:
      - es: El aislamiento entre clientes depende del hipervisor.
        en: Isolation between customers depends on the hypervisor.
    watchOut: >-
      Aislamiento is also the everyday word for insulation: "el aislamiento
      de la vivienda" is how well a home is insulated.
