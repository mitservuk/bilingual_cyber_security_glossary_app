- id: cloud.hybrid-cloud
  en:
    term: hybrid cloud
    definition: >-
      A deployment model that combines two or more distinct cloud
      infrastructures, typically a private and a public cloud, linked so that
      data and applications can move between them.
  es:
    verdict: both
    forms:
      - text: nube híbrida
        usedBy: [official, engineers, google, microsoft, oracle, aws]
