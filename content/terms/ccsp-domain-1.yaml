- id: cloud.rapid-elasticity
  en:
    term: rapid elasticity
    definition: >-
      Capacity can be provisioned and released quickly, often automatically,
      so that it grows and shrinks with demand; to the customer it appears
      unlimited.
  es:
    verdict: translated
    forms:
      - text: elasticidad
        usedBy: [engineers, google, aws]
        article: la
        kind: noun
        primary: true
        note: >-
          The sources checked name the characteristic with the one word.
          Telefónica Tech gives "la elasticidad y el autoservicio" as
          essential characteristics of cloud computing, citing NIST.
      - text: elástico
        usedBy: [eu, google]
        kind: adjective
        note: >-
          Elastic. The NIS 2 Directive speaks of "un conjunto modulable y
          elástico de recursos"; Google also says "computación elástica".
    definition: >-
      Capacidad de aumentar y reducir los recursos con rapidez, a menudo de
      forma automática, para seguir la demanda.
    examples:
      - es: >-
          Gracias a la elasticidad de la nube, añadimos servidores solo
          durante los picos de tráfico.
        en: >-
          Thanks to cloud elasticity, we add servers only during traffic
          peaks.
    watchOut: >-
      Elasticidad and escalabilidad are not synonyms. Google's Spanish page
      separates growing to handle more work (escalabilidad) from adjusting
      automatically and quickly in both directions (elasticidad).
