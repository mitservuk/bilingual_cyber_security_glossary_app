- id: sec.separation-of-duties
  en:
    term: separation of duties
    definition: >-
      Splitting a sensitive task between two or more people or roles so that
      no single one can complete it, or abuse it, alone.
  es:
    verdict: translated
    forms:
      - text: segregación de funciones
        usedBy: [official, engineers]
        article: la
        kind: noun
        primary: true
        note: >-
          The ENS measure is headed "Segregación de funciones y tareas". Audit
          and GRC job adverts use the same phrase and keep the English
          abbreviation: "segregación de funciones (SoD)".
      - text: separación de funciones
        usedBy: [engineers, microsoft]
        article: la
        kind: noun
      - text: separación de tareas
        usedBy: [oracle, aws]
        article: la
        kind: noun
        note: Oracle's and AWS's wording in their Spanish pages.
      - text: separación de obligaciones
        usedBy: [microsoft]
        article: la
        kind: noun
        note: >-
          The menu label in Microsoft Entra. The same Microsoft page also
          writes "separación de funciones" and "segregación de funciones".
    definition: >-
      Reparto de una tarea sensible entre varias personas o roles para que
      nadie pueda completarla, ni abusar de ella, por sí solo.
    examples:
      - es: >-
          Por segregación de funciones, quien desarrolla el código no puede
          desplegarlo en producción.
        en: >-
          Under separation of duties, whoever writes the code cannot deploy it
          to production.
    watchOut: >-
      There is no single translation: four are in use, and one Microsoft page
      mixes three of them. Funciones here means duties or roles, not software
      functions.
