- id: ai.llm
  en:
    term: large language model
    acronym: LLM
    definition: >-
      A very large neural network trained on vast quantities of text to
      predict the next token, which lets it interpret and generate natural
      language and code.
  es:
    verdict: both
    acronym: LLM
    forms:
      - text: LLM
        usedBy: [official, engineers, google, microsoft, aws]
        article: el
        kind: noun
        primary: true
        plural: los LLM
        note: >-
          The English acronym is used as a noun: "un LLM", "los modelos LLM".
          AWS and Microsoft write the plural "los LLM"; Google, Paradigma
          Digital and job adverts write "LLMs".
      - text: modelo de lenguaje de gran tamaño
        usedBy: [microsoft, aws]
        headline: true
        article: el
        kind: noun
        note: The translation on AWS's Spanish pages, also used by Microsoft.
      - text: modelo de lenguaje extenso
        usedBy: [engineers, google]
        article: el
        kind: noun
        note: >-
          Google Cloud's translation, also found on the Paradigma Digital
          blog.
      - text: grandes modelos de lenguaje
        usedBy: [eu, microsoft]
        article: los
        kind: noun
        register: formal
        note: The wording of the EU AI Act in Spanish.
      - text: modelo de lenguaje
        usedBy: [official, engineers]
        article: el
        kind: noun
        note: The everyday short form, without "large".
    say: Said letter by letter, "ele-ele-eme".
    definition: >-
      Red neuronal de gran tamaño entrenada con enormes cantidades de texto,
      capaz de interpretar y generar lenguaje natural y código.
    examples:
      - es: No envíes datos de clientes a un LLM externo.
        en: Don't send customer data to an external LLM.
    watchOut: >-
      The translation is not settled. Google, AWS and the EU AI Act each word
      it differently, and Microsoft's documentation alone uses three versions,
      including "modelo de lenguaje grande". Say LLM and recognise the rest
      when you read them.
