- id: fw.common-criteria
  en:
    term: Common Criteria
    definition: >-
      The international standard (ISO/IEC 15408) for evaluating the security
      of IT products against a stated security target, with the result
      expressed as an evaluation assurance level (EAL) and recognised between
      the countries that have signed the mutual recognition arrangement.
  es:
    verdict: both
    forms:
      - text: Common Criteria
        usedBy: [official, engineers]
        kind: noun
        primary: true
        note: >-
          Kept in English and used as a name after another noun, with no
          article of its own: "la certificación Common Criteria", "la
          normativa Common Criteria". In Spain the certification body is the
          CCN (Centro Criptológico Nacional).
      - text: criterios comunes
        usedBy: [eu]
        headline: true
        article: los
        kind: noun
        register: formal
        note: >-
          The translation in the Spanish text of EU law, as in the EUCC
          scheme, "basado en los criterios comunes". Tech press glosses it the
          same way.
    definition: >-
      Norma internacional (ISO/IEC 15408) para evaluar y certificar la
      seguridad de los productos de tecnologías de la información.
    examples:
      - es: Este cortafuegos tiene la certificación Common Criteria con nivel EAL4.
        en: This firewall holds Common Criteria certification at EAL4.
  topics: [assessment, grc]
  technology: []
  curriculum:
