- id: grc.cost-benefit-analysis
  en:
    term: cost-benefit analysis
    definition: >-
      A comparison of the expected costs of a decision, such as a migration or
      a security control, with its expected benefits, expressed as far as
      possible in money, to judge whether it is worth doing.
  es:
    verdict: translated
    forms:
      - text: análisis coste-beneficio
        usedBy: [official]
        article: el
        kind: noun
        primary: true
        note: >-
          The wording of Spanish legislation, which also writes it with a
          slash: "análisis coste/beneficio".
      - text: relación coste-beneficio
        usedBy: [engineers]
        article: la
        kind: noun
        note: >-
          The cost-benefit ratio. INCIBE speaks of "criterios de
          coste-beneficio".
    definition: >-
      Comparación entre los costes previstos de una decisión y los beneficios
      que se esperan de ella, para valorar si merece la pena.
    examples:
      - es: >-
          Hemos hecho un análisis coste-beneficio antes de migrar la base de
          datos a la nube.
        en: >-
          We did a cost-benefit analysis before migrating the database to the
          cloud.
    watchOut: >-
      In Spain a cost is un coste. Costo is the Latin American word, although
      Microsoft's Spanish documentation uses it: "relación costo-beneficio".
  topics: [grc]
  technology: []
  curriculum:
