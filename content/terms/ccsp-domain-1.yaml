- id: sec.media-sanitization
  en:
    term: media sanitization
    definition: >-
      Removing data from storage media so thoroughly that it cannot be
      recovered, by overwriting, purging or physically destroying the media,
      before they are reused or disposed of.
  es:
    verdict: translated
    forms:
      - text: borrado seguro
        usedBy: [official, microsoft]
        article: el
        kind: noun
        primary: true
        note: >-
          The entry in INCIBE's glossary and the wording of the ENS, whose
          measure is headed "Borrado y destrucción". Storage media are
          "soportes de información".
      - text: sanitización
        article: la
        kind: noun
        note: >-
          The calque of the English term, used in specialist guidance on
          destroying media. Not confirmed on a page that could be opened.
      - text: saneamiento de datos
        usedBy: [microsoft]
        article: el
        kind: noun
        note: One of Microsoft's translations in its Spanish documentation.
    definition: >-
      Eliminación de los datos de un soporte de forma que no se puedan
      recuperar, antes de reutilizarlo o desecharlo.
    examples:
      - es: Antes de reutilizar los discos hay que hacer un borrado seguro.
        en: The disks have to be sanitized before they are reused.
    watchOut: >-
      Microsoft's and AWS's Spanish documentation also translate sanitization
      as desinfección ("desinfección de medios"). In Spain desinfección
      normally means cleaning malware off a device, as in INCIBE's
      "desinfección de dispositivos". Say borrado seguro.
  topics: [data, asset]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
    - { cert: CISSP, outline: "2027-04", domain: 2 }
  related: [sec.cryptographic-erasure, sec.data-at-rest, law.personal-data]
  sources:
