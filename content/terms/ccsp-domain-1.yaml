- id: cloud.multi-cloud
  en:
    term: multi-cloud
    definition: >-
      Using cloud services from two or more providers at the same time, to
      avoid depending on one of them or to place each workload where it fits
      best.
  es:
    verdict: both
    forms:
      - text: multicloud
        usedBy: [engineers, oracle]
        kind: adjective
        primary: true
        note: >-
          Written as one word, without a hyphen: "entornos híbridos y
          multicloud", "una gestión multicloud". Telefónica Tech's glossary
          also lists it as a noun.
      - text: multinube
        usedBy: [official, google, microsoft, oracle, aws]
        headline: true
        article: la
        kind: noun
        note: >-
          The translated form, in the BOE and on Google's, Microsoft's and
          AWS's Spanish pages: "la multinube", "entornos multinube". Oracle's
          page uses both words.
    definition: >-
      Uso simultáneo de servicios en la nube de dos o más proveedores.
    examples:
      - es: >-
          Tenemos una estrategia multicloud para no depender de un solo
          proveedor.
        en: >-
          We have a multi-cloud strategy so as not to depend on a single
          provider.
    watchOut: >-
      Not a synonym of nube híbrida: the BOE's cloud curriculum asks students
      to tell "servicios de nube híbrida" from "entornos multinube".
  topics: [architecture]
  technology: [cloud-general]
  curriculum:
