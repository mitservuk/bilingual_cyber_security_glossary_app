# CCSP Domain 1: Cloud Concepts, Architecture and Design.
# Format is described in content/README.md. Every `found` text was confirmed
# on its page with scripts/check_sources.py when these entries were written.

- id: cloud.service-provider
  en:
    term: cloud service provider
    acronym: CSP
    definition: >-
      An organisation that makes cloud services available to customers and
      runs the infrastructure and operations behind them, up to the boundary
      the service model defines.
  es:
    verdict: both
    acronym: CSP
    forms:
      - text: proveedor de servicios en la nube
        usedBy: [engineers, google, microsoft, aws]
        article: el
        kind: noun
        primary: true
        plural: los proveedores de servicios en la nube
        note: >-
          Google, Microsoft and AWS put the English acronym CSP beside it.
      - text: proveedor cloud
        usedBy: [engineers]
        headline: true
        article: el
        kind: noun
        note: >-
          The shorthand in engineering blogs, with cloud left in English.
          Also written "proveedor de cloud".
      - text: proveedor de nube
        usedBy: [microsoft, oracle, aws]
        article: el
        kind: noun
        note: A shorter form found in vendor documentation.
      - text: proveedor de servicios de computación en nube
        usedBy: [eu]
        article: el
        kind: noun
        register: formal
        note: >-
          The wording of EU law in Spanish, here the NIS 2 Directive. Legal
          texts say "en nube", without the article.
    definition: >-
      Organización que pone servicios en la nube a disposición de sus clientes
      y se encarga de la infraestructura que los sustenta.
    examples:
      - es: >-
          Antes de firmar, revisa las certificaciones del proveedor de
          servicios en la nube.
        en: >-
          Before signing, check the cloud service provider's certifications.
    watchOut: >-
      In Microsoft's partner programme CSP means something else: Cloud
      Solution Provider ("proveedor de soluciones en la nube"), a partner that
      resells Microsoft's cloud, not the cloud provider itself.
  topics: [architecture, supplychain]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
    - { cert: CISSP, outline: "2027-04", domain: 3 }
    - { cert: AZ-500, outline: "2026-01", domain: 3 }
    - { cert: AZ-305, outline: "2026-04", domain: 4 }
    - { cert: SC-100, outline: "2026-10", domain: 1 }
    - { cert: AWS-SA-ASSOCIATE, outline: "SAA-C03", domain: 2 }
    - { cert: AWS-SA-PROFESSIONAL, outline: "SAP-C02", domain: 2 }
    - { cert: AWS-SECURITY-SPECIALTY, outline: "SCS-C03", domain: 3 }
    - { cert: GCP-PCA, outline: "current", domain: 1 }
    - { cert: GCP-PCSE, outline: "current", domain: 4 }
  related: [cloud.service-customer, cloud.shared-responsibility, cloud.service-partner, grc.sla]
  sources:
    - label: "Directiva (UE) 2022/2555 (NIS 2), texto en español publicado en el BOE"
      url: "https://www.boe.es/buscar/doc.php?id=DOUE-L-2022-81963"
      found: ["proveedor de servicios de computación en nube", "proveedor de servicios en nube"]
      checked: 2026-11-14
    - label: "Google Cloud, páginas para España"
      url: "https://cloud.google.com/learn/what-is-a-cloud-service-provider?hl=es"
      found: ["un proveedor de servicios en la nube (CSP)"]
      checked: 2026-11-14
    - label: "Microsoft Security, es-ES"
      url: "https://www.microsoft.com/es-es/security/business/security-101/what-is-cloud-security"
      found: ["proveedor de servicios en la nube (CSP) y el cliente"]
      checked: 2026-11-14
    - label: "AWS, páginas en español"
      url: "https://aws.amazon.com/es/what-is/multicloud/"
      found: ["proveedores de servicios en la nube (CSP)", "un proveedor de nube"]
      checked: 2026-11-14
    - label: "AWS, páginas en español"
      url: "https://aws.amazon.com/es/what-is/public-cloud/"
      found: ["el proveedor de servicios en la nube es responsable"]
      checked: 2026-11-14
    - label: "Paradigma Digital, blog"
