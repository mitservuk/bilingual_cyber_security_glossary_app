- id: fw.fips-140-3
  en:
    term: FIPS 140-3
    expansion: Federal Information Processing Standard Publication 140-3
    definition: >-
      The US federal standard setting security requirements for cryptographic
      modules. Modules such as HSMs are validated against it at one of four
      security levels; it replaces FIPS 140-2.
  es:
    verdict: english-kept
    forms:
      - text: FIPS 140-3
        usedBy: [google, aws]
        article: el
        kind: noun
        primary: true
        note: >-
          The name is not translated. Google writes "el estándar FIPS 140-3"
          and "el FIPS 140"; AWS states a level as "FIPS 140-3 nivel 3". The
          Spanish text of EU law cites it as "FIPS PUB 140-3".
      - text: módulo criptográfico
        usedBy: [google, microsoft, aws]
        article: el
        kind: noun
        plural: los módulos criptográficos
        note: Cryptographic module, the thing that is validated.
      - text: Estándar de procesamiento de la información federal
        usedBy: [aws]
        article: el
        kind: noun
        note: AWS's Spanish expansion of the acronym FIPS.
    definition: >-
      Norma del Gobierno de Estados Unidos que fija los requisitos de
      seguridad de los módulos criptográficos y con la que estos se validan.
    examples:
      - es: Las claves se guardan en un HSM validado según el estándar FIPS 140-3.
        en: The keys are kept in an HSM validated to the FIPS 140-3 standard.
  topics: [crypto, assessment]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
    - { cert: CISSP, outline: "2027-04", domain: 3 }
  frameworks: [FIPS-140-3]
  related: [fw.common-criteria, sec.key-management, sec.encryption]
  sources:
