- id: cloud.scalability
  en:
    term: scalability
    definition: >-
      The ability of a system to handle a growing workload by adding
      resources, vertically (a larger instance) or horizontally (more
      instances), without being redesigned.
  es:
    verdict: translated
    forms:
      - text: escalabilidad
        usedBy: [official, engineers, google, microsoft, oracle, aws]
        article: la
        kind: noun
        primary: true
      - text: escalar
        usedBy: [engineers, google, microsoft]
        kind: verb
        note: >-
          To scale. "Escalar verticalmente" is to scale up; Google sets it
          against scaling "horizontalmente", with more instances.
      - text: escalado automático
        usedBy: [engineers, microsoft]
        article: el
        kind: noun
        note: Autoscaling. "El escalado" is scaling as an activity.
      - text: modulable
        usedBy: [eu]
        kind: adjective
        register: formal
        note: >-
          The NIS 2 Directive's Spanish word for scalable: "un conjunto
          modulable y elástico de recursos". Engineering blogs and vendors say
          "escalable".
    definition: >-
      Capacidad de un sistema para asumir más carga de trabajo añadiendo
      recursos, sin tener que rediseñarlo.
    examples:
      - es: >-
          La escalabilidad de la plataforma nos permite crecer sin cambiar la
          arquitectura.
        en: >-
          The platform's scalability lets us grow without changing the
          architecture.
    watchOut: >-
      Escalar also means to escalate: "escalar una incidencia" is to escalate
      a ticket, nothing to do with capacity.
