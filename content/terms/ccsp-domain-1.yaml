- id: grc.bia
  en:
    term: business impact analysis
    acronym: BIA
    definition: >-
      An assessment that identifies an organisation's critical processes and
      measures the effect of their disruption over time, producing the
      recovery priorities and objectives (RTO, RPO) on which continuity
      planning rests.
  es:
    verdict: both
    acronym: BIA
    forms:
      - text: análisis de impacto en el negocio
        usedBy: [official]
        article: el
        kind: noun
        primary: true
        note: >-
          INCIBE's wording. It also writes "análisis de impacto sobre el
          negocio".
      - text: BIA
        usedBy: [official, engineers]
        headline: true
        article: el
        kind: noun
        note: >-
          The English acronym is kept and used as a noun: "llevar a cabo un
          BIA".
      - text: análisis de impacto
        usedBy: [official]
        article: el
        kind: noun
        register: formal
        note: >-
          The short name of the measure in Spain's national security framework
          (ENS, op.cont.1).
      - text: análisis de impacto empresarial
        usedBy: [microsoft]
        article: el
        kind: noun
        note: Microsoft's wording in its Spanish documentation.
    definition: >-
      Estudio que identifica los procesos críticos de la organización y mide
      el impacto de su interrupción, para fijar las prioridades y los
      objetivos de recuperación.
    examples:
      - es: >-
          Antes de escribir el plan de continuidad hay que hacer un análisis
          de impacto en el negocio.
        en: >-
          Before writing the continuity plan, a business impact analysis has
          to be done.
    watchOut: >-
      Do not confuse it with the data protection impact assessment, which is
      an "evaluación de impacto" (EIPD), not an "análisis".
  topics: [grc, incident]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
    - { cert: CISSP, outline: "2027-04", domain: 1 }
