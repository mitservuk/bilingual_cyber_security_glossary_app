- id: cloud.edge-computing
  en:
    term: edge computing
    definition: >-
      Processing data close to where it is generated or consumed, on devices
      or local nodes at the edge of the network, rather than in a central
      data centre or cloud region.
  es:
    verdict: both
    forms:
      - text: edge computing
        usedBy: [official, engineers]
        article: el
        kind: noun
        primary: true
        note: >-
          Kept in English by INCIBE-CERT and by Spain-based engineering blogs,
          and sometimes shortened to "el edge".
      - text: computación en el borde
        usedBy: [official]
        headline: true
        article: la
        kind: noun
        note: >-
          The translation, usually given next to the English: "computación en
          el borde (edge computing)".
      - text: computación periférica
        usedBy: [aws]
        article: la
        kind: noun
        note: AWS's wording on its Spanish pages.
    definition: >-
      Procesamiento de los datos cerca de donde se generan, en dispositivos o
      nodos locales, en lugar de en un centro de datos central.
    examples:
      - es: >-
          Gracias al edge computing, los datos se procesan en la propia
          fábrica.
        en: >-
          Thanks to edge computing, the data is processed in the factory
          itself.
    watchOut: >-
      Each vendor translates "edge" differently: AWS says "periférica" and
      Microsoft says "perimetral" ("dispositivos perimetrales"). Say edge
      computing; recognise the others when you read them.
