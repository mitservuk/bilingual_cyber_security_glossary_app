- id: cloud.vendor-lock-in
  en:
    term: vendor lock-in
    definition: >-
      Dependence on one provider's proprietary services, formats or contract
      terms to the point where moving elsewhere becomes impractical or
      prohibitively expensive.
  es:
    verdict: both
    forms:
      - text: vendor lock-in
        usedBy: [engineers]
        article: el
        kind: noun
        primary: true
        note: >-
          Kept in English in Spain-based engineering blogs, sometimes
          shortened to "lock-in".
      - text: dependencia del proveedor
        usedBy: [engineers]
        headline: true
        article: la
        kind: noun
        note: >-
          The Spanish equivalent, often given beside the English. The
          preposition varies: "dependencia de proveedor" (Telefónica Tech,
          Google) and "dependencia de un solo proveedor" (Oracle, the EU Data
          Act).
    definition: >-
      Dependencia de los servicios o formatos propios de un proveedor hasta
      el punto de que cambiar a otro resulta muy difícil o muy caro.
    examples:
      - es: Usar estándares abiertos reduce el riesgo de vendor lock-in.
        en: Using open standards reduces the risk of vendor lock-in.
    watchOut: >-
      "Bloqueo" (lock) also appears in vendor translations, for example
      Microsoft's "bloqueo específico del proveedor". It is not the usual
      word.
  topics: [grc, architecture]
  technology: [cloud-general]
  curriculum:
