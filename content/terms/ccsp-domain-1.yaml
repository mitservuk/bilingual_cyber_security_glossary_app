- id: ai.model
  en:
    term: model
    definition: >-
      In machine learning, the artefact produced by training an algorithm on
      data: a set of learned parameters that maps inputs to outputs such as
      predictions or generated text.
  es:
    verdict: translated
    forms:
      - text: modelo
        usedBy: [official, engineers, google, microsoft]
        article: el
        kind: noun
        primary: true
        note: >-
          A model is trained: "el modelo se entrena". Often qualified, as in
          "modelo de aprendizaje automático" or "modelo de lenguaje".
      - text: modelo de IA
        usedBy: [official, engineers]
        article: el
        kind: noun
        note: >-
          AI model. The term of the EU AI Act, where a general-purpose model
          is a "modelo de IA de uso general", and of INCIBE-CERT.
    definition: >-
      En aprendizaje automático, el resultado de entrenar un algoritmo con
      datos: un conjunto de parámetros aprendidos que convierte entradas en
      salidas.
    examples:
      - es: Hemos entrenado el modelo con datos de los últimos dos años.
        en: We trained the model on data from the last two years.
    watchOut: >-
      Modelo is as overloaded as in English: "modelo de datos" (data model),
      "modelo de despliegue" (deployment model). Say "modelo de IA" when it
      could be unclear.
