- id: sec.cryptographic-erasure
  en:
    term: cryptographic erasure
    definition: >-
      Making encrypted data unrecoverable by destroying every copy of the key
      that protects it, rather than overwriting the data itself. Often the
      only practical way to sanitize storage a cloud customer cannot touch.
  es:
    verdict: translated
    forms:
      - text: borrado criptográfico
        usedBy: [microsoft]
        article: el
        kind: noun
        primary: true
        note: Microsoft's wording in its Spanish documentation.
      - text: eliminación criptográfica
        usedBy: [official]
        article: la
        kind: noun
        note: >-
          The wording of an INCIBE post, which explains it as "cifrar los
          datos y destruir la clave de descifrado".
    definition: >-
      Método de borrado que consiste en destruir la clave con la que están
      cifrados los datos, de modo que ya no se puedan leer.
    examples:
      - es: Al destruir la clave se consigue un borrado criptográfico de todo el volumen.
        en: Destroying the key gives a cryptographic erasure of the whole volume.
