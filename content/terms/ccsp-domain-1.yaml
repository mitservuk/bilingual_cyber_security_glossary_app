- id: cloud.ephemeral-computing
  en:
    term: ephemeral computing
    definition: >-
      Running workloads on resources that exist only for as long as they are
      needed (containers, functions, short-lived instances) and are then
      destroyed and recreated rather than kept and repaired.
  es:
    verdict: translated
    forms:
      - text: efímero
        usedBy: [engineers, google, microsoft, aws]
        kind: adjective
        primary: true
        note: >-
          Spanish sources describe the short-lived thing rather than name the
          practice: "entornos efímeros", "contenedores efímeros", "recursos
          efímeros", "cargas de trabajo efímeras".
    definition: >-
      Uso de recursos de computación que solo existen mientras se necesitan y
      que después se destruyen y se vuelven a crear en lugar de mantenerse.
    examples:
      - es: Los contenedores son efímeros, así que no guardes datos dentro.
        en: Containers are ephemeral, so don't store data inside them.
    watchOut: >-
