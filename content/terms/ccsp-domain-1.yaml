- id: sec.traffic-inspection
  en:
    term: traffic inspection
    definition: >-
      Examining network traffic, beyond its addresses and ports, to detect and
      block threats or policy violations. For encrypted traffic this means
      decrypting it at an inspection point first.
  es:
    verdict: translated
    forms:
      - text: inspección de tráfico
        usedBy: [engineers, microsoft]
        article: la
        kind: noun
        primary: true
        note: >-
          Also "inspección del tráfico", in Microsoft's and AWS's pages.
          Inspecting encrypted traffic is "inspección de TLS" or "inspección
          TLS".
      - text: inspección profunda de paquetes
        usedBy: [aws]
        article: la
        kind: noun
        note: Deep packet inspection. The English acronym DPI is kept.
    definition: >-
      Análisis del tráfico de red, más allá de las direcciones y los puertos,
      para detectar y bloquear amenazas o incumplimientos de la política.
    examples:
      - es: La inspección de tráfico cifrado se hace en el cortafuegos de salida.
        en: Inspection of encrypted traffic is done on the egress firewall.
