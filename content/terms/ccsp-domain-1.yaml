- id: tech.blockchain
  en:
    term: blockchain
    definition: >-
      A distributed ledger in which records are grouped into blocks, each
      cryptographically chained to the previous one and replicated across
      many nodes, making past entries very hard to alter.
  es:
    verdict: both
    forms:
      - text: blockchain
        usedBy: [official, engineers]
        article: la
        kind: noun
        primary: true
        note: >-
          The English word is the working term, in official guidance as well
          as in engineering blogs.
      - text: cadena de bloques
        usedBy: [official, engineers, aws]
        headline: true
        article: la
        kind: noun
        plural: las cadenas de bloques
        note: >-
          The translation, usually given once beside the English: "blockchain
          o cadena de bloques". AWS's Spanish page uses it throughout.
    definition: >-
      Registro distribuido en el que los datos se agrupan en bloques
      enlazados criptográficamente y replicados en muchos nodos, lo que hace
      muy difícil modificarlos.
    examples:
      - es: Cada transacción queda registrada en la blockchain.
        en: Every transaction is recorded on the blockchain.
    watchOut: >-
      The gender is not settled. Paradigma and Adictos al Trabajo write "la
      blockchain"; INCIBE and Telefónica Tech write "el blockchain".
  topics: [crypto]
  technology: []
  curriculum:
