- id: fw.iso-27017
  en:
    term: ISO/IEC 27017
    definition: >-
      The international code of practice for information security controls in
      cloud services. It adds cloud-specific guidance to the ISO/IEC 27002
      controls, and some extra controls, for both providers and customers.
  es:
    verdict: english-kept
    forms:
      - text: ISO/IEC 27017
        usedBy: [google, microsoft]
        article: la
        kind: noun
        primary: true
        note: >-
          The designation is the same in Spanish, as in "la norma ISO/IEC
          27017". The standard has been adopted in Spain as a
          UNE-EN standard, with the title "Código de prácticas para los
          controles de seguridad de la información basados en la norma
          ISO/IEC 27002 para los servicios en nube".
      - text: ISO 27017
        usedBy: [engineers]
        article: la
        kind: noun
        note: The short form, as in lists of a provider's certifications.
    definition: >-
      Norma internacional con directrices sobre los controles de seguridad de
      la información para los servicios en la nube, basada en la ISO/IEC
      27002.
    examples:
      - es: El proveedor cumple la norma ISO/IEC 27017.
        en: The provider complies with the ISO/IEC 27017 standard.
    watchOut: >-
      Feminine when norma is understood: "la ISO/IEC 27017". After estándar
      it is masculine, and an AEPD decision writes "el ISO IEC 27017".
  topics: [grc]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
    - { cert: CISSP, outline: "2027-04", domain: 1 }
