- id: sec.secure-by-design
  en:
    term: secure by design
    definition: >-
      Building security into a system's requirements and architecture from
      the outset, so that it is a property of the design rather than
      something added after the system is built.
  es:
    verdict: both
    forms:
      - text: seguridad desde el diseño
        usedBy: [official, microsoft]
        article: la
        kind: noun
        primary: true
        note: >-
          The wording of the ENS ("Seguridad desde el diseño") and of
          Microsoft's Spanish pages. As an adjective, Google's pages write
          "segura desde el diseño". It follows the same pattern as the GDPR's
          "protección de datos desde el diseño", which the AEPD also calls
          "privacidad desde el diseño".
      - text: seguridad por diseño
        usedBy: [engineers]
        article: la
        kind: noun
        note: The more literal version, seen in job adverts and blogs.
      - text: security by design
        usedBy: [engineers]
        headline: true
        article: el
        kind: noun
        note: >-
          The English phrase is common in job adverts, as "security by
          design" or "secure by design".
    definition: >-
      Enfoque que incorpora la seguridad en los requisitos y en la
      arquitectura de un sistema desde el principio, en lugar de añadirla
      después.
    examples:
      - es: La seguridad desde el diseño evita muchos cambios costosos al final del proyecto.
        en: Security by design avoids many costly changes at the end of the project.
    watchOut: >-
      Do not confuse it with "seguridad por defecto" (secure by default),
      which the ENS states as a separate rule.
  topics: [architecture, appsec]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
    - { cert: CISSP, outline: "2027-04", domain: 3 }
  related: [sec.sdlc, tech.devsecops, sec.threat-modelling, sec.security-baseline]
  sources:
