          INCIBE's glossary lists it among the principles of hardening
          (bastionado), with mínimos privilegios.
      - text: seguridad por capas
        usedBy: [google]
        article: la
        kind: noun
        note: >-
          "Layered security", the same idea in other words, on Google Cloud's
          pages for Spain.
      - text: líneas de defensa
