- id: sec.data-obfuscation
  en:
    term: data obfuscation
    definition: >-
      An umbrella term for techniques that make data unintelligible or
      unattributable to anyone not authorised to see it, such as masking,
      tokenization, shuffling and substitution, while keeping it usable for a
      defined purpose.
  es:
    verdict: translated
    forms:
      - text: ofuscación
        usedBy: [official, engineers, google, microsoft, aws]
        article: la
        kind: noun
        primary: true
        note: >-
          Add "de datos" when the context does not make it clear: AWS writes
          "ofuscación de datos".
      - text: ofuscar
        usedBy: [official]
        kind: verb
        note: >-
          To obfuscate. An entry in INCIBE's glossary, and one of the AEPD's
          privacy-by-design tactics: making personal data unintelligible to
          those not authorised to use it.
    definition: >-
      Conjunto de técnicas que hacen que los datos sean ininteligibles para
      quien no está autorizado a verlos, sin que dejen de ser útiles.
    examples:
      - es: La ofuscación de los datos reduce el riesgo en los entornos de pruebas.
        en: Obfuscating the data reduces the risk in test environments.
    watchOut: >-
      On its own, ofuscación usually makes a Spanish engineer think of
      obfuscated source code, not data: that is the sense INCIBE's glossary
      and Telefónica Tech's blog describe. Say "ofuscación de datos" if there
      is any doubt.
