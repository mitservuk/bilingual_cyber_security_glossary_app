- id: sec.digital-certificate
  en:
    term: digital certificate
    definition: >-
      An electronic document, normally in X.509 format, in which a certificate
      authority binds a public key to the identity of a person, organisation,
      device or service, and signs the binding so that others can trust it.
  es:
    verdict: translated
    forms:
      - text: certificado digital
        usedBy: [official, engineers, microsoft, aws]
        article: el
        kind: noun
        primary: true
        note: >-
          For servers people usually name the type: "certificados TLS/SSL",
          "certificados X.509".
      - text: certificado electrónico
        usedBy: [official]
        article: el
        kind: noun
        note: The term in Spanish law (Ley 6/2020) and in the ENS.
      - text: certificado cualificado
        usedBy: [official, eu]
        article: el
        kind: noun
        register: formal
        note: >-
          A qualified certificate under eIDAS, issued by a qualified trust
          service provider. The ENS requires them for some controls.
    definition: >-
      Documento electrónico, firmado por una autoridad de certificación, que
      vincula una clave pública con la identidad de su titular.
    examples:
      - es: El certificado digital del servidor caduca la semana que viene.
        en: The server's digital certificate expires next week.
    watchOut: >-
      Outside work, "el certificado digital" is also the personal certificate
      (often issued by the FNMT) that people in Spain use to deal online with
      the tax office and other public bodies. Say which certificate you mean.
