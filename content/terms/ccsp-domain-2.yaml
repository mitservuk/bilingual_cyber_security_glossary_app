- id: sec.byok
  en:
    term: bring your own key
    acronym: BYOK
    definition: >-
      A cloud arrangement in which the customer generates key material in its
      own environment and imports it into the provider's key management
      service, instead of using keys the provider generates. The customer
      controls the origin and lifetime of the key, though the provider still
      handles it in use.
  es:
    verdict: english-kept
    acronym: BYOK
    forms:
      - text: BYOK
        usedBy: [microsoft, oracle, aws]
        article: el
        kind: noun
        primary: true
        note: >-
          Kept in English. There is no settled Spanish expansion: each vendor
          glosses it differently.
      - text: traer tu propia clave
        usedBy: [microsoft]
        kind: verb
        note: >-
          Microsoft's gloss. Oracle writes "traer mis propias claves (BYOK)"
          and AWS "utilice su propia clave".
      - text: claves gestionadas por el cliente
        usedBy: [google, microsoft]
        article: las
        kind: noun
        note: >-
          Customer-managed keys (CMK, or CMEK at Google), the wider category
          that BYOK belongs to. Microsoft's pages also say "claves
          administradas por el cliente".
    definition: >-
      Modelo en el que el cliente genera sus propias claves de cifrado y las
      importa en el servicio de gestión de claves del proveedor de la nube.
    examples:
      - es: >-
          El cliente exige BYOK: quiere generar las claves en su propio HSM.
        en: >-
          The customer requires BYOK: they want to generate the keys in their
          own HSM.
    watchOut: >-
      BYOK has a second meaning in AI tooling: supplying your own API key for
      a model provider, which has nothing to do with encryption keys.
