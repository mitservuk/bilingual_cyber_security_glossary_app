- id: law.phi
  en:
    term: protected health information
    acronym: PHI
    definition: >-
      Under the United States HIPAA rules, individually identifiable health
      information held or transmitted by a covered entity or its business
      associates. It is a US legal category; the European counterpart is
      health data, a special category of personal data under the GDPR.
  es:
    verdict: both
    acronym: PHI
    forms:
      - text: datos de salud
        usedBy: [official, engineers]
        article: los
        kind: noun
        primary: true
        note: >-
          Spain's own category, used by the AEPD and in the Spanish data
          protection act, and what to say whenever HIPAA is not the subject.
      - text: PHI
        usedBy: [microsoft, aws]
        headline: true
        article: la
        kind: noun
        note: >-
          Kept in English when the subject is HIPAA itself, after a translated
          expansion that varies: "información sanitaria protegida" (AWS) or
          "información médica protegida" (Microsoft, Google Cloud).
      - text: datos relativos a la salud
        usedBy: [eu, official]
        article: los
        kind: noun
        register: formal
        note: >-
          The defined term in the GDPR's Spanish text (Article 4(15)).
    definition: >-
      En la normativa estadounidense HIPAA, información de salud que permite
      identificar a una persona. En España el concepto equivalente es el de
      datos de salud, protegidos por el RGPD.
    examples:
      - es: Esta aplicación trata datos de salud, así que necesita una evaluación de impacto.
        en: This application processes health data, so it needs an impact assessment.
    watchOut: >-
      PHI belongs to HIPAA, which Microsoft's own Spanish page describes as
      United States healthcare law. In a Spanish contract or risk assessment
      write datos de salud or datos relativos a la salud and cite the RGPD.
