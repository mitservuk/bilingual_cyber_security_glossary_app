- id: law.legal-hold
  en:
    term: legal hold
    definition: >-
      An instruction to suspend the normal deletion of records and preserve
      everything that may be relevant to litigation, an investigation or an
      audit that is pending or reasonably expected. It overrides retention
      schedules until it is lifted, and comes from US litigation practice.
  es:
    verdict: both
    forms:
      - text: retención legal
        usedBy: [engineers, aws, microsoft]
        article: la
        kind: noun
        primary: true
        plural: las retenciones legales
        note: >-
          The translation used for the product feature: AWS S3 Object Lock and
          Azure immutable storage both call it this, and a Telefónica Tech
          post lists it as one outcome of a retention class.
      - text: suspensión legal
        usedBy: [microsoft]
        article: la
        kind: noun
        note: >-
          Microsoft's other translation, used beside retención legal in its
          eDiscovery and Azure Storage pages. A litigation hold on an Exchange
          mailbox is "retención por juicio".
      - text: legal hold
        article: el
        kind: noun
        note: >-
          The English term, kept when the hold comes from US-style litigation
          or a multinational's legal department. Not confirmed on a page that
          could be opened.
      - text: bloqueo de los datos
        usedBy: [official]
        article: el
        kind: noun
        note: >-
          Not a translation but the nearest duty in Spanish law. Under article
          32 of the LOPDGDD, personal data due for rectification or deletion
          is first blocked: kept, with processing barred, only for judges,
          prosecutors and public authorities.
    definition: >-
      Orden de conservar, sin modificarlos ni borrarlos, todos los datos que
      puedan ser relevantes para un litigio o una investigación, aunque haya
      vencido su plazo de conservación.
    examples:
      - es: Hemos aplicado una retención legal al bucket hasta que termine la investigación.
        en: We have placed a legal hold on the bucket until the investigation is over.
    watchOut: >-
      Legal hold is a US litigation concept with no single Spanish
      equivalent. Besides the LOPDGDD's bloqueo, Spanish criminal procedure
      has the "orden de conservación de datos" (article 588 octies of the Ley
      de Enjuiciamiento Criminal), by which prosecutors or police can require
      stored data to be preserved for up to 90 days, extendable to 180.
  topics: [grc, data]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 1 }
