- id: grc.data-owner
  en:
    term: data owner
    definition: >-
      The person or business unit accountable for a set of data: they decide
      its classification, who may use it and how it must be protected. In a
      cloud contract this accountability stays with the customer.
  es:
    verdict: both
    forms:
      - text: propietario del dato
        usedBy: [engineers]
        article: el
        kind: noun
        primary: true
        note: >-
          Telefónica Tech's wording. The plural without an article,
          "propietarios de datos", is what Telefónica Tech, AWS and Microsoft
          write when they list the role.
      - text: data owner
        usedBy: [engineers]
        headline: true
        article: el
        kind: noun
        plural: los data owners
        note: >-
          The English role name is kept in Spanish data-governance writing,
          next to "data steward".
      - text: responsable de la información
        usedBy: [official]
        article: el
        kind: noun
        register: formal
        note: >-
          The role in Spain's national security framework (ENS) that decides
          the security requirements of the information handled.
    definition: >-
      Persona o área de negocio que responde de un conjunto de datos y decide
      cómo se clasifica, quién puede usarlo y cómo se protege.
    examples:
      - es: El propietario del dato decide quién puede acceder a la información.
        en: The data owner decides who can access the information.
    watchOut: >-
      Responsable is a noun here: the person in charge. Do not confuse the
      ENS's "responsable de la información" with the GDPR's "responsable del
      tratamiento", which is the data controller.
