        article: la
        kind: noun
        note: The literal expansion, used to explain the acronym.
    say: Said letter by letter, "te-ele-ese".
    definition: >-
      Protocolo criptográfico que autentica al servidor con certificados y
      cifra las comunicaciones entre dos extremos; es el sucesor de SSL.
    examples:
      - es: Todas las conexiones con la API deben usar TLS 1.2 o superior.
        en: All connections to the API must use TLS 1.2 or higher.
