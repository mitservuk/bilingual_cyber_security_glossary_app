- id: sec.hashing
  en:
    term: hashing
    definition: >-
      Applying a one-way function that maps input of any size to a
      fixed-length value (the hash or digest). The same input always gives the
      same value and the input cannot feasibly be recovered from it, so hashes
      are used to check integrity and to store passwords.
  es:
    verdict: english-kept
    forms:
      - text: hash
        usedBy: [official, engineers, aws]
        article: el
        kind: noun
        primary: true
        plural: los hashes
        note: >-
          Names both the function ("la función hash") and the value it
          produces, as the AEPD's guide points out.
      - text: hashing
        usedBy: [official, engineers]
        article: el
        kind: noun
        note: >-
          The English -ing form is used for the technique: "algoritmos de
          hashing".
      - text: función resumen
        usedBy: [official]
        article: la
        kind: noun
        register: formal
        note: >-
          The Spanish name. INCIBE's glossary and the AEPD give it as a
          synonym of hash.
    say: Said "jash", with the h sounded like a Spanish j.
    definition: >-
      Función de un solo sentido que transforma datos de cualquier tamaño en
      un valor de longitud fija, y que sirve para comprobar la integridad o
      guardar contraseñas.
    examples:
      - es: Guardamos el hash de la contraseña, nunca la contraseña en claro.
        en: We store the hash of the password, never the password in clear text.
    watchOut: >-
      Resumen normally means a summary. In cryptography el resumen is the hash
      value: the AEPD lists hash, resumen and digest as names for the same
      result.
  topics: [crypto]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 3 }
  related: [sec.integrity, sec.digital-signature, sec.encryption, sec.pseudonymization]
