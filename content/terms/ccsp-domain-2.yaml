- id: sec.data-breach
  en:
    term: data breach
    definition: >-
      A security incident in which data is accessed, disclosed, altered, lost
      or destroyed without authorisation. Where personal data is involved, the
      GDPR requires notification to the supervisory authority within 72 hours.
  es:
    verdict: translated
    forms:
      - text: brecha de seguridad
        usedBy: [official, engineers, google]
        article: la
        kind: noun
        primary: true
        note: >-
          The everyday term, and the heading in INCIBE's glossary, which
          defines it in terms of personal data.
      - text: brecha de datos
        usedBy: [official, engineers]
        article: la
        kind: noun
        note: >-
          The AEPD's own term is the fuller "brecha de datos personales".
      - text: violación de la seguridad de los datos personales
        usedBy: [official, eu]
        article: la
        kind: noun
        register: formal
        note: >-
          The wording of the GDPR's Spanish text for "personal data breach".
          The AEPD's notification guide says it uses "brecha de datos
          personales" with the same meaning.
      - text: filtración de datos
        usedBy: [engineers, microsoft]
        article: la
        kind: noun
        note: >-
          A leak: data that has got out. Microsoft uses it for "data leak"
          and sets it against "vulneración de datos".
      - text: vulneración de datos
        usedBy: [microsoft, oracle]
        article: la
        kind: noun
        note: >-
          Microsoft's and Oracle's translation of "data breach" in their
          Spanish pages.
    definition: >-
      Incidente de seguridad en el que alguien accede a los datos, los
      divulga, los altera o los destruye sin autorización.
    examples:
      - es: >-
          Hay que notificar la brecha de seguridad a la AEPD en un plazo de 72
          horas.
        en: >-
          The data breach has to be reported to the AEPD within 72 hours.
    watchOut: >-
      Brecha on its own just means a gap: "la brecha de género" is the gender
      gap. For data that escapes, INCIBE's glossary has a separate entry,
      "fuga de datos".
  topics: [incident, data]
  technology: []
  curriculum:
