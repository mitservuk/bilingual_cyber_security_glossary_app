- id: sec.pseudonymization
  en:
    term: pseudonymization
    definition: >-
      Processing personal data so that it can no longer be attributed to a
      specific person without additional information, which is kept separately
      and protected. Under the GDPR, pseudonymised data is still personal
      data.
  es:
    verdict: translated
    forms:
      - text: seudonimización
        usedBy: [eu, official, engineers, google]
        article: la
        kind: noun
        primary: true
        note: >-
          The spelling of the GDPR's Spanish text (Article 4(5)), of the
          Spanish data protection act and of the AEPD: no initial p. The data
          is "datos seudonimizados".
      - text: pseudonimización
        usedBy: [microsoft]
        article: la
        kind: noun
        note: >-
          The spelling with p. Microsoft's Spanish documentation uses it, and
          an INCIBE blog post writes "datos pseudonimizados".
    definition: >-
      Tratamiento de los datos personales de modo que ya no puedan atribuirse
      a una persona sin utilizar información adicional, que se guarda por
      separado.
    examples:
      - es: La seudonimización reduce el riesgo, pero los datos siguen siendo personales.
        en: Pseudonymisation reduces the risk, but the data is still personal data.
    watchOut: >-
      An English speaker reaches for pseudo-. The law and the regulator write
      seudonimización, without the p, so use that in anything formal. And it
      is not anonimización: the AEPD stresses that pseudonymised data, and
      the additional information that goes with it, remain subject to the
      RGPD.
  topics: [data, grc]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 2 }
