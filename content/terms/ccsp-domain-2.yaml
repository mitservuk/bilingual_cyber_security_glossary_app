- id: sec.data-discovery
  en:
    term: data discovery
    definition: >-
      Finding and inventorying the data an organisation holds across its
      repositories, usually by automated scanning that also identifies which
      of it is sensitive, as the first step towards classifying and protecting
      it.
  es:
    verdict: both
    forms:
      - text: descubrimiento de datos
        usedBy: [google, microsoft, aws]
        article: el
        kind: noun
        primary: true
        note: >-
          The literal translation. Google Cloud's service is "descubrimiento
          de datos sensibles".
      - text: data discovery
        usedBy: [engineers]
        headline: true
        article: el
        kind: noun
        note: >-
          The English term, left as it is in Spain-based engineering blogs.
      - text: detección de datos
        usedBy: [microsoft, oracle, aws]
        article: la
        kind: noun
        note: >-
          Microsoft's usual translation ("¿Qué es la detección de datos?").
          AWS's Macie documentation and Oracle say "detección de datos
          confidenciales".
    definition: >-
      Localización e inventario de los datos que una organización guarda en
      sus repositorios, identificando cuáles son sensibles.
    examples:
      - es: El descubrimiento de datos encontró datos personales en un bucket sin cifrar.
        en: Data discovery found personal data in an unencrypted bucket.
    watchOut: >-
      The vendors do not agree, and Microsoft and AWS each use both
      translations. Detección is also the ordinary word for detection, as in
      "sistemas de detección de intrusiones", so "detección de datos" needs
      context to be understood.
  topics: [data, asset]
  technology: []
  curriculum:
