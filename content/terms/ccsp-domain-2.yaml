- id: sec.drm
  en:
    term: digital rights management
    acronym: DRM
    definition: >-
      Technical controls that restrict how digital content such as video,
      music, e-books or software can be copied, played or shared after it has
      been distributed, usually by encrypting it and issuing licences to
      authorised players.
  es:
    verdict: both
    acronym: DRM
    forms:
      - text: DRM
        usedBy: [engineers, aws, microsoft]
        article: el
        kind: noun
        primary: true
        note: >-
          The acronym is the working term and is masculine: Xataka writes "el
          DRM llega a los coches". AWS speaks of "sistemas DRM", Microsoft of
          "DRM de hardware".
      - text: gestión de derechos digitales
        usedBy: [engineers, aws]
        headline: true
        article: la
        kind: noun
        note: >-
          The usual translation, normally written next to the acronym: "la
          gestión de derechos digitales o DRM" (Telefónica Tech), "gestión de
          derechos digitales (DRM)" (AWS).
      - text: administración de derechos digitales
        usedBy: [microsoft]
        article: la
        kind: noun
        note: Microsoft's translation in its Spanish documentation.
    definition: >-
      Conjunto de tecnologías que controlan el acceso a los contenidos
      digitales y limitan su copia y su uso una vez distribuidos.
    examples:
      - es: Este libro electrónico tiene DRM y no se puede copiar a otro dispositivo.
        en: This e-book has DRM and cannot be copied to another device.
    watchOut: >-
      "Derechos digitales" has a second, unrelated meaning in Spain: people's
      digital rights. The data protection law's full title ends "y garantía
      de los derechos digitales", which has nothing to do with DRM.
  topics: [data]
  technology: []
