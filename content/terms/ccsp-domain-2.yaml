- id: sec.certificate-authority
  en:
    term: certificate authority
    acronym: CA
    definition: >-
      The trusted entity that verifies an applicant's identity, issues and
      signs digital certificates, and revokes them when they can no longer be
      trusted. A root CA anchors the chain of trust; subordinate CAs issue
      under it.
  es:
    verdict: translated
    acronym: CA
    forms:
      - text: autoridad de certificación
        usedBy: [official, engineers, google, aws]
        article: la
        kind: noun
        primary: true
        note: >-
          The acronym is usually the English CA, treated as feminine: "la CA".
          INCIBE gives "AC o CA", and Google's pages for Spain write AC.
      - text: entidad de certificación
        usedBy: [engineers, microsoft, aws]
        article: la
        kind: noun
      - text: autoridad certificadora
        usedBy: [official, microsoft, aws]
        article: la
        kind: noun
      - text: prestador de servicios de confianza
        usedBy: [official, eu]
        article: el
        kind: noun
        register: formal
        note: >-
          "Trust service provider", the term in eIDAS and Spanish law for the
          organisations that issue certificates. A qualified one is "un
          prestador cualificado de servicios de confianza".
    say: CA is said letter by letter, "ce-a".
    definition: >-
      Entidad de confianza que comprueba la identidad del solicitante y emite,
      firma y revoca certificados digitales.
    examples:
      - es: >-
          El certificado tiene que estar firmado por una autoridad de
          certificación de confianza.
        en: The certificate has to be signed by a trusted certificate authority.
    watchOut: >-
      In the ENS, "entidad de certificación" is something else: the body that
      audits a system and certifies its compliance, not a CA.
  topics: [crypto]
  technology: []
