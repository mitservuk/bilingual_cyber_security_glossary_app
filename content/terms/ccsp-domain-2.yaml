- id: cloud.file-storage
  en:
    term: file storage
    definition: >-
      Storage that organises data as files in a hierarchy of directories and
      shares it over a network file protocol such as NFS or SMB.
  es:
    verdict: translated
    forms:
      - text: almacenamiento de archivos
        usedBy: [official, engineers, google, microsoft, oracle, aws]
        article: el
        kind: noun
        primary: true
      - text: almacenamiento de ficheros
        usedBy: [official, engineers]
        article: el
        kind: noun
        note: >-
          Used in the 2026 Spanish vocational-training decree on cloud
          services and by Paradigma Digital. The vendors' Spanish pages say
          archivos.
    definition: >-
      Almacenamiento que organiza los datos como archivos dentro de una
      jerarquía de carpetas y los comparte por la red.
    examples:
      - es: Los dos servidores comparten el mismo almacenamiento de archivos por NFS.
        en: The two servers share the same file storage over NFS.
    watchOut: >-
      Fichero and archivo both mean a computer file, and the same decree uses
      both. Watch the plural: on AWS's pages "almacenamiento de archivo",
