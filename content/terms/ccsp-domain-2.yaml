- id: cloud.object-storage
  en:
    term: object storage
    definition: >-
      Storage that keeps each item as a self-contained object (data, metadata
      and a unique identifier) in a flat namespace reached through an API,
      rather than as files in a hierarchy or blocks on a disk.
  es:
    verdict: translated
    forms:
      - text: almacenamiento de objetos
        usedBy: [official, engineers, google, microsoft, oracle, aws]
        article: el
        kind: noun
        primary: true
        note: >-
          Product names stay in English: Object Storage, Blob Storage, Cloud
          Storage, S3.
      - text: bucket
        usedBy: [engineers]
        article: el
        kind: noun
        plural: los buckets
        note: >-
          The container that holds the objects. Kept in English: "un bucket
          S3 público".
    definition: >-
      Almacenamiento que guarda cada elemento como un objeto independiente,
      con sus datos, sus metadatos y un identificador único, al que se accede
      mediante una API.
    examples:
      - es: Las copias de seguridad se guardan en un almacenamiento de objetos cifrado.
        en: The backups are kept in encrypted object storage.
  topics: [architecture, data]
  technology: [cloud-general]
