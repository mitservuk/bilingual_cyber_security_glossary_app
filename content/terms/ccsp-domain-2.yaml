- id: law.pii
  en:
    term: personally identifiable information
    acronym: PII
    definition: >-
      Information that identifies a specific individual, on its own or when
      combined with other data. It is a term of United States law and
      standards with no single definition, and is generally narrower than the
      GDPR's "personal data".
  es:
    verdict: both
    acronym: PII
    forms:
      - text: datos personales
        usedBy: [eu, official, engineers]
        article: los
        kind: noun
        primary: true
        note: >-
          What Spain says for the concept, and the only term with legal
          meaning there. Telefónica Tech's blog treats the two as equivalent:
          "los datos personales (PII)".
      - text: PII
        usedBy: [engineers, microsoft, aws]
        headline: true
        article: la
        kind: noun
        note: >-
          The English acronym is kept, in engineering blogs and in vendor
          documentation, usually without an article: "datos que contienen
          PII".
      - text: información de identificación personal
        usedBy: [microsoft, aws]
        article: la
        kind: noun
        note: >-
          The vendors' literal translation, normally followed by the English
          acronym in brackets.
      - text: información personal identificable
        usedBy: [engineers, microsoft]
        article: la
        kind: noun
        note: >-
          Another literal translation, seen in a Telefónica Tech post and in
          Microsoft's documentation.
    definition: >-
      Información que permite identificar a una persona concreta. Es un
      término estadounidense; en España y en la UE el concepto legal es el de
      datos personales.
    examples:
      - es: Los logs no deben contener datos personales.
        en: The logs must not contain PII.
    watchOut: >-
      PII and datos personales do not have the same scope. The GDPR's
      definition expressly reaches online identifiers and pseudonymised data,
      which American definitions of PII do not always cover. In a Spanish
      contract or compliance document write datos personales, not PII.
  topics: [data, grc]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 2 }
  related: [law.personal-data, law.phi, sec.sensitive-data, fw.gdpr]
  sources:
    - label: "Reglamento (UE) 2016/679 (RGPD), artículo 4.1, en el BOE"
