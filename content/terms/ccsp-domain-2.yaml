- id: sec.data-deletion
  en:
    term: data deletion
    definition: >-
      Removing data from a system so that it is no longer available for use.
      In the cloud, deleting a record does not by itself guarantee that every
      replica and backup is gone, so deletion is usually backed by
      sanitization or cryptographic erasure.
  es:
    verdict: translated
    forms:
      - text: borrado de datos
        usedBy: [official, engineers, microsoft]
        article: el
        kind: noun
        primary: true
        note: >-
          The everyday word, from borrar: "borrado programado" in a Telefónica
          Tech post, "borrado de datos de sesión" in an AEPD guide.
      - text: eliminación de datos
        usedBy: [official, google, microsoft]
        article: la
        kind: noun
        note: >-
          From eliminar, the verb on vendors' Spanish pages. Microsoft writes
          "eliminación permanente" for permanent deletion.
      - text: supresión
        usedBy: [official, eu]
        article: la
        kind: noun
        register: formal
        note: >-
          The legal word. The GDPR's right to erasure is "el derecho de
          supresión", and the LOPDGDD follows it.
    definition: >-
      Eliminación de los datos de un sistema para que dejen de estar
      disponibles.
    examples:
      - es: El borrado de datos se ejecuta de forma automática al terminar el plazo de conservación.
        en: Data deletion runs automatically when the retention period ends.
    watchOut: >-
      Under Spanish data protection law, deleting personal data does not mean
      destroying it at once. Article 32 of the LOPDGDD obliges the controller
      to block it first ("bloqueo de los datos"), keeping it only for courts,
      prosecutors and public authorities, and to destroy it when the
      limitation period for liability has passed.
  topics: [data]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 2 }
