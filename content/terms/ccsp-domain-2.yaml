- id: sec.envelope-encryption
  en:
    term: envelope encryption
    definition: >-
      Encrypting data with a data encryption key (DEK) and then encrypting
      that key with a key encryption key (KEK) held in a key management
      service or HSM. Only the small wrapped key goes to the KMS, and the KEK
      can be rotated without re-encrypting the data.
  es:
    verdict: both
    forms:
      - text: cifrado de sobres
        usedBy: [microsoft, oracle, aws]
        article: el
        kind: noun
        primary: true
        note: >-
          The translation in vendor documentation, which is not uniform: AWS
          also writes "cifrado de sobre" and Microsoft "cifrado por
          envolvente". The two keys are "la clave de cifrado de datos (DEK)"
          and "la clave de cifrado de claves (KEK)".
      - text: envelope encryption
        article: el
        kind: noun
        note: >-
          The English term, also used as it stands when engineers talk about
          a KMS.
    definition: >-
      Técnica en la que los datos se cifran con una clave de datos (DEK) y esa
      clave se cifra a su vez con otra clave (KEK) guardada en el servicio de
      gestión de claves.
    examples:
      - es: >-
          Con el cifrado de sobres, cada objeto se cifra con su propia clave
          de datos.
        en: >-
          With envelope encryption, each object is encrypted with its own data
          key.
    watchOut: >-
      Sobre here is the noun, an envelope, not the preposition sobre (on,
      about).
  topics: [crypto]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 3 }
    - { cert: AZ-500, outline: "2026-01", domain: 3 }
    - { cert: AZ-305, outline: "2026-04", domain: 2 }
    - { cert: SC-100, outline: "2026-10", domain: 4 }
    - { cert: AWS-SA-ASSOCIATE, outline: "SAA-C03", domain: 1 }
    - { cert: AWS-SA-PROFESSIONAL, outline: "SAP-C02", domain: 2 }
    - { cert: AWS-SECURITY-SPECIALTY, outline: "SCS-C03", domain: 5 }
    - { cert: GCP-PCA, outline: "current", domain: 3 }
    - { cert: GCP-PCSE, outline: "current", domain: 3 }
    - { cert: KCSA, outline: "current", domain: 6 }
  related: [sec.key-management, sec.symmetric-encryption, sec.key-rotation, sec.hsm]
  sources:
