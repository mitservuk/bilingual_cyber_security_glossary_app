- id: sec.anonymization
  en:
    term: anonymization
    definition: >-
      Irreversibly transforming personal data so that the people it describes
      can no longer be identified, directly or indirectly. Data that is truly
      anonymised falls outside data protection law.
  es:
    verdict: translated
    forms:
      - text: anonimización
        usedBy: [official, engineers]
        article: la
        kind: noun
        primary: true
        note: >-
          The AEPD's term, also used in the Spanish data protection act
          (LOPDGDD). The result is "datos anonimizados".
      - text: anonimizar
        usedBy: [engineers]
        kind: verb
        note: To anonymise.
      - text: información anónima
        usedBy: [eu, official]
        article: la
        kind: noun
        register: formal
        note: >-
          The wording of the GDPR's Spanish text, which speaks of anonymous
          information and never uses the noun anonimización.
      - text: desidentificación
        usedBy: [google]
        article: la
        kind: noun
        note: >-
          De-identification. Google Cloud's word for the wider family of
          transformations that includes masking and tokenization.
    definition: >-
      Tratamiento irreversible de los datos personales para que ya no se
      pueda identificar a las personas a las que se refieren.
    examples:
      - es: Tras la anonimización, estos datos ya no son datos personales.
        en: After anonymisation, this data is no longer personal data.
    watchOut: >-
      Do not use it loosely. For the AEPD, data is anonymised only when there
      is no reasonable likelihood of anyone re-identifying the person; if it
      can be re-linked using additional information, it is seudonimizado and
      still personal data. AEPD guidance also calls anonymisation
      "disociación".
  topics: [data, grc]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 2 }
  related: [sec.pseudonymization, sec.data-masking, law.personal-data, fw.gdpr]
  sources:
    - label: "AEPD, blog: Anonimización y seudonimización"
      url: "https://www.aepd.es/prensa-y-comunicacion/blog/anonimizacion-y-seudonimizacion"
      found:
        - "Anonimización y seudonimización son dos conceptos que se confunden"
        - "La información anónima es un conjunto de datos"
        - "no exista una probabilidad razonable"
      checked: 2026-11-14
    - label: "AEPD, Orientaciones y garantías en los procedimientos de anonimización de datos personales"
      url: "https://www.aepd.es/guias/guia-orientaciones-procedimientos-anonimizacion.pdf"
      found: ["anonimización o disociación definitiva de los datos personales"]
      checked: 2026-11-14
    - label: "Ley Orgánica 3/2018 (LOPDGDD)"
      url: "https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673"
