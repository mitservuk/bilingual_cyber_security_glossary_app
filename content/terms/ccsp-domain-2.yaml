- id: sec.accountability
  en:
    term: accountability
    definition: >-
      The principle that every action on a system or on data can be
      attributed to an identified person or entity, who can then be held to
      answer for it. In data protection law it is also the controller's duty
      to be able to demonstrate compliance.
  es:
    verdict: both
    forms:
      - text: rendición de cuentas
        usedBy: [official, eu, engineers, microsoft]
        article: la
        kind: noun
        primary: true
        note: >-
          The general translation: answering for what was done. It is the
          wording of DORA and the AI Act in Spanish, and of INCIBE, Microsoft
          and Spain-based engineering blogs.
      - text: accountability
        usedBy: [official, engineers]
        headline: true
        article: la
        kind: noun
        note: >-
          The English word is often kept, in brackets or on its own; an INCIBE
          post says it "no tiene una traducción precisa". Its gender is
          unsettled: INCIBE writes "la accountability", an AEPD guide "del
          accountability".
      - text: responsabilidad proactiva
        usedBy: [official, eu]
        article: la
        kind: noun
        note: >-
          The GDPR's own name for its accountability principle (article 5.2),
          and so the term the AEPD uses. It belongs to data protection only.
    definition: >-
      Principio por el que cada acción se puede atribuir a una persona o
      entidad identificada, que debe responder de ella.
    examples:
      - es: La rendición de cuentas exige saber quién ha accedido a cada dato.
        en: Accountability requires knowing who has accessed each piece of data.
    watchOut: >-
      Plain "responsabilidad" also turns up for accountability (Microsoft:
      "auditabilidad y responsabilidad"), but the same word covers
      responsibility and legal liability, as in "responsabilidad civil". In
      Spain's ENS, attributing actions to whoever performed them comes under
      trazabilidad.
