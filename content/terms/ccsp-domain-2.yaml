- id: grc.data-custodian
  en:
    term: data custodian
    definition: >-
      The party that holds and looks after data day to day on the owner's
      behalf, applying the controls the owner has set: storage, backup, access
      enforcement. In the cloud this is typically the provider or the
      operations team.
  es:
    verdict: translated
    forms:
      - text: custodio de los datos
        article: el
        kind: noun
        primary: true
        note: >-
          The direct translation. No Spain-based source checked uses it as a
          role name. Google Cloud's pages for Spain do write "custodios de
          datos", but there it translates "data stewards".
      - text: custodiar
        usedBy: [official]
        kind: verb
        note: >-
          To hold in safe keeping. Spain's national security framework (ENS)
          uses the verb for information and has a measure called "custodia"
          for storage media.
    definition: >-
      Quien guarda y cuida los datos en el día a día por cuenta del
      propietario, aplicando los controles que este ha decidido.
    examples:
      - es: >-
          El proveedor de la nube actúa como custodio de los datos, pero el
          propietario sigue siendo el cliente.
        en: >-
          The cloud provider acts as data custodian, but the owner is still
          the customer.
    watchOut: >-
      Custodian and steward get mixed up in translation. Google renders data
      steward as "custodio de datos", while Microsoft and AWS render it as
      "administrador de datos". In Microsoft's eDiscovery documentation,
      "custodios" are the people whose data is collected for a legal case.
  topics: [grc, data]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 1 }
  related: [grc.data-owner, law.data-controller, sec.chain-of-custody]
  sources:
