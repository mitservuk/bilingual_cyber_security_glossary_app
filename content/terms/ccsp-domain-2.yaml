- id: sec.hsm
  en:
    term: hardware security module
    acronym: HSM
    definition: >-
      A tamper-resistant hardware device that generates, stores and uses
      cryptographic keys inside a protected boundary, so that key material
      never leaves it in clear. Cloud providers offer HSMs as a managed
      service, usually validated against FIPS 140.
  es:
    verdict: both
    acronym: HSM
    forms:
      - text: HSM
        usedBy: [official, engineers]
        article: el
        kind: noun
        primary: true
        plural: los HSM
        note: >-
          The English acronym, masculine: "un HSM". The written plural varies:
          "los HSM" in Oracle's pages, "HSMs" in job adverts.
      - text: módulo de seguridad de hardware
        usedBy: [google, microsoft, oracle, aws]
        headline: true
        article: el
        kind: noun
        note: >-
          The expansion in vendor documentation. The AEPD writes it without
          the second de: "módulos de seguridad hardware".
    say: Said letter by letter, "hache-ese-eme".
    definition: >-
      Dispositivo de hardware resistente a manipulaciones que genera, guarda y
      usa claves criptográficas sin que salgan de él en claro.
    examples:
      - es: Las claves raíz se generan y se guardan en un HSM.
        en: The root keys are generated and stored in an HSM.
