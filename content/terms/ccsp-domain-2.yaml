- id: cloud.ephemeral-storage
  en:
    term: ephemeral storage
    definition: >-
      Storage that exists only for the life of the instance, container or
      function it is attached to. Its contents are lost when that resource
      stops or is replaced.
  es:
    verdict: translated
    forms:
      - text: almacenamiento efímero
        usedBy: [microsoft, aws]
        article: el
        kind: noun
        primary: true
      - text: almacenamiento temporal
        usedBy: [microsoft, aws]
        article: el
        kind: noun
        note: >-
          Temporary storage, used for the same thing. Microsoft gives the two
          as synonyms for a virtual machine's local disk, and AWS calls its
          instance store "el almacén de instancias".
      - text: efímero
        usedBy: [engineers, microsoft]
        kind: adjective
        note: >-
          The adjective is applied to the resources too: "los pods son
          efímeros", "discos de SO efímeros".
    definition: >-
      Almacenamiento que solo existe mientras vive la instancia, el contenedor
      o la función que lo usa; al pararse, los datos se pierden.
    examples:
      - es: >-
          No guardes nada importante en el almacenamiento efímero: se borra al
          reiniciar la instancia.
        en: >-
          Don't keep anything important in ephemeral storage: it is wiped when
          the instance restarts.
  topics: [architecture, data]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 3 }
    - { cert: AZ-500, outline: "2026-01", domain: 3 }
    - { cert: AZ-305, outline: "2026-04", domain: 4 }
    - { cert: SC-100, outline: "2026-10", domain: 1 }
