- id: sec.data-classification
  en:
    term: data classification
    definition: >-
      Assigning data to categories according to its sensitivity, its value and
      the legal obligations attached to it, so that proportionate handling and
      protection rules can be applied to each category.
  es:
    verdict: translated
    forms:
      - text: clasificación de la información
        usedBy: [official]
        article: la
        kind: noun
        primary: true
        note: >-
          INCIBE's term in its guidance for businesses. Its example scheme has
          three levels: confidencial, interna and pública.
      - text: clasificación de datos
        usedBy: [microsoft]
        article: la
        kind: noun
        note: >-
          The cloud vendors' wording. Microsoft writes "clasificación de
          datos"; AWS and Oracle write "clasificación de los datos".
      - text: calificación de la información
        usedBy: [official]
        article: la
        kind: noun
        register: formal
        note: >-
          The name of measure mp.info.2 in the ENS, Spain's national security
          framework, under which the person responsible for each piece of
          information assigns it a "nivel de seguridad".
    definition: >-
      Asignación de los datos a categorías según su sensibilidad, su valor y
      las obligaciones legales que les afectan, para protegerlos de forma
      proporcionada.
    examples:
      - es: La clasificación de la información es el primer paso para protegerla.
        en: Classifying information is the first step towards protecting it.
    watchOut: >-
      In the public sector, "información clasificada" and "materias
      clasificadas" mean classified material in the state-secrets sense, which
      has its own legislation. The ENS calls the grading of information
      calificación and keeps clasificada for that material. In a company,
      clasificación de la información is the normal term.
  topics: [data, grc]
  technology: []
  curriculum:
