- id: sec.homomorphic-encryption
  en:
    term: homomorphic encryption
    definition: >-
      Encryption that allows computation directly on ciphertext, so that the
      decrypted result matches what the same operations would have produced on
      the plaintext. It lets a cloud provider process data it cannot read, at
      a significant performance cost.
  es:
    verdict: translated
    forms:
      - text: cifrado homomórfico
        usedBy: [official, engineers, aws]
        article: el
        kind: noun
        primary: true
        note: >-
          The fully homomorphic kind is "cifrado totalmente homomórfico", with
          the English acronym FHE.
    definition: >-
      Cifrado que permite hacer cálculos directamente sobre los datos
      cifrados, sin descifrarlos.
    examples:
      - es: >-
          El cifrado homomórfico permite procesar los datos en la nube sin
          descifrarlos.
        en: >-
          Homomorphic encryption makes it possible to process data in the
          cloud without decrypting it.
  topics: [crypto, data]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 3 }
  related: [sec.data-in-use, cloud.confidential-computing, sec.encryption]
  sources:
