- id: sec.digital-signature
  en:
    term: digital signature
    definition: >-
      A cryptographic value computed over a message with the signer's private
      key, which anyone holding the matching public key can check. It shows
      who signed and that the content has not changed, and underpins
      non-repudiation.
  es:
    verdict: translated
    forms:
      - text: firma digital
        usedBy: [official, engineers, microsoft, oracle, aws]
        article: la
        kind: noun
        primary: true
        note: The technical term for the cryptographic mechanism.
      - text: firma electrónica
        usedBy: [official, eu, engineers]
        article: la
        kind: noun
        note: >-
          The legal term in eIDAS and in Spanish law, which grade it as
          "avanzada" or "cualificada". INCIBE's glossary treats the two as
          synonyms.
      - text: firmar
        usedBy: [official, engineers]
        kind: verb
        note: To sign. The signer is "el firmante".
    definition: >-
