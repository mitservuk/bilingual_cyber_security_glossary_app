- id: sec.symmetric-encryption
  en:
    term: symmetric encryption
    definition: >-
      Encryption in which the same secret key both encrypts and decrypts. It
      is fast enough to protect bulk data, but the key has to be shared
      securely between the parties.
  es:
    verdict: translated
    forms:
      - text: cifrado simétrico
        usedBy: [official, engineers, google, microsoft, oracle, aws]
        article: el
        kind: noun
        primary: true
        note: >-
          Google Cloud's pages for Spain write both "cifrado simétrico" and
          "encriptado simétrico".
      - text: criptografía simétrica
        usedBy: [official, aws]
        article: la
        kind: noun
        note: >-
          INCIBE's glossary gives it as a synonym. Job adverts also ask for
          "criptografía de clave simétrica".
    definition: >-
      Cifrado en el que se usa la misma clave secreta para cifrar y para
      descifrar.
    examples:
      - es: Usamos cifrado simétrico con AES-256 para los datos en reposo.
        en: We use symmetric encryption with AES-256 for data at rest.
