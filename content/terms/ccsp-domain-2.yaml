- id: sec.traceability
  en:
    term: traceability
    definition: >-
      The ability to follow an action, a change or a piece of data back
      through recorded events to its origin and to whoever or whatever was
      responsible for it.
  es:
    verdict: translated
    forms:
      - text: trazabilidad
        usedBy: [official, engineers, aws, microsoft]
        article: la
        kind: noun
        primary: true
        note: >-
          One of the five security dimensions of Spain's national security
          framework (ENS), labelled [T]. The ENS defines it by attribution:
          the actions of an entity "pueden ser trazadas de forma indiscutible
          hasta dicha entidad".
    definition: >-
      Propiedad que permite seguir una acción o un dato a través de los
      registros hasta su origen y hasta la entidad que la realizó.
    examples:
      - es: Sin registros de actividad no hay trazabilidad de los accesos.
        en: Without activity logs there is no traceability of access.
    watchOut: >-
      In engineering blogs trazabilidad also means tracing requests through
      microservices: "trazabilidad distribuida" is distributed tracing. The
      context tells you whether the subject is audit evidence or
      observability.
  topics: [detection, grc]
  technology: []
  curriculum:
