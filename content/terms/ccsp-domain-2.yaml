- id: sec.asymmetric-encryption
  en:
    term: asymmetric encryption
    definition: >-
      Encryption that uses a mathematically linked key pair: a public key that
      anyone may hold and a private key kept secret by its owner. What one key
      encrypts only the other can decrypt, which also makes digital signatures
      possible.
  es:
    verdict: translated
    forms:
      - text: cifrado asimétrico
        usedBy: [official, engineers, google, microsoft, oracle]
        article: el
        kind: noun
        primary: true
        note: >-
          The key pair is "el par de claves": la clave pública and la clave
          privada.
      - text: criptografía asimétrica
        usedBy: [official, engineers, aws]
        article: la
        kind: noun
      - text: criptografía de clave pública
        usedBy: [engineers, aws]
        article: la
        kind: noun
        note: >-
          Public-key cryptography. INCIBE's glossary says "cifrado de clave
          pública" and Google's pages "criptografía de claves públicas".
    definition: >-
      Cifrado que usa un par de claves relacionadas: una pública, que se puede
      compartir, y otra privada, que solo conoce su propietario.
    examples:
      - es: >-
          Con cifrado asimétrico, el mensaje se cifra con la clave pública del
          destinatario.
        en: >-
          With asymmetric encryption, the message is encrypted with the
          recipient's public key.
    watchOut: >-
      Do not mix up clave privada and clave secreta. La clave privada is the
      secret half of a key pair; "cifrado de clave secreta" is another name
      for symmetric encryption.
  topics: [crypto]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 3 }
  related: [sec.symmetric-encryption, sec.digital-signature, sec.pki, sec.encryption]
