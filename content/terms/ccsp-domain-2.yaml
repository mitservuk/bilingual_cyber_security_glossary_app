- id: cloud.block-storage
  en:
    term: block storage
    definition: >-
      Storage that presents fixed-size blocks to a host as a raw disk, on
      which the host builds its own file system. It is the usual backing for
      virtual machine disks and databases.
  es:
    verdict: translated
    forms:
      - text: almacenamiento de bloques
        usedBy: [engineers, oracle, aws]
        article: el
        kind: noun
        primary: true
      - text: almacenamiento en bloques
        usedBy: [google, aws]
        article: el
        kind: noun
        note: >-
          Google Cloud's wording on its pages for Spain. AWS uses it too,
          alongside "en bloque" and "por bloques".
    definition: >-
      Almacenamiento que ofrece al servidor bloques de tamaño fijo, como si
      fueran un disco, sobre los que el propio servidor crea su sistema de
      archivos.
    examples:
      - es: La base de datos necesita almacenamiento de bloques de alto rendimiento.
        en: The database needs high-performance block storage.
    watchOut: >-
      The preposition is not settled: de bloques, en bloques, en bloque and
      por bloques all appear, sometimes on the same vendor's pages. They mean
      the same thing.
  topics: [architecture, data]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 3 }
    - { cert: AZ-500, outline: "2026-01", domain: 3 }
    - { cert: AZ-305, outline: "2026-04", domain: 4 }
    - { cert: SC-100, outline: "2026-10", domain: 1 }
    - { cert: AWS-SA-ASSOCIATE, outline: "SAA-C03", domain: 2 }
    - { cert: AWS-SA-PROFESSIONAL, outline: "SAP-C02", domain: 2 }
    - { cert: AWS-SECURITY-SPECIALTY, outline: "SCS-C03", domain: 3 }
    - { cert: GCP-PCA, outline: "current", domain: 1 }
    - { cert: GCP-PCSE, outline: "current", domain: 4 }
    - { cert: KCSA, outline: "current", domain: 1 }
  related: [cloud.object-storage, cloud.file-storage, cloud.volume-storage]
