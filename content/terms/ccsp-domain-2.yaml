- id: sec.data-retention
  en:
    term: data retention
    definition: >-
      Keeping data for a defined period, set by law, contract or business
      need, under a policy that also says what happens to it when that period
      ends.
  es:
    verdict: translated
    forms:
      - text: conservación de datos
        usedBy: [official, eu, engineers, google]
        article: la
        kind: noun
        primary: true
        note: >-
          The word of the law. The GDPR's storage limitation principle is
          "limitación del plazo de conservación", and Spain's data retention
          act for telecoms operators is the "Ley de conservación de datos". A
          retention period is "el plazo de conservación".
      - text: retención de datos
        usedBy: [official, engineers, microsoft, aws]
        article: la
        kind: noun
        note: >-
          The calque of the English, usual in cloud consoles and engineering
          writing: "políticas de retención de datos", "período de retención".
          Official texts use it too: the ENS defines a "periodo de retención"
          for user accounts.
    definition: >-
      Mantenimiento de los datos durante un plazo definido por la ley, por un
      contrato o por las necesidades del negocio.
    examples:
      - es: La política de conservación de datos fija un plazo de cinco años para las facturas.
        en: The data retention policy sets a period of five years for invoices.
  topics: [data, grc]
  technology: []
  curriculum:
