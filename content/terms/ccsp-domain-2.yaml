- id: sec.data-labelling
  en:
    term: data labelling
    definition: >-
      Attaching a visible or machine-readable marking to data, or to the media
      that hold it, to show its classification, so that people and tools such
      as DLP can apply the right handling rules.
  es:
    verdict: translated
    forms:
      - text: etiquetado
        usedBy: [official, engineers, microsoft]
        article: el
        kind: noun
        primary: true
        note: >-
          Usually paired with classification: "clasificación y etiquetado de
          la información". The verb is etiquetar and a label is "una
          etiqueta".
      - text: etiquetas de confidencialidad
        usedBy: [microsoft]
        article: las
        kind: noun
        note: Microsoft's translation of "sensitivity labels" in Purview.
      - text: marcado
        usedBy: [official]
        article: el
        kind: noun
        register: formal
        note: >-
          The word in the ENS, whose measure mp.si.1 is "Marcado de soportes":
          media must carry marks or metadata showing the security level of
          what they hold.
    definition: >-
      Colocación de una marca, visible o en los metadatos, que indica la
      clasificación de un dato o de su soporte.
    examples:
      - es: El etiquetado de los documentos confidenciales es obligatorio.
        en: Labelling confidential documents is mandatory.
    watchOut: >-
      "Etiquetado de datos" has a second meaning: labelling training data for
      machine learning, which is how AWS's Spanish pages use it. Say
      "etiquetado de la información" or mention the classification to make
      the security sense clear.
  topics: [data]
  technology: []
  curriculum:
