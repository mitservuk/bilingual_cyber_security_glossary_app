- id: sec.geolocation
  en:
    term: geolocation
    definition: >-
      Determining the physical location of a device, user or data, for
      example from an IP address, GPS or network signals. In cloud security
      it underpins location-based access rules and checks on where data is
      stored and processed.
  es:
    verdict: translated
    forms:
      - text: geolocalización
        usedBy: [official, engineers, google, aws]
        article: la
        kind: noun
        primary: true
        note: >-
          The standard word: in the LOPDGDD (article 90, on locating
          employees), INCIBE and the AEPD, and on Google Cloud's and AWS's
          Spanish pages.
      - text: ubicación
        usedBy: [official, microsoft]
        article: la
        kind: noun
        note: >-
          The plain word for the location itself. Microsoft Entra's
          conditional access pages are built on it: "bloqueo del acceso por
          ubicación", "una ubicación geográfica".
      - text: datos de localización
        usedBy: [eu]
        article: los
        kind: noun
        note: >-
          The GDPR's wording for location data, listed among the identifiers
          that make a person identifiable.
    definition: >-
      Determinación de la ubicación física de un dispositivo, de un usuario o
      de unos datos, por ejemplo a partir de la dirección IP o del GPS.
    examples:
      - es: Bloqueamos el acceso según la geolocalización de la dirección IP.
        en: We block access according to the geolocation of the IP address.
  topics: [data, authz]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 2 }
  related: [sec.geofencing, law.data-residency, law.data-sovereignty, law.personal-data]
