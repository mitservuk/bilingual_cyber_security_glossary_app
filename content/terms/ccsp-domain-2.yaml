- id: sec.sensitive-data
  en:
    term: sensitive data
    definition: >-
      Data whose unauthorised disclosure, alteration or loss would cause
      significant harm to a person or an organisation, and which therefore
      warrants stronger protection. In data protection the phrase is narrower:
      it is shorthand for the GDPR's special categories of personal data.
  es:
    verdict: translated
    forms:
      - text: datos sensibles
        usedBy: [eu, official, engineers, google]
        article: los
        kind: noun
        primary: true
      - text: información sensible
        usedBy: [official, engineers, oracle]
        article: la
        kind: noun
        note: >-
          The entry in INCIBE's glossary: private information that must be
          protected from unauthorised access.
      - text: datos confidenciales
        usedBy: [microsoft, aws]
        article: los
        kind: noun
        note: >-
          How Microsoft and AWS translate "sensitive data" in their Spanish
          documentation. Microsoft's sensitivity labels are "etiquetas de
          confidencialidad".
      - text: categorías especiales de datos
        usedBy: [eu, official]
        article: las
        kind: noun
        register: formal
        note: >-
          The legal term in the GDPR and in the Spanish data protection act
          (Article 9 of each), covering health, genetic and biometric data
          among others. A GDPR recital glosses it as «datos sensibles».
    definition: >-
      Datos cuya divulgación, alteración o pérdida causaría un daño grave a
      una persona o a una organización, y que por eso necesitan más
      protección.
    examples:
      - es: Los datos sensibles deben estar cifrados en reposo y en tránsito.
        en: Sensitive data must be encrypted at rest and in transit.
    watchOut: >-
      The scope depends on who is speaking. To a privacy lawyer, datos
      sensibles means only the special categories of personal data; to an
      engineer it is anything that needs protecting. And in INCIBE's example
      scheme "confidencial" is a classification level, so Microsoft's and
      AWS's "datos confidenciales" can be read more narrowly than they intend.
  topics: [data, grc]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 2 }
  related: [law.personal-data, sec.data-classification, sec.dlp, law.pii]
