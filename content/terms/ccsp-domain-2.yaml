- id: sec.key-rotation
  en:
    term: key rotation
    definition: >-
      Replacing a cryptographic key with a new one, on a schedule or after a
      suspected compromise, so that any single key protects a limited amount
      of data for a limited time.
  es:
    verdict: translated
    forms:
      - text: rotación de claves
        usedBy: [engineers, google, microsoft, aws]
        article: la
        kind: noun
        primary: true
        note: >-
          Scheduled rotation is "rotación automática"; Oracle writes
          "rotación automática de claves".
      - text: rotar
        usedBy: [engineers, google, microsoft, oracle, aws]
        kind: verb
        note: >-
          To rotate: "rotar las claves".
    definition: >-
      Sustitución de una clave criptográfica por otra nueva, de forma
      periódica o tras un incidente, para limitar los datos que protege cada
      clave.
    examples:
      - es: >-
          Después del incidente, adelantamos la rotación de claves de todos
          los servicios.
        en: >-
          After the incident, we brought forward key rotation for all
          services.
  topics: [crypto, secrets]
  technology: []
  curriculum:
