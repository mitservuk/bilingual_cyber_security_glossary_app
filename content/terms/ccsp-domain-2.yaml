      url: "https://www.aepd.es/guias/adecuacion-rgpd-ia.pdf"
      found: ["el ciclo de vida de los datos a lo largo de todas las etapas del tratamiento"]
      checked: 2026-11-14
    - label: "INCIBE, Cómo gestionar una fuga de información: una guía de aproximación para el empresario"
      url: "https://www.incibe.es/sites/default/files/contenidos/guias/doc/guia_ciberseguridad_gestion_fuga_informacion_0.pdf"
