- id: sec.irm
  en:
    term: information rights management
    acronym: IRM
    definition: >-
      Technology that encrypts a document and binds usage rules to it, such
      as who may open, edit, print or forward it and until when, so that the
      controls travel with the file wherever it is copied and access can be
      revoked later.
  es:
    verdict: english-kept
    acronym: IRM
    forms:
      - text: IRM
        usedBy: [engineers, microsoft]
        article: el
        kind: noun
        primary: true
        note: >-
          Kept in English, as the acronym or spelled out. Microsoft's Spanish
          documentation writes "Information Rights Management (IRM)", and a
          Telefónica Tech post asks whether files were "protegidos con IRM".
      - text: gestión de derechos de la información
        article: la
        kind: noun
        note: >-
          The translated expansion. Telefónica Tech uses it in the title of
          the page for a service it otherwise calls Information Rights
          Management.
      - text: administración de derechos
        usedBy: [microsoft]
        article: la
        kind: noun
        note: >-
          Microsoft's Spanish wording for rights management in general:
          "aplicar la administración de derechos a listas y bibliotecas".
    definition: >-
      Tecnología que cifra un documento y le asocia permisos de uso (quién
      puede abrirlo, editarlo, imprimirlo o reenviarlo), de modo que la
      protección viaja con el fichero.
    examples:
      - es: Los contratos que salen de la empresa están protegidos con IRM.
        en: Contracts that leave the company are protected with IRM.
  topics: [data, authz]
  technology: []
  curriculum:
