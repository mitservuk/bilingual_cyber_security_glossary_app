- id: sec.chain-of-custody
  en:
    term: chain of custody
    definition: >-
      The documented, unbroken record of who collected, held, transferred and
      examined an item of evidence, and when, kept so that its integrity can
      be demonstrated in court or to an auditor.
  es:
    verdict: translated
    forms:
      - text: cadena de custodia
        usedBy: [official, engineers, google, microsoft]
        article: la
        kind: noun
        primary: true
        note: >-
          The term in INCIBE's glossary and forensics guide and on Google's
          and Microsoft's Spanish pages. What it protects is "las evidencias
          digitales" (INCIBE) or "la evidencia digital" (Microsoft).
    definition: >-
      Registro documentado y sin interrupciones de quién ha recogido, guardado
      y manipulado una evidencia, que permite demostrar que no se ha alterado.
    examples:
      - es: Hay que mantener la cadena de custodia de los discos desde el primer momento.
        en: The chain of custody of the disks has to be maintained from the very start.
  topics: [incident, grc]
  technology: []
