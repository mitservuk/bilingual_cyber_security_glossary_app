      url: "https://www.aepd.es/prensa-y-comunicacion/blog/cifrado-privacidad-iii-cifrado-homomorfico"
      found: ["Cifrado y Privacidad III: Cifrado Homomórfico", "un cifrado homomórfico parcial"]
