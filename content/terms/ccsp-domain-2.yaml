- id: cloud.raw-storage
  en:
    term: raw storage
    definition: >-
      Storage presented to a virtual machine as an unformatted block device,
      mapped straight to a physical disk or LUN, with no file system or
      virtual-disk layer added by the platform.
  es:
    verdict: translated
    forms:
      - text: dispositivo de bloques sin procesar
        usedBy: [aws]
        article: el
        kind: noun
        primary: true
        note: >-
          AWS's Spanish for a raw block device. None of the Spanish sources
          checked names "raw storage" as a storage type of its own; this is
          the nearest wording found, not a set term.
      - text: volumen sin procesar
        usedBy: [google]
        article: el
        kind: noun
        plural: los volúmenes sin procesar
        note: >-
          Google Cloud's wording for the raw volumes that block storage
          provides. Both vendors translate raw as "sin procesar".
    definition: >-
      Almacenamiento que la máquina virtual recibe como un dispositivo de
      bloques sin sistema de archivos, conectado directamente al disco físico.
    examples:
      - es: >-
          Un volumen nuevo es un dispositivo de bloques sin procesar: hay que
          crear un sistema de archivos antes de usarlo.
        en: >-
          A new volume is a raw block device: a file system has to be created
          before it can be used.
    watchOut: >-
      For raw data, as opposed to raw devices, Google's pages say "datos en
      bruto".
  topics: [architecture]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 3 }
