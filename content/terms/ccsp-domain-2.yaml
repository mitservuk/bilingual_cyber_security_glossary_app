- id: sec.data-dispersion
  en:
    term: data dispersion
    definition: >-
      Splitting data into fragments, usually with erasure coding, and storing
      them across several devices or locations, so that the loss or theft of
      one fragment neither destroys nor reveals the whole.
  es:
    verdict: translated
    forms:
      - text: dispersión de datos
        article: la
        kind: noun
        primary: true
        note: >-
          The literal rendering. None of the Spanish sources checked uses it
          as a set term, so expect to have to explain it.
      - text: replicación
        usedBy: [aws]
        article: la
        kind: noun
        note: >-
          Replication, the nearest term in the vendors' Spanish pages: AWS and
          Google describe object storage replicating data across devices and
          regions. It is not a synonym, because dispersion stores fragments
          and replication stores whole copies.
    definition: >-
      Técnica que divide los datos en fragmentos y los reparte entre varios
      dispositivos o ubicaciones.
    examples:
      - es: >-
          Con la dispersión de datos, perder un disco no significa perder la
          información.
        en: >-
          With data dispersion, losing one disk does not mean losing the
          information.
  topics: [data, architecture]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 2 }
    - { cert: AZ-500, outline: "2026-01", domain: 3 }
    - { cert: AZ-305, outline: "2026-04", domain: 2 }
    - { cert: SC-100, outline: "2026-10", domain: 4 }
    - { cert: AWS-SA-ASSOCIATE, outline: "SAA-C03", domain: 1 }
    - { cert: AWS-SA-PROFESSIONAL, outline: "SAP-C02", domain: 2 }
    - { cert: AWS-SECURITY-SPECIALTY, outline: "SCS-C03", domain: 5 }
    - { cert: GCP-PCA, outline: "current", domain: 3 }
    - { cert: GCP-PCSE, outline: "current", domain: 3 }
    - { cert: KCSA, outline: "current", domain: 6 }
  related: [cloud.object-storage, sec.resiliency, sec.availability]
  sources:
    - label: "Google Cloud, páginas para España"
      url: "https://cloud.google.com/learn/what-is-object-storage?hl=es"
      found: ["replicar datos automáticamente y almacenarlos en distintos dispositivos y ubicaciones geográficas"]
      checked: 2026-11-14
    - label: "AWS, páginas en español"
      url: "https://aws.amazon.com/es/what-is/object-storage/"
      found: ["funciones de replicación", "replicar datos en varios centros de datos y regiones geográficas"]
      checked: 2026-11-14
  status: draft

- id: sec.data-flow
  en:
    term: data flow
    definition: >-
      The path data takes between systems, services, parties and
      jurisdictions. Mapping it shows where the data is exposed and which
      controls and laws apply at each hop.
  es:
    verdict: translated
    forms:
      - text: flujo de datos
        usedBy: [official, eu, engineers, microsoft, aws]
        article: el
        kind: noun
        primary: true
        plural: los flujos de datos
        note: >-
          The GDPR's Spanish text speaks of "flujos transfronterizos de datos
          personales" for cross-border flows.
      - text: diagrama de flujo de datos
        usedBy: [microsoft]
        article: el
        kind: noun
        note: >-
          A data flow diagram. Microsoft's threat modelling documentation
          keeps the English abbreviation DFD.
      - text: flujo de información
        usedBy: [official, engineers]
        article: el
        kind: noun
        note: >-
          Information flow. Spain's national security framework (ENS) has a
          measure called "separación de flujos de información en la red".
    definition: >-
      Recorrido que siguen los datos entre sistemas, servicios,
      organizaciones y países.
    examples:
      - es: Antes de migrar, hay que documentar el flujo de datos entre los dos sistemas.
        en: Before migrating, the data flow between the two systems has to be documented.
  topics: [data, architecture]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 2 }
  related: [sec.data-mapping, sec.threat-modelling, sec.data-in-transit]
  sources:
