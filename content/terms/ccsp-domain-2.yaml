- id: sec.certificate-revocation
  en:
    term: certificate revocation
    definition: >-
      Invalidating a digital certificate before its expiry date, for example
      because its private key has been compromised or its details are no
      longer true. Relying parties learn of it through certificate revocation
      lists (CRLs) or the Online Certificate Status Protocol (OCSP).
  es:
    verdict: translated
    forms:
      - text: revocación de certificados
        usedBy: [official, engineers, aws]
        article: la
        kind: noun
        primary: true
        note: The acronyms CRL and OCSP stay in English.
      - text: revocar
        usedBy: [official, eu, engineers, aws]
        kind: verb
        note: >-
          To revoke: "revocar un certificado". A revoked certificate is "un
          certificado revocado".
      - text: lista de revocación de certificados
        usedBy: [official, aws]
        article: la
        kind: noun
        note: A certificate revocation list, "una CRL".
    definition: >-
      Anulación de un certificado digital antes de su fecha de caducidad, por
      ejemplo porque su clave privada ha quedado comprometida.
    examples:
      - es: >-
          La revocación de certificados es urgente si se filtra una clave
          privada.
        en: Certificate revocation is urgent if a private key is leaked.
    watchOut: >-
      A certificate that simply reaches its end date is caducado (expired),
      not revocado. Spanish law also provides for suspensión, alongside
      revocation.
  topics: [crypto]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 3 }
