- id: sec.tls
  en:
    term: Transport Layer Security
    acronym: TLS
    definition: >-
      The cryptographic protocol that secures traffic between two endpoints,
      authenticating the server (and optionally the client) with certificates
      and encrypting the session. It is the successor to SSL and the basis of
      HTTPS.
  es:
    verdict: english-kept
    acronym: TLS
    forms:
      - text: TLS
        usedBy: [official, engineers, microsoft, aws]
        article: el
        kind: noun
        primary: true
        note: >-
