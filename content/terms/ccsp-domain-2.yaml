- id: sec.data-mapping
  en:
    term: data mapping
    definition: >-
      Establishing how data elements in one system or schema correspond to
      those in another and, more broadly, documenting where data sits, how it
      flows and which classification and controls apply to it at each point.
  es:
    verdict: translated
    forms:
      - text: mapeo de datos
        usedBy: [engineers]
        article: el
        kind: noun
        primary: true
        note: >-
          Mapeo is everyday engineering Spanish for matching the fields of a
          source to those of a target. Evidence for the wider governance
          sense under this name was not found.
      - text: mapear
        usedBy: [engineers]
        kind: verb
        note: To map.
      - text: asignación de datos
        usedBy: [microsoft, aws]
        article: la
        kind: noun
        note: >-
          A vendor translation. AWS uses it for data mapping in ETL.
          Microsoft's Spanish pages use it for the Purview Data Map, which
          they also call "mapa de datos".
    definition: >-
      Correspondencia entre los datos de un sistema y los de otro y, en
      sentido amplio, descripción de dónde están los datos y cómo circulan.
    examples:
      - es: Antes de la migración hay que hacer el mapeo de datos entre los dos sistemas.
        en: Before the migration, the data has to be mapped between the two systems.
    watchOut: >-
      Asignación normally means assignment or allocation, so "asignación de
      datos" is easy to misread; mapeo is clearer. For personal data, the
      document a Spanish organisation must keep is the "registro de
      actividades de tratamiento" of Article 30 of the RGPD.
  topics: [data, asset]
  technology: []
  curriculum:
