- id: sec.data-masking
  en:
    term: data masking
    definition: >-
      Replacing sensitive values with fictitious but realistic ones, or hiding
      part of them, so that the data stays usable for testing, analytics or
      support without exposing the originals. It can be static (a masked copy)
      or dynamic (applied as each query is answered).
  es:
    verdict: translated
    forms:
      - text: enmascaramiento de datos
        usedBy: [official, engineers, microsoft, oracle, aws]
        article: el
        kind: noun
        primary: true
        note: >-
          Dynamic masking is "enmascaramiento dinámico", in Google's and
          Microsoft's Spanish pages alike.
      - text: enmascarar
        usedBy: [official, engineers]
        kind: verb
        note: >-
          To mask. The result is "datos enmascarados".
    definition: >-
      Sustitución de los valores sensibles por otros ficticios pero realistas,
      o su ocultación parcial, para poder usar los datos sin exponer los
      originales.
    examples:
      - es: En el entorno de pruebas usamos enmascaramiento de datos.
        en: We use data masking in the test environment.
  topics: [data]
  technology: []
