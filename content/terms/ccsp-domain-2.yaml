- id: law.data-sovereignty
  en:
    term: data sovereignty
    definition: >-
      The principle that data is subject to the laws and authorities of the
      jurisdiction where it is held or processed, and by extension the ability
      of an organisation or state to keep control over its own data.
  es:
    verdict: translated
    forms:
      - text: soberanía de los datos
        usedBy: [google]
        article: la
        kind: noun
        primary: true
      - text: soberanía del dato
        usedBy: [engineers]
        article: la
        kind: noun
        note: >-
          Telefónica Tech's wording. It also defines it more broadly: whoever
          generates the data keeps control over who can access it and for
          what purpose.
      - text: soberanía de datos
        usedBy: [microsoft, oracle, aws]
        article: la
        kind: noun
        note: Without the article, in Microsoft, Oracle and AWS documentation.
      - text: soberanía digital
        usedBy: [official, engineers, google, microsoft, aws]
        article: la
        kind: noun
        note: >-
          Digital sovereignty, the wider policy term: "reforzar la soberanía
          digital de Europa". A sovereign cloud is "una nube soberana".
    definition: >-
      Principio según el cual los datos están sujetos a las leyes del país
      donde se guardan o se tratan, y capacidad de una organización de
      mantener el control sobre ellos.
    examples:
      - es: >-
          El cliente exige garantías de soberanía de los datos antes de firmar
          el contrato.
        en: >-
          The customer requires data sovereignty guarantees before signing the
          contract.
  topics: [grc, data]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 1 }
  related: [law.data-residency, fw.gdpr, cloud.service-provider]
