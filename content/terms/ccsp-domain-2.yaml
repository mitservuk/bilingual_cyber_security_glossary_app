# CCSP Domain 2: Cloud Data Security.
# Format is described in content/README.md. Every `found` text was confirmed
# on its page with scripts/check_sources.py when these entries were written.

- id: sec.data-lifecycle
  en:
    term: data lifecycle
    definition: >-
      The stages data passes through from creation to destruction. The CCSP
      model names six: create, store, use, share, archive and destroy, each
      with its own controls.
  es:
    verdict: translated
    forms:
      - text: ciclo de vida de los datos
        usedBy: [official, engineers, google, aws]
        article: el
        kind: noun
        primary: true
      - text: ciclo de vida del dato
        usedBy: [engineers]
        article: el
        kind: noun
        note: >-
          Paradigma Digital's wording in its posts on data governance, which
          it calls "gobierno del dato".
      - text: ciclo de vida de la información
        usedBy: [official, engineers]
        article: el
        kind: noun
        note: >-
          INCIBE's wording in its guides on data leaks and secure erasure,
          where it adds the English acronym ILM.
    definition: >-
      Etapas por las que pasan los datos desde que se crean hasta que se
      destruyen.
    examples:
      - es: >-
          Hay que proteger los datos en todas las fases del ciclo de vida de
          los datos.
        en: >-
          Data has to be protected in every phase of the data lifecycle.
  topics: [data]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
    - { cert: CISSP, outline: "2027-04", domain: 2 }
  related: [sec.data-retention, sec.data-archiving, sec.data-deletion, sec.data-classification]
  sources:
