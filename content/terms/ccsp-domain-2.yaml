- id: sec.data-archiving
  en:
    term: data archiving
    definition: >-
      Moving data that is no longer in active use to cheaper long-term
      storage, where it stays intact and retrievable for compliance or
      reference, usually at the cost of slower access.
  es:
    verdict: translated
    forms:
      - text: archivado de datos
        usedBy: [engineers, aws, microsoft, google]
        article: el
        kind: noun
        primary: true
        note: >-
          Often just "archivado": "para archivado y backup" (Paradigma
          Digital), "datos de cumplimiento y archivado" (Microsoft), "el
          archivado de registros" (Google Cloud).
      - text: archivo de datos
        usedBy: [aws]
        article: el
        kind: noun
        note: >-
          Archivo names the archive itself as well as the act. AWS uses it
          beside archivado on the same page, and Azure's archive tier is "el
          nivel de acceso de archivo".
    definition: >-
      Traslado de los datos que ya no se usan a diario a un almacenamiento más
      barato, donde se conservan a largo plazo.
    examples:
