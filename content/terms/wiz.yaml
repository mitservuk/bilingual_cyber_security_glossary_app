# Wiz and the cloud security categories it covers.
# Format is described in content/README.md. These entries were written from
# working knowledge of usage in Spain; each `found` text was then located in a
# page the glossary already cites and confirmed with scripts/check_sources.py.
# Forms with no usedBy have not been seen in a source.

- id: wiz.wiz
  en:
    term: Wiz
    definition: A cloud security platform that scans cloud environments without agents and
      correlates misconfigurations, vulnerabilities, identities, data and exposure on a single
      graph.
  es:
    verdict: english-kept
    forms:
      - text: Wiz
        kind: noun
        primary: true
        usedBy:
          - google
    say: Said as in English, 'güis'.
    definition: Plataforma de seguridad en la nube que analiza los entornos sin agentes y
      relaciona en un único grafo configuraciones inseguras, vulnerabilidades, identidades,
      datos y exposición.
    examples:
      - es: Hemos conectado las tres nubes a Wiz para tener una visión única del riesgo.
        en: We have connected all three clouds to Wiz to get a single view of risk.
  topics:
    - detection
    - hardening
  technology:
    - wiz
    - cloud-general
  related:
    - sec.cnapp
    - sec.cspm
    - wiz.security-graph
    - wiz.toxic-combination
  sources:
    - label: Google Cloud, páginas para España
      url: https://cloud.google.com/security?hl=es
      found:
        - Wiz Google
      checked: 2026-11-15
  status: sourced

- id: wiz.security-graph
  en:
    term: Security Graph
    definition: Wiz's graph database of every cloud resource and the relationships between
      them, which its queries and risk analysis run on.
  es:
    verdict: both
    forms:
      - text: Security Graph
        article: el
        kind: noun
        primary: true
      - text: grafo de seguridad
        article: el
        kind: noun
    definition: Base de datos en grafo de Wiz con todos los recursos de la nube y sus relaciones,
      sobre la que se ejecutan sus consultas y su análisis de riesgos.
    examples:
      - es: Una consulta en el Security Graph muestra qué máquinas expuestas tienen acceso
          a datos sensibles.
        en: A Security Graph query shows which exposed machines have access to sensitive data.
  topics:
    - detection
    - asset
  technology:
    - wiz
  related:
    - wiz.wiz
    - wiz.attack-path
    - grc.asset-inventory
  sources: []
  status: draft

- id: wiz.toxic-combination
  en:
    term: toxic combination
    definition: Several individually tolerable weaknesses that together create a real path
      to compromise, such as a public machine with a critical vulnerability and a high-privilege
      role.
  es:
    verdict: translated
    forms:
      - text: combinación tóxica
        article: la
        kind: noun
        primary: true
        plural: las combinaciones tóxicas
    definition: Conjunto de debilidades que por separado serían tolerables pero que juntas
      abren un camino real de compromiso.
    examples:
      - es: 'Exposición a internet, vulnerabilidad crítica y permisos de administrador: una
          combinación tóxica.'
        en: 'Internet exposure, a critical vulnerability and administrator permissions: a
          toxic combination.'
  topics:
    - threat
    - vulnmgmt
  technology:
    - wiz
    - cloud-general
  related:
    - wiz.attack-path
    - wiz.issue
    - sec.misconfiguration
    - sec.attack-surface
  sources: []
  status: draft

- id: wiz.attack-path
  en:
    term: attack path
    definition: The chain of steps an attacker could take from an entry point to a valuable
      asset, through exposures, vulnerabilities and permissions.
  es:
    verdict: translated
    forms:
      - text: ruta de ataque
        article: la
        kind: noun
        primary: true
        plural: las rutas de ataque
      - text: camino de ataque
        article: el
        kind: noun
      - text: movimiento lateral
        article: el
        kind: noun
        usedBy:
          - microsoft
        note: Lateral movement, the hops along the path.
    definition: Cadena de pasos que un atacante podría seguir desde un punto de entrada hasta
      un activo valioso, a través de exposiciones, vulnerabilidades y permisos.
    examples:
      - es: La herramienta dibuja la ruta de ataque desde internet hasta la base de datos.
        en: The tool draws the attack path from the internet to the database.
  topics:
    - threat
  technology:
    - wiz
    - cloud-general
  related:
    - wiz.toxic-combination
    - sec.attack-surface
    - sec.privilege-escalation
    - sec.threat-modelling
  sources:
    - label: Microsoft Learn, es-ES
      url: https://learn.microsoft.com/es-es/security/benchmark/azure/mcsb-v2-asset-management
      found:
        - el movimiento lateral
      checked: 2026-11-15
  status: draft

- id: wiz.issue
  en:
    term: issue
    definition: 'In Wiz, a prioritised risk raised when a control matches: one item to fix,
      with its context, severity and owner.'
  es:
    verdict: both
    forms:
      - text: issue
        article: el
        kind: noun
        primary: true
        plural: los issues
        usedBy:
          - official
        note: Kept in English, masculine. Some teams say la issue.
      - text: incidencia
        article: la
        kind: noun
        usedBy:
          - official
        note: The nearest Spanish word, as used for tickets.
      - text: hallazgo
        article: el
        kind: noun
        note: 'A finding: the raw detection, before it is prioritised into an issue.'
    definition: 'En Wiz, riesgo priorizado que se genera cuando se cumple un control: un elemento
      que corregir, con su contexto, su gravedad y su responsable.'
    examples:
      - es: Tenemos doce issues críticos abiertos en producción.
        en: We have twelve critical issues open in production.
  topics:
    - vulnmgmt
    - detection
  technology:
    - wiz
  related:
    - wiz.control
    - sec.remediation
    - wiz.toxic-combination
  sources:
