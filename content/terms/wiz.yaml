      found:
        - incidencia
      checked: 2026-11-15
  status: sourced

- id: wiz.control
  en:
    term: control
    definition: In Wiz, a saved graph query that defines a risk; when resources match it,
      an issue is opened.
  es:
    verdict: translated
    forms:
      - text: control
        article: el
        kind: noun
        primary: true
        plural: los controles
      - text: regla de configuración de nube
        article: la
        kind: noun
        note: 'A cloud configuration rule: the simpler check of one resource''s settings.'
    definition: En Wiz, consulta guardada sobre el grafo que define un riesgo; cuando hay
      recursos que la cumplen, se abre un issue.
    examples:
      - es: Hemos creado un control para detectar buckets públicos con datos personales.
        en: We have created a control to detect public buckets containing personal data.
    watchOut: Not the same as a control in a framework such as ISO 27001, though Wiz maps
      its controls to those.
  topics:
    - detection
    - grc
  technology:
    - wiz
  related:
    - wiz.issue
    - grc.control
    - wiz.security-graph
  sources: []
  status: draft

- id: wiz.agentless-scanning
  en:
    term: agentless scanning
    definition: Assessing workloads through the cloud provider's APIs and disk snapshots,
      with nothing installed on the machines themselves.
  es:
    verdict: translated
    forms:
      - text: análisis sin agentes
        article: el
        kind: noun
        primary: true
        usedBy:
          - microsoft
          - oracle
      - text: escaneo sin agentes
        article: el
        kind: noun
        note: Escaneo is the everyday word for a scan.
      - text: agentless
        kind: adjective
        usedBy:
          - engineers
        note: Used as a label in English.
    definition: Evaluación de las cargas de trabajo mediante las API del proveedor de nube
      e instantáneas de disco, sin instalar nada en las máquinas.
    examples:
      - es: El análisis sin agentes cubre todas las máquinas desde el primer día.
        en: Agentless scanning covers every machine from day one.
  topics:
    - vulnmgmt
    - detection
  technology:
    - wiz
    - cloud-general
  related:
