- id: wiz.sensor
  en:
    term: runtime sensor
    definition: A lightweight agent, in Wiz's case eBPF-based, that watches workloads as they
      run to detect threats and confirm which vulnerabilities are actually loaded.
  es:
    verdict: translated
    forms:
      - text: sensor de ejecución
        article: el
        kind: noun
        primary: true
      - text: sensor
        article: el
        kind: noun
      - text: Wiz Sensor
        article: el
        kind: noun
    definition: Agente ligero que observa las cargas de trabajo mientras se ejecutan para
      detectar amenazas y confirmar qué vulnerabilidades están realmente cargadas.
    examples:
      - es: El sensor detectó una shell inversa en un contenedor.
        en: The sensor detected a reverse shell in a container.
  topics:
    - detection
  technology:
    - wiz
    - containers-oci
    - kubernetes
  related:
    - tech.runtime
    - sec.edr
    - wiz.cdr
    - wiz.agentless-scanning
  sources: []
  status: draft

