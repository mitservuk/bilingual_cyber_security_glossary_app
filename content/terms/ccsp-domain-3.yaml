- id: cloud.compute
  en:
    term: compute
    definition: >-
      Processing capacity offered as a cloud resource, in the form of virtual
      machines, containers or functions, as distinct from storage and
      networking.
  es:
    verdict: translated
    forms:
      - text: computación
        usedBy: [official, engineers, google, microsoft, aws]
        article: la
        kind: noun
        primary: true
        note: >-
          Usually inside a phrase: "recursos de computación", "servicios de
          computación", "instancias de computación".
      - text: cómputo
        usedBy: [official, microsoft, oracle]
        article: el
        kind: noun
        note: >-
          Oracle writes "instancias de cómputo" and INCIBE's 5G guide
          "capacidades de cómputo".
      - text: proceso
        usedBy: [microsoft]
        article: el
        kind: noun
        note: >-
          Microsoft's Azure architecture guide calls a compute service a
          "servicio de proceso", and on the same page also a "servicio de
          cómputo" and a "servicio de computación".
    definition: >-
      Capacidad de procesamiento que se ofrece como recurso en la nube, en
      forma de máquinas virtuales, contenedores o funciones.
    examples:
      - es: Necesitamos más recursos de computación para el entorno de pruebas.
        en: We need more compute resources for the test environment.
    watchOut: >-
      The vendors do not agree on one word, and "la computación" on its own
      means computing in general, as in "computación en la nube". Say
      "recursos de computación" or "capacidad de cómputo" to make clear you
      mean compute.
  topics: [architecture]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [cloud.virtual-machine, cloud.iaas, cloud.container, cloud.serverless]
  sources:
    - label: "INCIBE y Universidad de León, Guía de buenas prácticas de ciberseguridad para redes privadas 5G"
      url: "https://www.incibe.es/sites/default/files/2025-12/INCIBE&ULE_GuiaBuenasPracticasCiberseguridadRedesPrivadas5G.pdf"
      found: ["recursos de computación", "capacidades de cómputo"]
      checked: 2026-11-14
    - label: "Paradigma Digital, blog"
      url: "https://www.paradigmadigital.com/dev/comparativa-servicios-cloud-aws-azure-gcp/"
      found: ["servicios de computación"]
      checked: 2026-11-14
    - label: "AWS, páginas en español"
      url: "https://aws.amazon.com/es/what-is/compute/"
      found: ["Los recursos de computación son cantidades medibles de potencia de computación"]
      checked: 2026-11-14
    - label: "Google Cloud, páginas para España"
      url: "https://cloud.google.com/compute?hl=es"
      found: ["instancias de computación"]
      checked: 2026-11-14
    - label: "Oracle España"
      url: "https://www.oracle.com/es/cloud/compute/"
      found: ["instancias de cómputo"]
      checked: 2026-11-14
    - label: "Microsoft Learn, es-ES"
      url: "https://learn.microsoft.com/es-es/azure/architecture/guide/technology-choices/compute-decision-tree"
      found: ["servicio de proceso", "servicio de cómputo", "servicio de computación"]
      checked: 2026-11-14
