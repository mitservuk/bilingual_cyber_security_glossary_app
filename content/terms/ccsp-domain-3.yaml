- id: sec.identification
  en:
    term: identification
    definition: >-
      The step in which a subject claims an identity, for example by
      presenting a user name or other identifier, before that claim is
      verified by authentication.
  es:
    verdict: translated
    forms:
      - text: identificación
        usedBy: [official, engineers]
        article: la
        kind: noun
        primary: true
        note: >-
          INCIBE's glossary defines it as telling another person or system
          who we are. It is also the name of the first access control measure
          in the ENS (op.acc.1).
      - text: identificador
        usedBy: [official]
        article: el
        kind: noun
        note: >-
          The identifier itself. The ENS requires each account to be tied to
          "un identificador único".
    definition: >-
      Acción por la que un usuario o un sistema declara quién es, antes de
      que esa identidad se compruebe mediante la autenticación.
    examples:
      - es: La identificación se hace con el nombre de usuario y la autenticación con la contraseña.
        en: Identification is done with the user name and authentication with the password.
  topics: [iam, authn]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [sec.authentication, sec.authorization, sec.iam, sec.accountability]
  sources:
    - label: "INCIBE, Glosario de términos de ciberseguridad (2021)"
      url: "https://www.incibe.es/sites/default/files/contenidos/guias/doc/guia_glosario_ciberseguridad_2021.pdf"
