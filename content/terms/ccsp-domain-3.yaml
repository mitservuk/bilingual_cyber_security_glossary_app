- id: sec.rto
  en:
    term: recovery time objective
    acronym: RTO
    definition: >-
      The maximum acceptable time between the interruption of a service and
      its restoration to an agreed level.
  es:
    verdict: both
    acronym: RTO
    forms:
      - text: RTO
        usedBy: [official, engineers, google, microsoft, aws]
        article: el
        kind: noun
        primary: true
        note: >-
          The English acronym is the working term, masculine: "el RTO y el
          RPO". INCIBE and Telefónica Tech often gloss it with the English
          words, "Recovery Time Objective", rather than a Spanish expansion.
      - text: objetivo de tiempo de recuperación
        usedBy: [eu, engineers, google, microsoft, aws]
        headline: true
        article: el
        kind: noun
        note: >-
          The expansion in Google's, Microsoft's and AWS's documentation and
          at Telefónica Tech. DORA's Spanish text uses the same word order:
          "objetivos de tiempo de recuperación".
      - text: tiempo de recuperación objetivo
        usedBy: [official]
        article: el
        kind: noun
        note: The word order in INCIBE's crisis management guide.
    say: Said letter by letter, "erre-te-o".
    definition: >-
      Tiempo máximo aceptable entre la interrupción de un servicio y su
      restablecimiento.
    examples:
      - es: El RTO de este servicio es de cuatro horas.
        en: The RTO for this service is four hours.
    watchOut: >-
      The Spanish expansion is not settled: the vendors and DORA put
      "objetivo" first, INCIBE puts it last. Say RTO.
  topics: [incident]
  technology: []
  curriculum:
