          uses to gloss the English: un servidor "de salto" (Bastion host).
      - text: bastion host
        usedBy: [official, engineers]
        article: el
        kind: noun
        note: The English term, also used as it stands, in an INCIBE guide among others.
    definition: >-
      Servidor reforzado y expuesto en el borde de la red que sirve de único
      punto de entrada para administrar los sistemas de una red privada.
    examples:
