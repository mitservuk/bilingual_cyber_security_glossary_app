- id: sec.business-continuity
  en:
    term: business continuity
    definition: >-
      An organisation's capability to keep delivering its critical products
      and services at an acceptable level during and after a disruption.
  es:
    verdict: translated
    forms:
      - text: continuidad de negocio
        usedBy: [official, engineers]
        article: la
        kind: noun
        primary: true
        note: >-
          The wording INCIBE mostly uses, also found at Telefónica Tech and
          in job adverts.
      - text: continuidad del negocio
        usedBy: [official, engineers, google]
        article: la
        kind: noun
        note: >-
          The same term with the article, as in the Spanish title of ISO
          22301: "sistema de gestión de la continuidad del negocio". The two
          are used interchangeably, sometimes in one document.
      - text: continuidad empresarial
        usedBy: [google, microsoft]
        article: la
        kind: noun
        note: >-
          Microsoft's wording in its Spanish documentation; Google Cloud
          uses it as well.
      - text: continuidad de la actividad
        usedBy: [official, eu]
        article: la
        kind: noun
        register: formal
        note: >-
          The wording of legal texts: DORA in Spanish and article 26 of the
          ENS. NIS 2 says "continuidad de las actividades", and the ENS
          groups its measures under "continuidad del servicio" (op.cont).
    definition: >-
      Capacidad de una organización para seguir prestando sus servicios
      críticos a un nivel aceptable durante una interrupción y después de
      ella.
    examples:
      - es: La continuidad de negocio no es solo un tema de TI; afecta a toda la empresa.
        en: Business continuity is not just an IT matter; it affects the whole company.
