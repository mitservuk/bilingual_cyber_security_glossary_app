- id: sec.ids
  en:
    term: intrusion detection system
    acronym: IDS
    definition: >-
      A system that monitors network traffic or host activity for signs of
      attack or policy violation and raises alerts, without itself blocking
      the activity.
  es:
    verdict: both
    acronym: IDS
    forms:
      - text: IDS
        usedBy: [official, engineers]
        article: el
        kind: noun
        primary: true
        note: >-
          The English acronym is the working term, masculine like "el
          sistema" and often paired with its sibling: "IDS/IPS". Host and
          network variants are HIDS and NIDS.
      - text: sistema de detección de intrusos
        usedBy: [official, google]
        headline: true
        article: el
        kind: noun
        note: >-
          The expansion in INCIBE's glossary and on Google Cloud's pages for
          Spain.
      - text: sistema de detección de intrusiones
        usedBy: [official, microsoft]
        article: el
        kind: noun
        note: >-
          The other expansion, with intrusiones (intrusions) in place of
          intrusos (intruders). INCIBE-CERT and Microsoft use it; the ENS
          measure is "detección de intrusión" (op.mon.1).
    say: Said letter by letter, "i-de-ese".
    definition: >-
      Sistema que vigila el tráfico de red o la actividad de un equipo para
      detectar accesos no autorizados y genera alertas, sin bloquearlos.
    examples:
      - es: El IDS ha generado una alerta por tráfico sospechoso en la red interna.
        en: The IDS has raised an alert for suspicious traffic on the internal network.
    watchOut: >-
      Two expansions coexist, with intrusos and with intrusiones, even within
      INCIBE's own publications. The acronym avoids the choice.
  topics: [detection, network]
  technology: [networking]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [sec.ips, sec.firewall, sec.log, sec.traffic-inspection]
  sources:
    - label: "INCIBE, Glosario de términos de ciberseguridad (2021)"
      url: "https://www.incibe.es/sites/default/files/contenidos/guias/doc/guia_glosario_ciberseguridad_2021.pdf"
      found: ["Un sistema de detección de intrusos (o IDS de sus siglas en inglés"]
