- id: sec.authentication
  en:
    term: authentication
    definition: >-
      Verifying that a subject is who or what it claims to be, using one or
      more factors such as something it knows, holds or is.
  es:
    verdict: translated
    forms:
      - text: autenticación
        usedBy: [official, eu, engineers, google, microsoft, aws]
        article: la
        kind: noun
        primary: true
        note: >-
          The form in the ENS, in the Spanish text of NIS 2 and in Google's,
          Microsoft's and AWS's documentation.
      - text: autentificación
        usedBy: [official, engineers]
        article: la
        kind: noun
        note: >-
          A variant with the same meaning. INCIBE's glossary lists it as a
          synonym of autenticación, and it turns up in some INCIBE guides and
          practitioner posts: "segundo factor de autentificación".
      - text: autenticar
        usedBy: [official, microsoft]
        kind: verb
        note: >-
          To authenticate: "autenticar al usuario". The variant verb
          "autentificar" also appears in INCIBE documents.
    definition: >-
      Comprobación de que un usuario, un proceso o un dispositivo es quien
      dice ser.
    examples:
      - es: La autenticación falla porque el certificado ha caducado.
        en: Authentication is failing because the certificate has expired.
    watchOut: >-
      Both autenticación and autentificación exist and mean the same thing.
      Write autenticación, the form used in Spanish law and vendor
      documentation; expect to meet autentificación when reading.
