- id: sec.vm-sprawl
  en:
    term: VM sprawl
    definition: >-
      The uncontrolled growth in the number of virtual machines, so that some
      are left without an owner, unpatched and unmonitored, wasting resources
      and widening the attack surface.
  es:
    verdict: both
    forms:
      - text: proliferación de máquinas virtuales
        article: la
        kind: noun
        primary: true
        note: >-
          A descriptive translation: no source checked uses a fixed Spanish
          term. INCIBE describes the problem as "excesivas máquinas
          virtuales".
      - text: VM sprawl
        headline: true
        article: el
        kind: noun
        note: The English name. Not found in the Spanish sources checked.
    definition: >-
      Crecimiento sin control del número de máquinas virtuales, de modo que
      algunas quedan sin responsable, sin parches y sin supervisión.
    examples:
      - es: >-
          Para evitar la proliferación de máquinas virtuales, cada una debe
          tener un responsable y una fecha de caducidad.
        en: >-
          To avoid VM sprawl, each virtual machine must have an owner and an
          expiry date.
    watchOut: >-
      Microsoft's Spanish documentation translates "sprawl" as "expansión"
      ("la expansión de servicios no autorizados") and keeps "proliferación"
      for "proliferation". The machines left behind are "máquinas virtuales
      inactivas" or "recursos huérfanos".
  topics: [asset]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [cloud.virtual-machine, cloud.virtualization, sec.attack-surface, sec.patch-management]
  sources:
    - label: "INCIBE, blog para empresas"
      url: "https://www.incibe.es/empresas/blog/virtualizacion-puede-ser-solucion-tus-problemas"
      found: ["Excesivas máquinas virtuales", "El número de VMs puede aumentar considerablemente"]
      checked: 2026-11-14
    - label: "Microsoft Learn, es-ES"
      url: "https://learn.microsoft.com/es-es/security/benchmark/azure/mcsb-v2-asset-management"
      found: ["la expansión de servicios no autorizados", "proliferación de TI en sombra", "máquinas virtuales inactivas", "recursos huérfanos"]
      checked: 2026-11-14
    - label: "Microsoft Learn, en-US (the same page in English)"
      url: "https://learn.microsoft.com/en-us/security/benchmark/azure/mcsb-v2-asset-management"
      found: ["unauthorized service sprawl", "shadow IT proliferation"]
      checked: 2026-11-14
  status: draft

- id: sec.misconfiguration
  en:
    term: misconfiguration
    definition: >-
      A setting that leaves a system less secure than intended, such as a
      publicly readable storage bucket, an over-permissive role or a default
      password. It is one of the commonest causes of data exposure in the
      cloud.
  es:
    verdict: translated
    forms:
      - text: mala configuración
        usedBy: [official, engineers]
        article: la
        kind: noun
        primary: true
        plural: las malas configuraciones
        note: >-
          The name of an incident type in the taxonomy of RD 43/2021.
          Telefónica Tech's blog uses it for exposed S3 buckets.
      - text: error de configuración
        usedBy: [google, microsoft]
        article: el
        kind: noun
        note: >-
          The mistake itself. Google and Microsoft write it in the plural:
          "errores de configuración".
      - text: configuración incorrecta
        usedBy: [official, engineers, microsoft]
        article: la
        kind: noun
        note: >-
          RD 43/2021 uses it to explain "mala configuración". Google's page
          says "configuración errónea".
    definition: >-
      Ajuste que deja un sistema menos protegido de lo previsto, como un
      bucket de almacenamiento con acceso público.
    examples:
      - es: La fuga de datos se debió a una mala configuración del bucket.
        en: The data leak was caused by a misconfiguration of the bucket.
  topics: [hardening, threat]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [sec.security-baseline, sec.vulnerability, sec.attack-surface, sec.data-breach]
  sources:
    - label: "Real Decreto 43/2021, de seguridad de las redes y sistemas de información (BOE)"
      url: "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2021-1192"
      found: ["Mala configuración", "Configuración incorrecta del software"]
      checked: 2026-11-14
    - label: "Telefónica Tech, blog"
      url: "https://telefonicatech.com/blog/almacenamiento-aws-s3-ataques-denial-of-wallet"
      found: ["mala configuración de sus accesos", "malas configuraciones"]
      checked: 2026-11-14
    - label: "Telefónica Tech, blog"
      url: "https://telefonicatech.com/blog/adopcion-cloud-publica-infraestructura-como-codigo"
      found: ["una configuración incorrecta también puede automatizarse"]
