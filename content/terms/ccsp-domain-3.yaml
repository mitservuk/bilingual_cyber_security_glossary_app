- id: sec.malware
  en:
    term: malware
    definition: >-
      Software written to damage or disrupt systems, or to gain unauthorised
      access to them or to their data. The category covers viruses, worms,
      trojans, spyware and ransomware.
  es:
    verdict: both
    forms:
      - text: malware
        usedBy: [official, engineers, microsoft]
        article: el
        kind: noun
        primary: true
        note: INCIBE's glossary lists it under the English name.
      - text: código dañino
        usedBy: [official]
        headline: true
        article: el
        kind: noun
        register: formal
        note: >-
          The term of the ENS: its measure op.exp.6 is "Protección frente a
          código dañino". RD 43/2021 glosses one with the other: "Malware
          (código dañino)".
      - text: software malicioso
        usedBy: [official]
        article: el
        kind: noun
        note: Given as a synonym in INCIBE's glossary.
      - text: programa malicioso
        usedBy: [official, eu]
        article: el
        kind: noun
        note: >-
          The wording of the NIS 2 Directive's Spanish text: "los programas
          maliciosos".
      - text: software malintencionado
        usedBy: [microsoft]
        article: el
        kind: noun
        note: Microsoft's wording in its Spanish pages.
    definition: >-
      Software creado para dañar sistemas o datos, o para acceder a ellos sin
      autorización.
    examples:
      - es: Hemos encontrado malware en uno de los servidores.
        en: We have found malware on one of the servers.
    watchOut: >-
      Unlike the English word, malware can be counted in Spanish: RD 43/2021
      writes "aquel malware que infecta una máquina".
  topics: [threat]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [sec.ransomware, sec.exploit, sec.sandbox, sec.apt]
  sources:
