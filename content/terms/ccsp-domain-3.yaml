- id: sec.vpn
  en:
    term: virtual private network
    acronym: VPN
    definition: >-
      An encrypted, authenticated tunnel that extends a private network
      across an untrusted one, connecting a remote user or another site as if
      they were on the local network.
  es:
    verdict: both
    acronym: VPN
    forms:
      - text: VPN
        usedBy: [official, engineers, google, microsoft]
        article: la
        kind: noun
        primary: true
        note: >-
          The English acronym is the everyday word, feminine because "red" is
          feminine: "una VPN". The written plural varies: "las VPN" in
          INCIBE's and Microsoft's texts, "las VPNs" on Google's pages and
          "VPNs" in job adverts.
      - text: red privada virtual
        usedBy: [official, engineers, google, microsoft]
        headline: true
        article: la
        kind: noun
        plural: las redes privadas virtuales
        note: >-
          The full name, used to introduce the acronym and in formal texts:
          the ENS requires "redes privadas virtuales cifradas".
    say: Said letter by letter, "uve-pe-ene".
    definition: >-
      Túnel cifrado y autenticado que extiende una red privada a través de
      una red pública como Internet.
    examples:
      - es: Para acceder a los servidores desde casa hay que conectarse a la VPN.
        en: To reach the servers from home you have to connect to the VPN.
  topics: [network]
  technology: [networking]
