- id: sec.apt
  en:
    term: advanced persistent threat
    acronym: APT
    definition: >-
      A well-resourced adversary, often state-sponsored, that gains access to
      a specific target and stays hidden there for a long time, typically to
      spy or to exfiltrate data.
  es:
    verdict: both
    acronym: APT
    forms:
      - text: amenaza persistente avanzada
        usedBy: [official, microsoft]
        article: la
        kind: noun
        primary: true
        note: The word order of the ENS and of RD 43/2021.
      - text: APT
        usedBy: [official, engineers]
        headline: true
        article: el
        kind: noun
        note: The English acronym is kept.
      - text: amenaza avanzada persistente
        usedBy: [official]
        article: la
        kind: noun
        note: The word order in INCIBE's glossary.
    definition: >-
      Adversario con muchos recursos que entra en un objetivo concreto y
      permanece oculto durante mucho tiempo para espiar o robar datos.
    examples:
      - es: Los indicios apuntan a una amenaza persistente avanzada.
        en: The evidence points to an advanced persistent threat.
    watchOut: >-
      Amenaza is feminine, but the acronym is treated as masculine in
      Telefónica Tech's blog: "un APT", "un ataque del tipo APT".
  topics: [threat]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [sec.threat, sec.malware, sec.exploit, sec.ids]
  sources:
    - label: "Esquema Nacional de Seguridad (RD 311/2022)"
      url: "https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191"
      found: ["detección de amenazas persistentes avanzadas"]
      checked: 2026-11-14
    - label: "Real Decreto 43/2021, de seguridad de las redes y sistemas de información (BOE)"
      url: "https://www.boe.es/diario_boe/txt.php?id=BOE-A-2021-1192"
      found: ["Amenaza Persistente Avanzada", "Nivel crítico: – APT"]
      checked: 2026-11-14
    - label: "INCIBE, Glosario de términos de ciberseguridad (2021)"
      url: "https://www.incibe.es/sites/default/files/contenidos/guias/doc/guia_glosario_ciberseguridad_2021.pdf"
      found: ["Amenaza avanzada persistente"]
      checked: 2026-11-14
    - label: "Microsoft Security, es-ES"
