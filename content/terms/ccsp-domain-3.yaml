- id: sec.network-segmentation
  en:
    term: network segmentation
    definition: >-
      Dividing a network into smaller zones and controlling the traffic
      allowed between them, so that a compromise or fault in one zone does not
      spread to the rest.
  es:
    verdict: translated
    forms:
      - text: segmentación de red
        usedBy: [official, engineers, microsoft]
        article: la
        kind: noun
        primary: true
        note: >-
          Also written "segmentación de redes", in INCIBE-CERT posts and job
          adverts, and "segmentación de la red" in the Spanish text of NIS 2.
      - text: segmentar
        usedBy: [official, engineers, microsoft]
        kind: verb
        note: >-
          To segment: "segmentar una red física en múltiples redes lógicas".
          Each zone is "un segmento de red".
    definition: >-
      Técnica que divide una red en segmentos más pequeños y controla el
      tráfico entre ellos para limitar el alcance de un incidente.
    examples:
      - es: La segmentación de red evita que un atacante llegue a los servidores desde la red de oficina.
        en: Network segmentation stops an attacker reaching the servers from the office network.
    watchOut: >-
      Spain's ENS does not name the measure "segmentación": it is "separación
      de flujos de información en la red" (mp.com.4), and segmentación appears
      in its reinforcements, "segmentación lógica" and "segmentación física".
  topics: [network]
  technology: [networking]
