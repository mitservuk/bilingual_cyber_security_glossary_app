- id: sec.bcp
  en:
    term: business continuity plan
    acronym: BCP
    definition: >-
      The documented procedures and resources an organisation uses to keep
      its critical processes running, and to restore them, when a disruption
      occurs.
  es:
    verdict: both
    acronym: PCN
    forms:
      - text: plan de continuidad de negocio
        usedBy: [official, engineers]
        article: el
        kind: noun
        primary: true
        plural: los planes de continuidad de negocio
        note: The full term, at INCIBE and in practitioner writing.
      - text: PCN
        usedBy: [official]
        article: el
        kind: noun
        note: >-
          The Spanish acronym, used in INCIBE's crisis management guide next
          to DRP for the disaster recovery plan.
      - text: BCP
        usedBy: [official]
        article: el
        kind: noun
        note: The English acronym, which INCIBE's glossary gives as a synonym.
      - text: plan de continuidad
        usedBy: [official]
        article: el
        kind: noun
        register: formal
        note: >-
          The short name, and the name of the ENS measure (op.cont.2).
          DORA's Spanish text speaks of "planes de continuidad de la
          actividad".
    definition: >-
      Conjunto de procedimientos y recursos con los que una organización
      mantiene y recupera sus procesos críticos cuando se produce una
      interrupción.
    examples:
      - es: El plan de continuidad de negocio se revisa y se prueba una vez al año.
        en: The business continuity plan is reviewed and tested once a year.
    watchOut: >-
      "Plan de contingencia" is not a synonym in INCIBE's usage: it is the
      part that restores the IT systems supporting the critical processes,
      one of the plans inside the plan de continuidad.
  topics: [incident, grc]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
