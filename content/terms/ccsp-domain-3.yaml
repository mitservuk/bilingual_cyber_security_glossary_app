# CCSP Domain 3: Cloud Platform and Infrastructure Security.
# Format is described in content/README.md. Every `found` text was confirmed
# on its page with scripts/check_sources.py when these entries were written.

- id: cloud.management-plane
  en:
    term: management plane
    definition: >-
      The consoles, APIs and tooling through which cloud resources and the
      platform itself are configured and administered. Whoever controls it
      controls everything built on top of it, which makes it a prime target.
  es:
    verdict: translated
    forms:
      - text: plano de gestión
        usedBy: [official, microsoft]
        article: el
        kind: noun
        primary: true
        note: >-
          INCIBE's 5G guide uses it in the network sense, beside the user
          plane and the signalling plane.
      - text: plano de administración
        usedBy: [microsoft]
        article: el
        kind: noun
        note: >-
          Microsoft's page on its enterprise access model uses both this and
          "plano de gestión".
    definition: >-
      Conjunto de consolas, API y herramientas con las que se configuran y
      administran los recursos de la nube y la propia plataforma.
    examples:
      - es: El acceso al plano de gestión está protegido con MFA.
        en: Access to the management plane is protected with MFA.
  topics: [architecture, iam]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [cloud.control-plane, sec.iam, sec.mfa, sec.least-privilege]
  sources:
    - label: "INCIBE y Universidad de León, Guía de buenas prácticas de ciberseguridad para redes privadas 5G"
      url: "https://www.incibe.es/sites/default/files/2025-12/INCIBE&ULE_GuiaBuenasPracticasCiberseguridadRedesPrivadas5G.pdf"
      found: ["el plano de señalización y el plano de gestión"]
      checked: 2026-11-14
    - label: "Microsoft Learn, es-ES"
      url: "https://learn.microsoft.com/es-es/security/privileged-access-workstations/privileged-access-access-model"
      found: ["creando un plano de gestión", "Plano de administración"]
      checked: 2026-11-14
  status: draft

- id: cloud.control-plane
  en:
    term: control plane
    definition: >-
      The part of a system that takes the decisions: it accepts requests to
      create, change or delete resources and configures the data plane, which
      carries the workload's own traffic.
  es:
    verdict: both
    forms:
      - text: plano de control
        usedBy: [official, engineers, microsoft, aws]
        article: el
        kind: noun
        primary: true
      - text: control plane
        usedBy: [engineers]
        headline: true
        article: el
        kind: noun
        note: >-
          The English term is also written as it stands: Paradigma Digital's
          cloud comparison has "control plane de tráfico" on the same page as
          "plano de control".
      - text: plano de datos
        usedBy: [official, engineers, microsoft, aws]
        article: el
        kind: noun
        note: Data plane, its counterpart.
    definition: >-
      Parte de un sistema que recibe las peticiones de creación o cambio de
      recursos y configura el plano de datos, por donde pasa el tráfico.
    examples:
      - es: El proveedor gestiona el plano de control del clúster de Kubernetes.
        en: The provider manages the control plane of the Kubernetes cluster.
  topics: [architecture]
  technology: [cloud-general, kubernetes]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [cloud.management-plane, cloud.sdn, cloud.orchestration, cloud.container]
  sources:
    - label: "INCIBE y Universidad de León, Guía de buenas prácticas de ciberseguridad para redes privadas 5G"
      url: "https://www.incibe.es/sites/default/files/2025-12/INCIBE&ULE_GuiaBuenasPracticasCiberseguridadRedesPrivadas5G.pdf"
      found: ["desacoplando el plano de control del plano de datos"]
      checked: 2026-11-14
    - label: "Paradigma Digital, blog"
      url: "https://www.paradigmadigital.com/dev/guerra-de-nubes-aws-azure-gcp/"
      found: ["un plano de control del tráfico", "Control plane de tráfico"]
      checked: 2026-11-14
    - label: "Paradigma Digital, blog"
      url: "https://www.paradigmadigital.com/dev/jugando-con-istio-the-next-big-thing-en-microservicios-1-2/"
      found: ["Plano de datos", "Plano de control"]
      checked: 2026-11-14
    - label: "Microsoft Learn, es-ES"
      url: "https://learn.microsoft.com/es-es/azure/azure-resource-manager/management/control-plane-and-data-plane"
      found: ["El plano de control se utiliza para administrar los recursos", "plano de control y plano de datos"]
