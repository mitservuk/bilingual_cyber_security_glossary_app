- id: sec.exploit
  en:
    term: exploit
    definition: >-
      Code or a technique that takes advantage of a specific vulnerability to
      make a system behave in a way its owner did not intend, typically to
      gain access or raise privileges.
  es:
    verdict: english-kept
    forms:
      - text: exploit
        usedBy: [official, engineers]
        article: el
        kind: noun
        primary: true
        plural: los exploits
        note: >-
          Kept in English. INCIBE's glossary lists it under this name, and the
          incident taxonomy of RD 43/2021 has "ataque empleando exploit
          desconocido".
      - text: explotar
        usedBy: [official, engineers]
        kind: verb
        note: >-
          To exploit: "explotar una vulnerabilidad". The noun is
          "explotación": "explotación de vulnerabilidades conocidas".
    definition: >-
      Código o técnica que aprovecha una vulnerabilidad concreta para provocar
      un comportamiento no previsto en un sistema.
    examples:
      - es: Ya hay un exploit público para esta vulnerabilidad.
        en: There is already a public exploit for this vulnerability.
    watchOut: >-
      Microsoft's Spanish security page does not keep the word: "exploit kit"
      becomes "kit de vulnerabilidad de seguridad", which reads as "security
      vulnerability kit". Explotar also means to operate or run something:
      the EU Data Act says "explotar la infraestructura".
  topics: [threat, vulnmgmt]
