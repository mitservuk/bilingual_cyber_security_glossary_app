- id: cloud.tenant-partitioning
  en:
    term: tenant partitioning
    definition: >-
      Keeping each tenant's resources and data apart on shared
      infrastructure, by logical or physical means, so that one tenant can
      neither reach nor affect another's.
  es:
    verdict: both
    forms:
      - text: aislamiento de inquilinos
        usedBy: [microsoft, aws]
        article: el
        kind: noun
        primary: true
        note: >-
          The heading for tenant isolation in Microsoft's and AWS's Spanish
          documentation, where a tenant is "un inquilino". No set Spanish
          rendering of "partitioning" itself was found.
      - text: aislamiento entre tenants
        article: el
        kind: noun
        note: >-
          With the English "tenant" that engineers keep (see multitenancy).
          Not confirmed in a source read for this entry.
    definition: >-
