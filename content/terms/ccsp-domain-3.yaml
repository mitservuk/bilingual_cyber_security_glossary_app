- id: sec.ransomware
  en:
    term: ransomware
    definition: >-
      Malware that encrypts or locks the victim's data or systems and demands
      payment for restoring access, often with the added threat of publishing
      stolen data.
  es:
    verdict: english-kept
    forms:
      - text: ransomware
        usedBy: [official, engineers, google]
        article: el
        kind: noun
        primary: true
        note: >-
          Kept in English, as a masculine noun: "el ransomware", "un ataque
          de ransomware".
      - text: programa de secuestro
        usedBy: [eu]
        article: el
        kind: noun
        register: formal
        note: >-
          The translation in the NIS 2 Directive's Spanish text: "ataques con
          programas de secuestro".
      - text: rescate
        usedBy: [official, eu]
        article: el
        kind: noun
        note: >-
          The ransom, as in "si la víctima no paga el rescate".
    definition: >-
      Malware que cifra o bloquea los datos de la víctima y exige un pago
      para devolverle el acceso.
    examples:
      - es: Un ataque de ransomware cifró todos los servidores de ficheros.
        en: A ransomware attack encrypted all the file servers.
    watchOut: >-
      Watch the spelling. The Spanish text of NIS 2 itself prints the English
      word wrongly, as «ramsonware».
  topics: [threat, incident]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [sec.malware, sec.backup, sec.encryption, sec.incident-response]
