- id: sec.dmz
  en:
    term: demilitarized zone
    acronym: DMZ
    definition: >-
      A network segment placed between an untrusted network, usually the
      Internet, and the internal network, holding the services that must be
      reachable from outside so that their compromise does not expose
      internal systems.
  es:
    verdict: both
    acronym: DMZ
    forms:
      - text: DMZ
        usedBy: [official, engineers, aws]
        article: la
        kind: noun
        primary: true
        note: >-
          The English acronym is the working term, feminine after "zona": "la
          DMZ", "una DMZ".
      - text: zona desmilitarizada
        usedBy: [official, microsoft]
        headline: true
        article: la
        kind: noun
        note: >-
          The full name in Spanish, given to explain the acronym.
      - text: red perimetral
        usedBy: [microsoft]
        article: la
        kind: noun
        note: >-
          "Perimeter network", Microsoft's name for it in its Spanish
          documentation: "red perimetral (también conocido como DMZ, zona
          desmilitarizada y subred filtrada)".
    say: Said letter by letter, "de-eme-zeta".
    definition: >-
      Segmento de red situado entre Internet y la red interna, donde se
      colocan los servicios que deben ser accesibles desde el exterior.
    examples:
      - es: El servidor web está en la DMZ y la base de datos en la red interna.
        en: The web server is in the DMZ and the database is on the internal network.
  topics: [network, architecture]
  technology: [networking]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [sec.firewall, sec.network-segmentation, sec.bastion-host, sec.defence-in-depth]
  sources:
