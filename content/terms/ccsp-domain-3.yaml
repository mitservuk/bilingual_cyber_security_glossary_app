- id: sec.authorization
  en:
    term: authorization
    definition: >-
      Determining which actions an authenticated subject may perform on which
      resources, and granting or denying each request accordingly.
  es:
    verdict: translated
    forms:
      - text: autorización
        usedBy: [official, engineers, microsoft]
        article: la
        kind: noun
        primary: true
        note: >-
          Usually paired with its sibling: "autenticación y autorización".
          Microsoft notes that the English short forms AuthN and AuthZ are
          used too.
      - text: autorizar
        usedBy: [microsoft]
        kind: verb
        note: 'To authorise: "autenticar y autorizar a los usuarios".'
      - text: derechos de acceso
        usedBy: [official]
        article: los
        kind: noun
        note: >-
          Access rights, which is what authorisation grants. The ENS measure
          is "proceso de gestión de derechos de acceso" (op.acc.4).
    definition: >-
      Proceso que determina qué acciones puede realizar un usuario ya
      autenticado sobre cada recurso.
    examples:
      - es: El usuario se autentica bien, pero falla la autorización porque le falta un rol.
        en: The user authenticates fine, but authorisation fails because a role is missing.
    watchOut: >-
      In the ENS, "proceso de autorización" (org.4) is a different thing: the
      formal sign-off needed before equipment, applications or links go into
      service. And as in English, "sin autorización" just means without
      permission.
