      found: ["aislamiento entre redes virtuales"]
      checked: 2026-11-14
    - label: "Microsoft Learn, es-ES"
      url: "https://learn.microsoft.com/es-es/azure/virtual-network/virtual-networks-overview"
      found: ["¿Por qué usar una red virtual", "todos los recursos de una red virtual"]
      checked: 2026-11-14
    - label: "Oracle España"
