- id: sec.failover
  en:
    term: failover
    definition: >-
      Switching a service, automatically or by hand, from a failed component
      or site to a standby one so that it can carry on. The return to the
      original is failback.
  es:
    verdict: both
    forms:
      - text: failover
        usedBy: [engineers]
        article: el
        kind: noun
        primary: true
        note: >-
          The English word, masculine: "hacer el failover".
      - text: conmutación por error
        usedBy: [google, microsoft, aws]
        headline: true
        article: la
        kind: noun
        note: >-
          The translation in Google's, Microsoft's and AWS's documentation.
          Microsoft calls failback "conmutación por recuperación".
    definition: >-
      Paso del servicio, automático o manual, de un componente o un centro
      que ha fallado a otro de reserva para que siga funcionando.
    examples:
      - es: Probamos el failover al centro de respaldo dos veces al año.
        en: We test the failover to the backup site twice a year.
