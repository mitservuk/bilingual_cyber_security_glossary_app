- id: sec.microsegmentation
  en:
    term: microsegmentation
    definition: >-
      Segmentation applied at the level of individual workloads or
      applications, with a policy for each, so that traffic inside a network
      zone is restricted as tightly as traffic entering it.
  es:
    verdict: translated
    forms:
      - text: microsegmentación
        usedBy: [official, engineers, google, microsoft]
        article: la
        kind: noun
        primary: true
        note: >-
          Written as one word, without a hyphen. Often mentioned together
          with "movimiento lateral" (lateral movement), which it is meant to
          contain.
    definition: >-
      Segmentación aplicada a cada carga de trabajo o aplicación, con
      políticas propias, para limitar el movimiento lateral dentro de la red.
    examples:
      - es: Con la microsegmentación, cada carga de trabajo solo habla con los servicios que necesita.
        en: With microsegmentation, each workload only talks to the services it needs.
