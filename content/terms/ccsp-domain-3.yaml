- id: sec.recovery-service-level
  en:
    term: recovery service level
    acronym: RSL
    definition: >-
      The proportion of normal production service, usually a percentage of
      capacity or functionality, that must be restored for a recovery to
      count as meeting its objectives.
  es:
    verdict: translated
    forms:
      - text: nivel mínimo de recuperación del servicio
        usedBy: [official]
        article: el
        kind: noun
        primary: true
        plural: los niveles mínimos de recuperación del servicio
        note: >-
          INCIBE's name for the closest concept in its continuity guidance,
          which it labels ROL (revised operating level): the minimum level an
          activity must reach to be considered recovered.
    definition: >-
      Parte del servicio normal, normalmente un porcentaje, que debe
      restablecerse para considerar recuperada una actividad tras un
      desastre.
    examples:
      - es: El nivel mínimo de recuperación del servicio es el 50 % de la capacidad normal.
        en: The recovery service level is 50% of normal capacity.
    watchOut: >-
      RSL is CCSP exam vocabulary. No Spanish source using the acronym, or a
      settled Spanish expansion of it, was found: explain the idea rather
      than rely on the acronym. INCIBE's ROL is a near equivalent, not the
      same term.
  topics: [incident]
  technology: []
  curriculum:
