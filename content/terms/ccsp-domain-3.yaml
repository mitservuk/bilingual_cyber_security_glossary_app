- id: cloud.sdn
  en:
    term: software-defined networking
    acronym: SDN
    definition: >-
      An approach to networking that takes the control plane out of the
      individual devices and centralises it in software, so that the network
      can be programmed and reconfigured through APIs.
  es:
    verdict: both
    acronym: SDN
    forms:
      - text: SDN
        usedBy: [official, engineers, microsoft]
        article: la
        kind: noun
        primary: true
        note: >-
          The English acronym, glossed in Spanish on first mention. Microsoft
          writes it with no article: "puede usar SDN para crear...".
      - text: redes definidas por software
        usedBy: [official, microsoft]
        headline: true
        article: las
        kind: noun
        note: >-
          The expansion, in the plural for the technology as a whole. One
          such network is "una red definida por software", as Telefónica Tech
          writes.
    say: Said letter by letter, "ese-de-ene".
    definition: >-
      Arquitectura de red en la que el plano de control se separa de los
      equipos y se centraliza en software, de modo que la red se puede
      programar.
    examples:
      - es: La red del proveedor se gestiona con SDN, no equipo por equipo.
        en: The provider's network is managed with SDN, not device by device.
  topics: [network, architecture]
  technology: [networking]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [cloud.control-plane, cloud.virtual-network, cloud.virtualization, sec.microsegmentation]
  sources:
    - label: "INCIBE y Universidad de León, Guía de buenas prácticas de ciberseguridad para redes privadas 5G"
      url: "https://www.incibe.es/sites/default/files/2025-12/INCIBE&ULE_GuiaBuenasPracticasCiberseguridadRedesPrivadas5G.pdf"
      found: ["SDN (Software Defined Networks / Redes Definidas por Software)"]
      checked: 2026-11-14
    - label: "Telefónica Tech, blog"
      url: "https://telefonicatech.com/blog/un-recorrido-del-mainframe-a-la-nube"
      found: ["lo que se conoce como SDN", "red definida por software"]
      checked: 2026-11-14
    - label: "Microsoft Learn, es-ES"
      url: "https://learn.microsoft.com/es-es/windows-server/networking/sdn/software-defined-networking"
      found: ["Redes definidas por software (SDN)", "Puede usar SDN para crear"]
      checked: 2026-11-14
  status: sourced

- id: cloud.vpc
  en:
    term: virtual private cloud
    acronym: VPC
    definition: >-
      A logically isolated network that a customer defines inside a public
      cloud, with its own address ranges, subnets, routes and filtering
      rules.
  es:
    verdict: both
    acronym: VPC
    forms:
      - text: VPC
        usedBy: [engineers, google, aws]
        article: la
        kind: noun
        primary: true
        plural: las VPC
        note: >-
          The acronym is the working term. AWS and Google make it feminine
          ("una VPC"); Paradigma Digital also writes "del VPC" and the plural
          "VPCs".
      - text: nube privada virtual
        usedBy: [google, aws]
        headline: true
        article: la
        kind: noun
        note: >-
          The expansion in Google's and AWS's pages. AWS's guide also has the
          other word order, "nubes virtuales privadas".
    definition: >-
      Red aislada de forma lógica que un cliente define dentro de una nube
      pública, con sus propios rangos de direcciones, subredes y reglas.
    examples:
      - es: La base de datos está en una subred privada de la VPC.
        en: The database is in a private subnet of the VPC.
    watchOut: >-
      Three near-identical names: "nube privada virtual" is a VPC, "red
      privada virtual" is a VPN, and "nube privada" is a private cloud.
  topics: [network]
  technology: [cloud-general, networking]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [cloud.virtual-network, sec.security-group, sec.network-segmentation, sec.vpn]
  sources:
    - label: "Paradigma Digital, blog"
      url: "https://www.paradigmadigital.com/dev/desplegar-microservicios-amazon/"
      found: ["en su VPC", "tarjeta de red del VPC"]
      checked: 2026-11-14
    - label: "Paradigma Digital, blog"
      url: "https://www.paradigmadigital.com/dev/guerra-de-nubes-aws-azure-gcp/"
      found: ["Conectividad privada entre VPCs"]
      checked: 2026-11-14
    - label: "Google Cloud, páginas para España"
      url: "https://cloud.google.com/vpc?hl=es"
      found: ["Nube privada virtual (VPC)", "Una sola VPC"]
      checked: 2026-11-14
    - label: "AWS, documentación en español"
      url: "https://docs.aws.amazon.com/es_es/vpc/latest/userguide/what-is-amazon-vpc.html"
      found: ["nube privada virtual (VPC)", "Nubes virtuales privadas (VPC)", "Una VPC es una red virtual"]
      checked: 2026-11-14
    - label: "INCIBE, Glosario de términos de ciberseguridad (2021)"
      url: "https://www.incibe.es/sites/default/files/contenidos/guias/doc/guia_glosario_ciberseguridad_2021.pdf"
      found: ["Una red privada virtual, también conocida por sus siglas VPN"]
      checked: 2026-11-14
  status: sourced

- id: cloud.virtual-network
  en:
    term: virtual network
    definition: >-
      A network built in software on top of shared physical infrastructure,
      which behaves for its owner like a private network with its own
      addressing, subnets and routing.
  es:
    verdict: translated
    forms:
      - text: red virtual
        usedBy: [engineers, google, microsoft, oracle, aws]
        article: la
        kind: noun
        primary: true
        plural: las redes virtuales
        note: >-
          Microsoft calls an Azure VNet "una red virtual". Oracle's
          equivalent, the VCN, is a "red virtual en la nube".
    definition: >-
      Red creada por software sobre una infraestructura física compartida,
      que su propietario usa como una red privada con sus propias subredes.
    examples:
      - es: Las dos máquinas virtuales están en la misma red virtual.
        en: The two virtual machines are on the same virtual network.
    watchOut: >-
      One extra word changes the meaning: "red privada virtual" is a VPN.
  topics: [network]
  technology: [cloud-general, networking]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [cloud.vpc, cloud.sdn, sec.network-segmentation, sec.vpn]
  sources:
