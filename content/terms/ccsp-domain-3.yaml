- id: cloud.cdn
  en:
    term: content delivery network
    acronym: CDN
    definition: >-
      A geographically distributed network of servers that caches content
      close to users, reducing latency and taking load, including much
      volumetric attack traffic, off the origin.
  es:
    verdict: both
    acronym: CDN
    forms:
      - text: CDN
        usedBy: [engineers, google, microsoft, aws]
        article: la
        kind: noun
        primary: true
        plural: las CDN
        note: >-
          The acronym is the working term. AWS and Google make it feminine
          ("una CDN", "la CDN"); Paradigma Digital writes "un CDN".
      - text: red de distribución de contenidos
        usedBy: [eu]
        headline: true
        article: la
        kind: noun
        note: >-
          The term defined in the Spanish text of the NIS 2 directive. Google
          Cloud writes it in the singular, "red de distribución de
          contenido".
      - text: red de entrega de contenido
        usedBy: [engineers, microsoft, aws]
        article: la
        kind: noun
        note: >-
          The wording of Microsoft and AWS. AWS's own page says CDN can stand
          for either "red de entrega" or "red de distribución".
    say: Said letter by letter, "ce-de-ene".
    definition: >-
      Red de servidores repartidos geográficamente que guarda copias del
      contenido cerca de los usuarios para servirlo con menos latencia.
    examples:
      - es: Servimos las imágenes desde una CDN para reducir la latencia.
        en: We serve the images from a CDN to reduce latency.
  topics: [network]
  technology: [networking]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  frameworks: [NIS2]
  related: [cloud.load-balancer, cloud.edge-computing, sec.dos, cloud.region]
  sources:
