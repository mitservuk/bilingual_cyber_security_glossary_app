- id: sec.ips
  en:
    term: intrusion prevention system
    acronym: IPS
    definition: >-
      A system placed in the traffic path that detects attacks in the same
      way as an IDS and also blocks or drops the offending traffic.
  es:
    verdict: both
    acronym: IPS
    forms:
      - text: IPS
        usedBy: [official, engineers]
        article: el
        kind: noun
        primary: true
        note: >-
          The English acronym is the working term, masculine: "el IPS".
          Combined products are IDS/IPS or IDPS, "sistemas de detección y
          prevención de intrusiones" in Microsoft's wording.
      - text: sistema de prevención de intrusiones
        usedBy: [official, aws]
        headline: true
        article: el
        kind: noun
        note: The expansion in INCIBE's glossary and in AWS's Spanish pages.
      - text: sistema de prevención de intrusos
        usedBy: [official]
        article: el
        kind: noun
        note: >-
          The other expansion, with intrusos (intruders), used in a 2026
          royal decree on cloud training. Google Cloud also writes
          "detección y prevención de intrusos".
    say: Said letter by letter, "i-pe-ese".
    definition: >-
      Sistema situado en el camino del tráfico que detecta los ataques y,
      además, los bloquea.
    examples:
      - es: El IPS ha bloqueado varios intentos de explotar esa vulnerabilidad.
        en: The IPS has blocked several attempts to exploit that vulnerability.
    watchOut: >-
      Do not misread "IPs": engineers write "las IPs" for IP addresses
      (feminine plural), which differs from "el IPS" only by the lower-case s.
  topics: [network, detection]
  technology: [networking]
