- id: sec.honeypot
  en:
    term: honeypot
    definition: >-
      A decoy system or service, deliberately made attractive to attackers,
      that has no legitimate use, so that any interaction with it reveals an
      attack and can be studied.
  es:
    verdict: english-kept
    forms:
      - text: honeypot
        usedBy: [official, engineers]
        article: el
        kind: noun
        primary: true
        plural: los honeypots
        note: >-
          Kept in English by INCIBE and by practitioners: "un honeypot es una
          herramienta de seguridad".
      - text: señuelo
        usedBy: [official]
        article: el
        kind: noun
        note: >-
          "Decoy". INCIBE's glossary gives it as the Spanish synonym, and
          INCIBE-CERT speaks of "sistemas señuelo". In INCIBE's own posts it
          explains the idea, while honeypot names the tool.
    definition: >-
      Sistema señuelo, atractivo para un atacante y sin uso legítimo, que
      permite detectar los ataques y estudiar cómo actúa quien los realiza.
    examples:
      - es: Hemos puesto un honeypot en la red para detectar movimientos laterales.
        en: We have put a honeypot on the network to detect lateral movement.
    watchOut: >-
      Señuelo is also the ordinary word for a lure, including the bait in a
      phishing or social engineering attack, so on its own it does not
      necessarily mean a honeypot.
  topics: [detection, threat]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [sec.ids, sec.sandbox, sec.threat]
  sources:
