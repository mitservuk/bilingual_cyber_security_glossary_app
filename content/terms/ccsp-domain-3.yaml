- id: sec.account-hijacking
  en:
    term: account hijacking
    definition: >-
      Taking over a legitimate user or service account, usually with stolen
      credentials or session tokens, in order to act with its privileges.
      Also called account takeover.
  es:
    verdict: translated
    forms:
      - text: secuestro de cuentas
        usedBy: [official]
        article: el
        kind: noun
        primary: true
      - text: robo de cuentas
        usedBy: [official, engineers]
        article: el
        kind: noun
        note: >-
          Account theft. INCIBE uses the two together: "robo o secuestro de
          cuentas".
      - text: apropiación de cuentas
        usedBy: [aws]
        article: la
        kind: noun
        note: >-
          AWS's rendering of "account takeover" in its Spanish documentation,
          which is machine-translated. Microsoft's page says "toma de control
          de cuentas".
    definition: >-
      Toma del control de una cuenta legítima, normalmente con credenciales
      robadas, para actuar con sus privilegios.
    examples:
      - es: La autenticación multifactor ayuda a evitar el secuestro de cuentas.
        en: Multi-factor authentication helps to prevent account hijacking.
  topics: [threat, iam]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [sec.mfa, sec.authentication, sec.iam, sec.mitm]
  sources:
    - label: "INCIBE, blog"
      url: "https://www.incibe.es/ciudadania/blog/suplantacion-de-identidad-y-secuestro-de-cuentas-como-actuar"
      found: ["Suplantación de identidad y secuestro de cuentas", "Robo o secuestro de cuentas", "robo de cuentas"]
      checked: 2026-11-14
    - label: "El Lado del Mal"
