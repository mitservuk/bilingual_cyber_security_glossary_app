- id: cloud.load-balancer
  en:
    term: load balancer
    definition: >-
      A component that spreads incoming traffic across several servers or
      instances and stops sending it to those that fail their health checks.
  es:
    verdict: translated
    forms:
      - text: balanceador de carga
        usedBy: [engineers, google]
        article: el
        kind: noun
        primary: true
        plural: los balanceadores de carga
        note: >-
          Often shortened to "el balanceador" once the context is clear.
      - text: equilibrador de carga
        usedBy: [microsoft, oracle, aws]
        article: el
        kind: noun
        note: >-
          The wording of Microsoft, AWS and Oracle. Microsoft's Azure Load
          Balancer page has "balanceador de carga" in places as well.
      - text: balanceo de carga
        usedBy: [official, engineers, google]
        article: el
        kind: noun
        note: >-
          Load balancing, the activity. Microsoft and AWS call it "equilibrio
          de carga".
    definition: >-
      Componente que reparte el tráfico entrante entre varios servidores o
      instancias y deja de enviarlo a los que no responden.
    examples:
      - es: El balanceador de carga reparte el tráfico entre tres servidores.
        en: The load balancer spreads the traffic across three servers.
    watchOut: >-
      The Spain-based blogs read for this entry all say "balanceador";
      "equilibrador" is what you will read in Azure, AWS and Oracle
      documentation.
  topics: [network, architecture]
  technology: [networking]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [sec.high-availability, sec.failover, cloud.cdn, sec.dos]
  sources:
