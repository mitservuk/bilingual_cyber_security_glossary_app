- id: tech.ups
  en:
    term: uninterruptible power supply
    acronym: UPS
    definition: >-
      A battery-backed device that takes over instantly when mains power
      fails or fluctuates, keeping equipment running long enough for a
      generator to start or for an orderly shutdown.
  es:
    verdict: translated
    acronym: SAI
    forms:
      - text: SAI
        usedBy: [official, aws]
        article: el
        kind: noun
        primary: true
        plural: los SAI
        note: >-
          The acronym of "sistema de alimentación ininterrumpida". The ENS
          measure behind it is "energía eléctrica" (mp.if.4), reinforced by
          "suministro eléctrico de emergencia".
      - text: sistema de alimentación ininterrumpida
        usedBy: [official, aws]
        article: el
        kind: noun
        note: The full name, used to introduce the acronym.
      - text: grupo electrógeno
        usedBy: [official]
        article: el
        kind: noun
        note: >-
          A generator set. INCIBE names it beside the SAI as a way of keeping
          the CPD supplied with electricity.
    say: Said as a word, "sai".
    definition: >-
      Equipo con baterías que sigue alimentando los sistemas cuando falla el
      suministro eléctrico, hasta que arranca un generador o se apagan de
      forma ordenada.
    examples:
      - es: Si se va la luz, el SAI mantiene los servidores encendidos unos minutos.
        en: If the power goes, the UPS keeps the servers on for a few minutes.
    watchOut: >-
      The acronym changes with the language: UPS in English, SAI in Spanish.
      INCIBE-CERT explains the English one as "conocidos como UPS por sus
      siglas en inglés".
