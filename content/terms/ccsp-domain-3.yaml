- id: sec.insider-threat
  en:
    term: insider threat
    definition: >-
      The risk that someone with legitimate access (an employee, a contractor
      or a provider's administrator) misuses it, whether maliciously or
      through negligence.
  es:
    verdict: both
    forms:
      - text: amenaza interna
        usedBy: [official, google, microsoft]
        article: la
        kind: noun
        primary: true
      - text: insider
        usedBy: [official, google]
        headline: true
        article: el
        kind: noun
        plural: los insiders
        note: >-
          The person, kept in English. INCIBE defines "insider" as someone
          with legitimate access who misuses it, and separates "insiders
          maliciosos y negligentes". Google's page writes "amenazas de
          insiders".
      - text: riesgo interno
        usedBy: [microsoft]
        article: el
        kind: noun
        note: Microsoft's wording for "insider risk".
    definition: >-
      Riesgo de que una persona con acceso legítimo lo use mal, de forma
      intencionada o por descuido.
    examples:
      - es: El control de accesos limita el daño de una amenaza interna.
        en: Access control limits the damage of an insider threat.
  topics: [threat, human]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [sec.threat, sec.least-privilege, sec.separation-of-duties, sec.dlp]
  sources:
    - label: "INCIBE, blog para empresas"
      url: "https://www.incibe.es/empresas/blog/el-enemigo-esta-dentro"
      found: ["una amenaza interna", "una fuente de amenazas internas"]
      checked: 2026-11-14
    - label: "INCIBE, blog para empresas"
      url: "https://www.incibe.es/empresas/blog/insiders-como-atacan-desde-dentro"
      found: ["Se conoce como insider a una persona con acceso legítimo", "dos tipos de insiders: maliciosos y negligentes"]
      checked: 2026-11-14
    - label: "Google Cloud, páginas para España"
