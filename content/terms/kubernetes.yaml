- id: k8s.cloud-native
  en:
    term: cloud native
    definition: 'Built to run in the cloud from the start: packaged in containers, orchestrated,
      automated and made of loosely coupled services.'
  es:
    verdict: both
    forms:
      - text: nativo de la nube
        kind: adjective
        primary: true
        usedBy:
          - microsoft
          - google
      - text: cloud native
        kind: adjective
        headline: true
        usedBy:
          - aws
        note: 'Very often kept in English: aplicaciones cloud native.'
    definition: 'Diseñado desde el principio para ejecutarse en la nube: empaquetado en contenedores,
      orquestado, automatizado y formado por servicios poco acoplados.'
    examples:
      - es: La nueva plataforma es nativa de la nube y se despliega en Kubernetes.
        en: The new platform is cloud native and is deployed on Kubernetes.
  topics:
    - architecture
  technology:
    - kubernetes
    - containers-oci
    - cloud-general
  curriculum:
    - cert: KCSA
      outline: current
      domain: 1
  related:
    - tech.kubernetes
    - cloud.container
    - cloud.microservices
    - sec.cnapp
  sources:
    - label: Microsoft Learn, es-ES
      url: https://learn.microsoft.com/es-es/azure/architecture/guide/technology-choices/compute-decision-tree
      found:
        - nativas de la nube
      checked: 2026-11-15
    - label: Google Cloud, páginas para España
      url: https://cloud.google.com/learn/what-is-cloud-native?hl=es
      found:
        - nativas de la nube
      checked: 2026-11-15
    - label: AWS, páginas en español
