      checked: 2026-11-15
  status: sourced

- id: k8s.4cs
  en:
    term: the 4Cs of cloud native security
    definition: 'A layered model of where security applies: cloud, cluster, container and
      code, each layer resting on the one outside it.'
  es:
    verdict: translated
    forms:
      - text: las 4C de la seguridad nativa de la nube
        kind: noun
        primary: true
      - text: nube, clúster, contenedor y código
        kind: noun
        note: The four layers, from the outside in.
    definition: 'Modelo por capas de dónde se aplica la seguridad: nube, clúster, contenedor
      y código, cada una apoyada en la exterior.'
    examples:
      - es: Según las 4C, un clúster no puede ser más seguro que la nube sobre la que corre.
        en: According to the 4Cs, a cluster cannot be more secure than the cloud it runs on.
  topics:
    - architecture
  technology:
    - kubernetes
    - containers-oci
  curriculum:
    - cert: KCSA
      outline: current
      domain: 1
  related:
    - sec.defence-in-depth
    - k8s.cloud-native
    - cloud.shared-responsibility
  sources: []
  status: draft

- id: k8s.node
  en:
    term: node
    definition: A machine, virtual or physical, in a Kubernetes cluster. Worker nodes run
      the pods; control plane nodes run the cluster's own components.
  es:
    verdict: translated
    forms:
      - text: nodo
        article: el
        kind: noun
        primary: true
        plural: los nodos
        usedBy:
          - microsoft
          - google
      - text: nodo de trabajo
        article: el
        kind: noun
        usedBy:
          - microsoft
        note: A worker node; also nodo worker.
    definition: Máquina, virtual o física, de un clúster de Kubernetes. Los nodos de trabajo
      ejecutan los pods; los del plano de control, los componentes del propio clúster.
    examples:
      - es: El clúster tiene tres nodos de trabajo repartidos en tres zonas.
        en: The cluster has three worker nodes spread across three zones.
