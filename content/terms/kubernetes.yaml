- id: k8s.namespace
  en:
    term: namespace
    definition: A named partition of a Kubernetes cluster used to separate teams or applications
      and to scope policies, quotas and access.
  es:
    verdict: both
    forms:
      - text: espacio de nombres
        article: el
        kind: noun
        primary: true
        plural: los espacios de nombres
        usedBy:
          - microsoft
          - google
      - text: namespace
        article: el
        kind: noun
        headline: true
        plural: los namespaces
        note: What engineers say.
    definition: Partición con nombre de un clúster de Kubernetes que separa equipos o aplicaciones
      y delimita políticas, cuotas y accesos.
    examples:
      - es: Cada equipo tiene su propio namespace con cuotas de recursos.
        en: Each team has its own namespace with resource quotas.
    watchOut: 'A namespace separates names, not workloads: on its own it is not a security
      boundary. Linux kernel namespaces, which isolate containers, are a different thing with
      the same name.'
