- id: k8s.network-policy
  en:
    term: NetworkPolicy
    definition: A Kubernetes object that says which pods may talk to which, enforced by the
      network plugin; without one, all pods can reach each other.
  es:
    verdict: both
    forms:
      - text: política de red
        article: la
        kind: noun
        primary: true
        plural: las políticas de red
        usedBy:
          - microsoft
          - google
      - text: NetworkPolicy
        article: la
        kind: noun
        headline: true
      - text: denegar por defecto
        kind: verb
        note: Default deny, the starting policy to aim for.
    definition: Objeto de Kubernetes que indica qué pods pueden comunicarse entre sí y que
      aplica el complemento de red; sin ninguna, todos los pods se ven.
    examples:
      - es: Una política de red impide que el frontal hable directamente con la base de datos.
        en: A network policy stops the front end talking directly to the database.
