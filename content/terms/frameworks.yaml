- id: grc.certification-audit
  en:
    term: certification audit
    definition: 'The two-stage audit by a certification body that leads to a certificate:
      stage 1 reviews documentation, stage 2 checks the system in operation. Surveillance
      audits follow yearly and recertification every three years.'
  es:
    verdict: translated
    forms:
      - text: auditoría de certificación
        article: la
        kind: noun
        primary: true
        usedBy:
          - official
      - text: auditoría de seguimiento
        article: la
        kind: noun
        usedBy:
          - official
        note: A surveillance audit, each year between certifications.
      - text: fase 1
        article: la
        kind: noun
        note: Stage 1; stage 2 is fase 2.
    definition: 'Auditoría en dos fases de una entidad de certificación que conduce al certificado:
      la fase 1 revisa la documentación y la fase 2 comprueba el sistema en funcionamiento.'
    examples:
      - es: Superamos la fase 2 de la auditoría de certificación sin no conformidades mayores.
        en: We passed stage 2 of the certification audit with no major nonconformities.
  topics:
    - assessment
    - grc
  technology: []
  frameworks:
    - ISO-27001
  related:
