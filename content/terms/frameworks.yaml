        article: el
        kind: noun
        primary: true
        usedBy:
          - official
          - eu
      - text: tratamiento de datos personales
        article: el
        kind: noun
        usedBy:
          - official
      - text: tratar
        kind: verb
    definition: 'Cualquier operación realizada con datos personales: recogida, conservación,
      uso, comunicación o supresión.'
    examples:
      - es: Cada tratamiento debe tener una finalidad y una base jurídica.
        en: Every processing operation must have a purpose and a legal basis.
