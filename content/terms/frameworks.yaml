- id: law.lawful-basis
  en:
    term: lawful basis
    definition: One of the six grounds the GDPR accepts for processing personal data, such
      as consent, contract, legal obligation or legitimate interest.
  es:
    verdict: translated
    forms:
      - text: base jurídica
        article: la
        kind: noun
        primary: true
        usedBy:
          - official
          - eu
      - text: base de legitimación
        article: la
        kind: noun
        usedBy:
          - official
        note: The AEPD's usual phrase.
      - text: licitud del tratamiento
        article: la
        kind: noun
        usedBy:
          - official
        note: Lawfulness of processing, the heading of Article 6.
      - text: interés legítimo
        article: el
        kind: noun
        usedBy:
          - official
        note: Legitimate interest, the most argued-over basis.
    definition: Cada uno de los seis fundamentos que el RGPD admite para tratar datos personales,
      como el consentimiento, el contrato, la obligación legal o el interés legítimo.
    examples:
      - es: La base jurídica del tratamiento es la ejecución del contrato.
        en: The lawful basis for the processing is performance of the contract.
  topics:
