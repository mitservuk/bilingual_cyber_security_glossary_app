# Frameworks and laws: ISO/IEC 27001, GDPR and LOPDGDD, NIST CSF, PCI DSS, the AI Act, eIDAS, MAGERIT and the UK's.
# Format is described in content/README.md. These entries were written from
# working knowledge of usage in Spain; each `found` text was then located in a
# page the glossary already cites and confirmed with scripts/check_sources.py.
# Forms with no usedBy have not been seen in a source.

- id: grc.context-of-organization
  en:
    term: context of the organisation
    definition: The internal and external issues, and the needs of interested parties, that
      an organisation must understand before setting the scope of its management system (clause
      4).
  es:
    verdict: translated
    forms:
      - text: contexto de la organización
        article: el
        kind: noun
        primary: true
        usedBy:
          - official
          - microsoft
      - text: cuestiones internas y externas
        article: las
        kind: noun
        note: Internal and external issues.
    definition: Cuestiones internas y externas, y necesidades de las partes interesadas, que
      una organización debe comprender antes de fijar el alcance de su sistema de gestión.
    examples:
      - es: El auditor empezó preguntando por el contexto de la organización.
        en: The auditor began by asking about the context of the organisation.
  topics:
    - grc
  technology: []
  frameworks:
    - ISO-27001
  related:
    - grc.isms
    - grc.stakeholder
    - grc.audit-scope
  sources:
