- id: sec.ssrf
  en:
    term: server-side request forgery
    acronym: SSRF
    definition: >-
      A vulnerability in which an attacker makes a server issue requests to a
      destination of the attacker's choosing, typically to reach internal
      services or a cloud metadata endpoint that are not exposed directly.
  es:
    verdict: both
    acronym: SSRF
    forms:
      - text: server-side request forgery
        usedBy: [official, engineers]
