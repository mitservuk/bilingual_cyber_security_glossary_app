        note: >-
          Used as a bare name, with the expansion left in English: "Security
          Assertion Markup Language (SAML)". Also written with its version:
          "SAML2", "SAML 2.0".
      - text: aserción de SAML
        usedBy: [microsoft]
        article: la
        kind: noun
        plural: las aserciones de SAML
        note: 'A SAML assertion. Paradigma says simply "una aserción".'
      - text: lenguaje de marcado de aserción de seguridad
