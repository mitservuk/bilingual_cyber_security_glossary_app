- id: sec.federated-identity
  en:
    term: federated identity
    definition: >-
      An arrangement in which separate organisations or security domains agree
      to trust each other's authentication, so that an identity issued by one
      identity provider is accepted by the services of another.
  es:
    verdict: translated
    forms:
      - text: identidad federada
        usedBy: [official, engineers, microsoft]
        article: la
        kind: noun
        primary: true
        plural: las identidades federadas
      - text: federación de identidades
        usedBy: [engineers, microsoft, aws]
        article: la
        kind: noun
        note: >-
          Identity federation, the arrangement itself. Job adverts pair it with
          SSO: "single sign-on (SSO) y federación de identidades".
      - text: federar
        usedBy: [engineers]
        kind: verb
        note: 'To federate: "federar usuarios con Amazon Connect".'
    definition: >-
      Modelo en el que varias organizaciones o dominios confían en la
      autenticación de los demás, de modo que la identidad emitida por un
      proveedor de identidad se acepta en los servicios de otro.
    examples:
      - es: Con la identidad federada, los empleados entran en la aplicación con su cuenta corporativa.
        en: With federated identity, employees sign in to the application with their corporate account.
  topics: [iam, authn]
  technology: [identity-platforms]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [sec.idp, sec.sso, sec.saml, sec.iam]
  sources:
    - label: "AEPD, Guía de privacidad desde el diseño"
      url: "https://www.aepd.es/guias/guia-privacidad-desde-diseno.pdf"
