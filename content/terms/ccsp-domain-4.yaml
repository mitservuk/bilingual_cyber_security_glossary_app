- id: sec.abuse-case
  en:
    term: abuse case
    definition: >-
      A scenario, written alongside the use cases, that describes how an
      attacker or a malicious user could deliberately misuse a feature, and
      from which security requirements and tests are derived.
  es:
    verdict: translated
    forms:
      - text: caso de abuso
        article: el
        kind: noun
        primary: true
        plural: los casos de abuso
        note: >-
          Built on "caso de uso" (use case), which is the established term.
          No checked source in Spain uses "caso de abuso" yet, so treat it as
          a working translation.
    definition: >-
      Escenario que describe cómo un atacante podría usar de forma maliciosa
      una función del sistema, y del que se derivan requisitos de seguridad.
    examples:
      - es: Para cada caso de uso escribimos también un caso de abuso.
        en: For each use case we also write an abuse case.
    watchOut: >-
      Outside a design discussion, "un caso de abuso" reads first as a case
      of abuse against a person. Make the software context clear.
  topics: [appsec, threat]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [sec.threat-modelling, tech.functional-requirement, fw.stride, sec.sdlc]
  sources:
