- id: sec.insecure-deserialization
  en:
    term: insecure deserialization
    definition: >-
      A vulnerability in which an application rebuilds objects from untrusted
      serialised data without validating it, which can lead to remote code
      execution, privilege escalation or tampering with application logic.
