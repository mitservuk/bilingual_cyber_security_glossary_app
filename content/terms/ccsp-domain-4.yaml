- id: sec.sbom
  en:
    term: software bill of materials
    acronym: SBOM
    definition: >-
      A formal, machine-readable inventory of the components, libraries and
      dependencies that make up a piece of software, and of how they relate to
      each other. The usual formats are SPDX and CycloneDX.
  es:
    verdict: both
    acronym: SBOM
    forms:
      - text: SBOM
        usedBy: [official, eu, engineers]
        article: el
        kind: noun
        primary: true
        plural: los SBOM
        note: >-
          The English acronym is what INCIBE-CERT and practitioners write: "un
          SBOM", "los SBOM".
      - text: lista de materiales de software
        usedBy: [official, engineers]
        headline: true
        article: la
        kind: noun
        note: The translation given by INCIBE-CERT and by El lado del mal when they expand the acronym.
      - text: nomenclatura de materiales de los programas informáticos
        usedBy: [eu]
        article: la
        kind: noun
        register: formal
        note: >-
          The term defined in the Spanish text of the Cyber Resilience Act, which
          keeps the acronym but makes it feminine: "las SBOM".
    definition: >-
      Inventario formal de los componentes, bibliotecas y dependencias de un
      software y de las relaciones entre ellos.
    examples:
      - es: El proveedor tiene que entregar un SBOM con cada versión.
        en: The supplier has to deliver an SBOM with each release.
    watchOut: >-
      The ENS asks for the same thing without the name: its reinforcement "Lista
      de componentes software" requires "una relación formal de los componentes
      software de terceros".
  topics: [supplychain]
  technology: [ci-cd]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  frameworks: [CRA]
  related: [sec.software-supply-chain, sec.sca, tech.dependency, tech.third-party-software]
  sources:
