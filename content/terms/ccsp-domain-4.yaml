          "explotar un SSRF". INCIBE-CERT's blog also uses the English name.
      - text: falsificación de solicitudes del lado del servidor
        usedBy: [official]
        headline: true
        article: la
        kind: noun
        register: formal
        note: >-
          INCIBE-CERT's wording for the OWASP category. Its vulnerability
          database labels CWE-918 "falsificación de solicitud en servidor"
