- id: sec.secure-coding
  en:
    term: secure coding
    definition: >-
      Writing software according to rules that prevent common classes of
      vulnerability, such as validating input, handling memory and errors
      safely and keeping secrets out of the code.
  es:
    verdict: translated
    forms:
      - text: programación segura
        usedBy: [official, engineers, microsoft]
        article: la
        kind: noun
        primary: true
        note: >-
          The wording of the ENS, which asks for "normas de programación
          segura" as part of a secure development method (mp.sw.1).
      - text: desarrollo seguro
        usedBy: [official, eu, engineers]
        article: el
        kind: noun
        note: >-
          Secure development, the wider label for the whole lifecycle and not
          only the code: "metodología de desarrollo seguro", "buenas prácticas
          de desarrollo seguro".
      - text: codificación segura
        usedBy: [microsoft, aws]
        article: la
        kind: noun
        note: >-
          The literal translation, found in Microsoft's and AWS's Spanish
          documentation.
    definition: >-
      Forma de escribir el código siguiendo normas que evitan las
      vulnerabilidades más habituales.
    examples:
      - es: Todos los desarrolladores reciben formación en programación segura.
        en: All developers receive training in secure coding.
    watchOut: >-
      Codificación also means encoding: Microsoft itself describes
      encryption as "la codificación segura de los datos". Programación
      avoids the ambiguity.
  topics: [appsec]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [sec.sdlc, sec.code-review, sec.sast, sec.secure-by-design]
  sources:
    - label: "Esquema Nacional de Seguridad (RD 311/2022), medida mp.sw.1"
