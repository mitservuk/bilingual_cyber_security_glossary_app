- id: sec.white-box-testing
  en:
    term: white-box testing
    definition: >-
      Testing with full knowledge of the system's internals (source code,
      architecture, configuration and often credentials), so that logic paths
      and code-level flaws can be examined directly.
  es:
    verdict: translated
    forms:
      - text: pruebas de caja blanca
        usedBy: [official, engineers]
        article: las
        kind: noun
