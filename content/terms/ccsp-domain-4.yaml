- id: fw.stride
  en:
    term: STRIDE
    expansion: >-
      Spoofing, Tampering, Repudiation, Information disclosure, Denial of
      service, Elevation of privilege
    definition: >-
      A threat-classification model from Microsoft that sorts threats into six
      categories, each the violation of one security property. It is normally
      applied element by element to a data flow diagram during threat
      modelling.
  es:
    verdict: english-kept
    forms:
      - text: STRIDE
        usedBy: [engineers, microsoft, aws]
        kind: noun
        primary: true
        note: >-
          Kept as a name after another noun, as in "el modelo STRIDE" or "las
          categorías STRIDE". Microsoft's Spanish pages give the six
          categories as suplantación, manipulación, rechazo, divulgación de
          información, denegación de servicio and elevación de privilegios.
    definition: >-
      Modelo de Microsoft que clasifica las amenazas de un sistema en seis
      categorías y que se usa en el modelado de amenazas.
    examples:
      - es: Usamos STRIDE para clasificar las amenazas de cada componente.
        en: We use STRIDE to classify the threats to each component.
    watchOut: >-
      The R, repudiation, is "rechazo" in Microsoft's Spanish pages and
      "repudio" in AWS's.
  topics: [threat, appsec]
  technology: []
  curriculum:
