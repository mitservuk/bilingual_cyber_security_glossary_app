- id: tech.pipeline
  en:
    term: pipeline
    definition: >-
      An automated sequence of stages (build, test, security scanning,
      deployment) that every code change passes through on its way to
      production.
  es:
    verdict: both
    forms:
      - text: pipeline
        usedBy: [engineers, microsoft]
        article: el
        kind: noun
        primary: true
        plural: los pipelines
        note: >-
          The English word, masculine, is what engineering blogs and job
          adverts write: "un pipeline de Jenkins", "pipelines CI/CD".
          Microsoft's documentation uses it now and then.
      - text: canalización
        usedBy: [microsoft, aws]
        headline: true
        article: la
        kind: noun
        plural: las canalizaciones
        note: >-
          The translation in Microsoft's and AWS's Spanish documentation:
          "canalizaciones de CI/CD".
      - text: flujo de procesamiento
        usedBy: [google]
        article: el
        kind: noun
        note: >-
          Google Cloud's wording on its pages for Spain: "flujos de
          procesamiento de CI/CD".
    definition: >-
      Secuencia automatizada de pasos (compilación, pruebas, análisis de
      seguridad y despliegue) por la que pasa cada cambio de código.
    examples:
      - es: El pipeline ha fallado en la fase de pruebas.
        en: The pipeline has failed at the test stage.
    watchOut: >-
      Each vendor translates it differently, while engineers keep the English
      word. Say pipeline; recognise the others when you read them.
  topics: [appsec]
  technology: [ci-cd]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [tech.ci-cd, tech.devops, sec.sast, tech.iac]
  sources:
