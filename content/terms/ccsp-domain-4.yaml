- id: sec.sso
  en:
    term: single sign-on
    acronym: SSO
    definition: >-
      Authenticating once with an identity provider and then reaching several
      independent applications without signing in again to each one.
  es:
    verdict: both
    acronym: SSO
    forms:
      - text: inicio de sesión único
        usedBy: [official, google, microsoft, aws]
        article: el
        kind: noun
        primary: true
        note: 'The Spanish term in INCIBE-CERT''s posts and vendor documentation, normally followed by "(SSO)".'
      - text: SSO
        usedBy: [official, engineers, microsoft, aws]
        headline: true
        article: el
        kind: noun
        note: 'The acronym is the everyday name. Job adverts list it bare: "SSO y MFA".'
      - text: single sign-on
        usedBy: [official, engineers]
        article: el
        kind: noun
        note: >-
          The English term written out. INCIBE's product taxonomy has a category
          called "Herramientas Single Sign-On".
    say: Said letter by letter, "ese-ese-o".
    definition: >-
      Mecanismo que permite autenticarse una sola vez y acceder después a varias
      aplicaciones sin volver a iniciar sesión en cada una.
    examples:
      - es: Con el inicio de sesión único, entras una vez y accedes a todas las aplicaciones.
        en: With single sign-on, you sign in once and get into all the applications.
