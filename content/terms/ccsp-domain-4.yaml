      url: "https://www.paradigmadigital.com/dev/diseno-soluciones-arquitectura-la-arquitectura-funcional/"
      found: ["identificar los casos de uso"]
      checked: 2026-11-14
  status: draft

- id: tech.qa
  en:
    term: quality assurance
    acronym: QA
    definition: >-
      The planned activities (reviews, testing, process checks) that give
      confidence a product meets its requirements before release; in software
      teams, also the name of the testing role or team.
  es:
    verdict: both
    acronym: QA
    forms:
      - text: QA
        usedBy: [engineers]
        article: el
        kind: noun
        primary: true
        note: >-
          The English acronym names both the activity and the people who do
          it: "el equipo de QA", "los de QA", and "el QA" for the person in
          that role. A tester is "un tester".
      - text: aseguramiento de la calidad
        usedBy: [eu, engineers]
        headline: true
        article: el
        kind: noun
        note: >-
          The expansion in engineering blogs and job adverts, and in the
          Spanish text of the EU AI Act.
      - text: garantía de calidad
        usedBy: [official, engineers]
        article: la
        kind: noun
        note: >-
          The other translation: "actividades de garantía de calidad del
          software" in a public-sector IT exam syllabus published in the BOE.
    definition: >-
      Conjunto de actividades planificadas (revisiones, pruebas, controles)
      que dan confianza en que un producto cumple sus requisitos.
    examples:
      - es: El equipo de QA valida cada versión antes de pasarla a producción.
        en: The QA team validates each release before it goes to production.
    watchOut: >-
