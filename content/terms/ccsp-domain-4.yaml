- id: sec.code-review
  en:
    term: code review
    definition: >-
      Examination of source code by someone other than its author, by hand or
      with tool support, to find defects and security weaknesses before the
      change is merged.
  es:
    verdict: both
    forms:
      - text: revisión de código
        usedBy: [engineers, microsoft, aws]
        article: la
        kind: noun
        primary: true
        plural: las revisiones de código
      - text: code review
        usedBy: [engineers]
        headline: true
        article: la
        kind: noun
        plural: las code reviews
        note: >-
          The English term is common among developers. Its gender varies:
          Paradigma writes "las code reviews", Adictos al Trabajo "el code
          review".
      - text: auditoría de código
        usedBy: [official, engineers]
        article: la
        kind: noun
        note: >-
          A formal security review of the code. In the ENS it is a
          reinforcement of measure mp.sw.2, headed "inspección de código
          fuente": "se realizará una auditoría de código fuente".
    definition: >-
      Examen del código fuente por parte de otra persona, o con herramientas,
      para encontrar errores y fallos de seguridad antes de integrarlo.
    examples:
      - es: Ningún cambio llega a producción sin una revisión de código.
        en: No change reaches production without a code review.
  topics: [appsec, assessment]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [sec.secure-coding, sec.sast, tech.version-control, sec.white-box-testing]
  sources:
    - label: "Telefónica Tech, blog"
      url: "https://telefonicatech.com/blog/ssdlc-la-clave-para-un-software-blindado"
      found: ["revisiones de código: revisiones humanas"]
