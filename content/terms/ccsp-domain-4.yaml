      together in one team or shared process, relying on automation and
      continuous delivery to release changes quickly and reliably.
  es:
    verdict: english-kept
    forms:
      - text: DevOps
        usedBy: [engineers, google, microsoft, aws]
        kind: noun
        primary: true
        note: >-
          Kept in English and normally written without an article, after a
          noun or a preposition: "una cultura DevOps", "prácticas de DevOps".
          It also names the job: "el perfil DevOps".
