- id: sec.black-box-testing
  en:
    term: black-box testing
    definition: >-
      Testing a system from the outside with no knowledge of its source code,
      design or credentials, judging it only by how it responds to inputs, as
      an external attacker or end user would.
  es:
    verdict: translated
    forms:
      - text: pruebas de caja negra
        usedBy: [official, engineers]
        article: las
        kind: noun
        primary: true
        note: >-
          The same label attaches to audits and pentests: El Lado del Mal
          writes "auditoría de caja negra", and the ENS speaks of "auditorías
          continuas de seguridad de «caja negra»" for web applications
          (mp.s.2). The halfway case is "de caja gris".
    definition: >-
      Pruebas que se hacen desde fuera, sin conocer el código ni el diseño
      interno del sistema.
    examples:
      - es: En las pruebas de caja negra el auditor no tiene acceso al código fuente.
        en: In black-box testing the auditor has no access to the source code.
