- id: sec.csrf
  en:
    term: cross-site request forgery
    acronym: CSRF
    definition: >-
      An attack that causes a victim's browser to send an unwanted request to
      a site where the victim is already authenticated, so the site carries
      out an action the user did not intend.
  es:
    verdict: both
    acronym: CSRF
    forms:
      - text: cross-site request forgery
        usedBy: [engineers]
        article: el
        kind: noun
        primary: true
        note: >-
          Engineers write the English name or just the acronym, as in "un
          ataque CSRF" and "un token anti-CSRF".
      - text: falsificación de petición en sitios cruzados
        usedBy: [official]
        headline: true
        article: la
        kind: noun
        register: formal
        note: >-
          The translation in INCIBE's glossary, which lists the term under
          CSRF. Adictos al Trabajo writes it in the plural, "falsificación de
          peticiones en sitios cruzados".
      - text: falsificación de solicitud entre sitios
        usedBy: [microsoft]
        article: la
        kind: noun
        note: Microsoft's wording.
    definition: >-
      Ataque que hace que el navegador de un usuario autenticado envíe a un
      sitio web una petición que el usuario no quería hacer.
    examples:
      - es: Cada formulario lleva un token para evitar ataques de cross-site request forgery (CSRF).
        en: Every form carries a token to prevent cross-site request forgery (CSRF) attacks.
    watchOut: >-
      "Request" is petición in INCIBE's translation and solicitud in
      Microsoft's. Both are used for an HTTP request.
