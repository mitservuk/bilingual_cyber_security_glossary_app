- id: fw.dread
  en:
    term: DREAD
    expansion: >-
      Damage, Reproducibility, Exploitability, Affected users, Discoverability
    definition: >-
      A threat-rating scheme, originally from Microsoft, that scores each
      threat on five criteria and averages them to rank threats for
      mitigation. It is often paired with STRIDE and is widely criticised as
      subjective.
  es:
    verdict: english-kept
    forms:
      - text: DREAD
        usedBy: [microsoft]
        kind: noun
