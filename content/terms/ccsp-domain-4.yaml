- id: sec.idp
  en:
    term: identity provider
    acronym: IdP
    definition: >-
      The system that authenticates users and issues the assertions or tokens
      about their identity on which other applications (service providers or
      relying parties) rely.
  es:
    verdict: both
    acronym: IdP
    forms:
      - text: proveedor de identidad
        usedBy: [official, engineers]
        article: el
        kind: noun
        primary: true
        plural: los proveedores de identidad
        note: The singular "identidad" is what INCIBE-CERT, Paradigma and Telefónica Tech write.
      - text: proveedor de identidades
        usedBy: [microsoft, aws]
        article: el
        kind: noun
        note: >-
          Microsoft and AWS put identity in the plural. The other side of the
          exchange is "el proveedor de servicios (SP)".
      - text: IdP
        usedBy: [official, engineers, microsoft]
        headline: true
        article: el
        kind: noun
        plural: los IdP
        note: 'The English acronym is kept: "el IdP", "un IdP de confianza".'
    say: IdP is said letter by letter, "i-de-pe".
    definition: >-
      Sistema que autentica a los usuarios y emite las aserciones o los tokens
      sobre su identidad en los que confían otras aplicaciones.
    examples:
      - es: La aplicación delega la autenticación en el proveedor de identidad de la empresa.
        en: The application delegates authentication to the company's identity provider.
