- id: tech.agile
  en:
    term: agile
    definition: >-
      An iterative approach to software development that delivers working
      increments in short cycles, takes feedback continuously and adapts the
      plan as requirements change.
  es:
    verdict: both
    forms:
      - text: metodologías ágiles
        usedBy: [engineers]
        article: las
        kind: noun
        primary: true
        note: >-
          The usual Spanish wording, normally in the plural. The adjective is
          ágil (plural ágiles): "desarrollo ágil de software".
      - text: agile
        usedBy: [engineers]
        headline: true
        kind: noun
        note: >-
          The English word, used after a noun ("un equipo agile") and on its
          own with no article ("cambiar a agile").
      - text: agilismo
        usedBy: [engineers]
        article: el
        kind: noun
        note: >-
          The agile movement as a whole: "el agilismo se ha extendido".
    definition: >-
      Forma de desarrollar software en ciclos cortos, entregando partes que
      funcionan y adaptando el plan a los cambios.
    examples:
      - es: El equipo trabaja con metodologías ágiles desde hace dos años.
        en: The team has been working with agile methods for two years.
  topics: [appsec]
  technology: []
  curriculum:
