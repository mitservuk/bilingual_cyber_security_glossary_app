- id: sec.fuzzing
  en:
    term: fuzzing
    definition: >-
      Feeding a program, protocol or API large volumes of random, malformed
      or unexpected input and watching for crashes or other abnormal
      behaviour that reveals exploitable defects.
  es:
    verdict: english-kept
    forms:
      - text: fuzzing
        usedBy: [official, engineers]
        article: el
        kind: noun
        primary: true
        note: >-
          Kept in English: "técnicas de fuzzing", "hacer fuzzing". The tool is
          "un fuzzer". INCIBE-CERT defines it as a set of "pruebas de caja
          negra".
    definition: >-
      Técnica de pruebas que envía a un programa datos aleatorios, inválidos
      o malformados para provocar fallos y descubrir vulnerabilidades.
    examples:
      - es: Encontramos el fallo haciendo fuzzing sobre la API.
        en: We found the bug by fuzzing the API.
