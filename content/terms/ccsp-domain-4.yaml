- id: sec.dam
  en:
    term: database activity monitoring
    acronym: DAM
    definition: >-
      Tooling that captures and analyses database activity (queries, logins,
      privilege use and schema changes) independently of the database's own
      logs, to detect misuse and support audit.
  es:
    verdict: translated
    acronym: DAM
    forms:
      - text: monitorización de la actividad de bases de datos
        article: la
        kind: noun
        primary: true
        note: >-
          Built on monitorización, the word INCIBE uses for monitoring tools. No
          Spanish public-body or engineering source using the full phrase was
          found.
      - text: supervisión de la actividad de las bases de datos
        usedBy: [oracle]
        article: la
        kind: noun
        note: Oracle's wording on its pages for Spain.
    definition: >-
      Herramientas que registran y analizan la actividad de las bases de datos
      (consultas, accesos, uso de privilegios) para detectar usos indebidos y
      facilitar la auditoría.
    examples:
      - es: La monitorización de la actividad de bases de datos detectó una consulta anómala.
        en: Database activity monitoring detected an anomalous query.
    watchOut: >-
      In Spain the verb is monitorizar and the noun monitorización. Monitorear and
      monitoreo are Latin American, yet they turn up on vendor pages served to
      Spain: Oracle's says "monitorea la actividad de las bases de datos".
  topics: [data, detection]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [sec.log, sec.auditability, sec.sql-injection, sec.dlp]
  sources:
