- id: sec.xss
  en:
    term: cross-site scripting
    acronym: XSS
    definition: >-
      A vulnerability in which a web application includes untrusted input in
      a page without proper encoding, so that an attacker's script runs in the
      victim's browser in the context of the site. It may be stored,
      reflected or DOM-based.
  es:
    verdict: both
    acronym: XSS
    forms:
      - text: cross-site scripting
        usedBy: [official, engineers]
        article: el
        kind: noun
        primary: true
        note: >-
          Engineers write the English name or just the acronym, as in
          "ataques XSS".
      - text: secuencias de comandos en sitios cruzados
        usedBy: [official]
        headline: true
        article: las
        kind: noun
        register: formal
        note: >-
          The translation in INCIBE's glossary, which lists the term under
          XSS.
      - text: scripting entre sitios
        usedBy: [microsoft, aws]
        article: el
        kind: noun
        note: >-
          The vendors' wording. AWS's documentation also writes "secuencias
          de comandos entre sitios".
    definition: >-
      Vulnerabilidad web que permite a un atacante ejecutar su propio código
      en el navegador de otros usuarios de un sitio.
    examples:
      - es: La auditoría ha encontrado un fallo de cross-site scripting (XSS) en el buscador.
        en: The audit has found a cross-site scripting (XSS) flaw in the search box.
    watchOut: >-
      INCIBE, Microsoft and AWS each translate the name differently, so the
      acronym XSS is the safe choice.
