- id: tech.iac
  en:
    term: infrastructure as code
    acronym: IaC
    definition: >-
      Defining and provisioning infrastructure (networks, servers, policies)
      through version-controlled, machine-readable files instead of manual
      configuration, so that environments are repeatable and changes can be
      reviewed and tested.
  es:
    verdict: both
    acronym: IaC
    forms:
      - text: infraestructura como código
        usedBy: [engineers, google, microsoft, aws]
        article: la
        kind: noun
        primary: true
        note: >-
          The translation is in general use, often with the English in
          brackets: "infraestructura como código, o Infrastructure as Code
          (IaC)".
      - text: IaC
        usedBy: [engineers, microsoft, aws]
        headline: true
        article: la
        kind: noun
        note: >-
          The English acronym, feminine like "la infraestructura": "en qué
          consiste la IaC".
    definition: >-
      Definición y despliegue de la infraestructura mediante ficheros de
      código versionados, en lugar de configurarla a mano.
    examples:
      - es: Toda la red se despliega con infraestructura como código.
        en: The whole network is deployed with infrastructure as code.
  topics: [architecture]
  technology: [iac]
  curriculum:
