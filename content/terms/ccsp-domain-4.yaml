- id: tech.dependency
  en:
    term: dependency
    definition: >-
      An external package, library or service that a piece of software needs in
      order to build or run. Dependencies bring their own (transitive)
      dependencies, which is where much supply-chain risk hides.
  es:
    verdict: translated
    forms:
      - text: dependencia
        usedBy: [official, engineers, aws]
        article: la
        kind: noun
        primary: true
        plural: las dependencias
        note: >-
          The dependency tree is "el árbol de dependencias"; a package manager is
          "un gestor de paquetes" or "un gestor de dependencias".
    definition: >-
      Paquete, biblioteca o servicio externo que un software necesita para
      compilarse o ejecutarse.
    examples:
      - es: Esta dependencia tiene una vulnerabilidad crítica y hay que actualizarla.
        en: This dependency has a critical vulnerability and needs updating.
    watchOut: >-
      Dependencia also means reliance in general. The Cyber Resilience Act's
      "dependencias críticas" are critical reliances on products and suppliers,
      not code packages.
  topics: [supplychain, appsec]
  technology: [ci-cd]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [tech.third-party-software, sec.sbom, sec.sca, sec.software-supply-chain]
