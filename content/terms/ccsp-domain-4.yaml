- id: tech.waterfall
  en:
    term: waterfall
    definition: >-
      A sequential development model in which each phase (requirements,
      design, build, test, release) is completed before the next begins, with
      little room to revisit earlier decisions.
  es:
    verdict: both
    forms:
      - text: en cascada
        usedBy: [engineers]
        kind: adjective
        primary: true
        note: >-
          Follows a noun: "el desarrollo en cascada", "el ciclo de vida en
          cascada", "fases en cascada". AWS's Spanish pages say "el modelo de
          cascada".
      - text: waterfall
        usedBy: [engineers]
        headline: true
        article: el
        kind: noun
        note: >-
          The English word, used after a noun ("una metodología waterfall") or
          on its own, with or without the article ("nacieron con waterfall",
          "el waterfall de siempre"). Adictos al Trabajo gives the two
          together: "en cascada o waterfall".
    definition: >-
      Modelo de desarrollo secuencial en el que cada fase se termina antes de
      empezar la siguiente.
    examples:
      - es: El proyecto antiguo se hizo con un modelo en cascada.
        en: The old project was done with a waterfall model.
  topics: [appsec]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [tech.agile, sec.sdlc, tech.functional-requirement]
  sources:
    - label: "Adictos al Trabajo (Autentia)"
      url: "https://www.adictosaltrabajo.com/2019/12/18/testing-en-un-mundo-agile/"
      found: ["el ciclo de vida en cascada o waterfall", "el waterfall de siempre"]
      checked: 2026-11-14
    - label: "Adictos al Trabajo (Autentia)"
      url: "https://www.adictosaltrabajo.com/2012/03/21/agil-grandes-organizaciones/"
      found: ["el desarrollo en cascada"]
      checked: 2026-11-14
    - label: "Telefónica Tech, blog"
      url: "https://telefonicatech.com/blog/como-transformar-una-compania-xiii-metodologia-agile-de-ejecucion-de-proyectos"
      found: ["fases en cascada"]
