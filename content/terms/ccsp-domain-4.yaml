- id: sec.software-supply-chain
  en:
    term: software supply chain
    definition: >-
      Everything that goes into building and delivering software: source code,
      third-party and open-source components, build tools, pipelines, registries
      and the people and suppliers behind them. Compromising any link can
      compromise every downstream consumer.
  es:
    verdict: translated
    forms:
      - text: cadena de suministro de software
        usedBy: [official, google, microsoft]
        article: la
        kind: noun
        primary: true
        note: >-
          INCIBE writes both "de software" and "del software" in the same guide.
      - text: cadena de suministro
        usedBy: [official, eu, engineers]
        article: la
        kind: noun
        note: >-
          The short form, once the context is clear. It is the wording of the ENS
          measure op.ext.3 and of NIS 2. A supply chain attack is "un ataque a la
          cadena de suministro".
    definition: >-
      Conjunto de código, componentes de terceros, herramientas y proveedores que
      intervienen en la construcción y la entrega de un software.
    examples:
      - es: Tenemos que proteger la cadena de suministro de software desde el primer commit.
        en: We need to protect the software supply chain from the first commit.
  topics: [supplychain]
  technology: [ci-cd]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  frameworks: [SLSA]
  related: [sec.sbom, tech.dependency, tech.third-party-software, sec.sca]
  sources:
