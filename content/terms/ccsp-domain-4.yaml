- id: sec.oauth
  en:
    term: OAuth
    expansion: Open Authorization
    definition: >-
      An open standard for delegated authorisation. A resource owner lets a
      client application obtain a scoped, time-limited access token from an
      authorisation server instead of handing over credentials. The current
      version is OAuth 2.0.
  es:
    verdict: english-kept
    forms:
      - text: OAuth
        usedBy: [official, engineers, microsoft]
        kind: noun
        primary: true
        note: >-
          Used as a bare name and described as a protocol, a standard or a
          framework: "OAuth es un framework de autorización". Adverts and
          INCIBE-CERT write the version without a space, "OAuth2".
      - text: token de acceso
        usedBy: [official, engineers, microsoft]
        article: el
        kind: noun
        plural: los tokens de acceso
        note: 'The access token. Paradigma also leaves it in English: "los access token".'
      - text: servidor de autorización
        usedBy: [official, engineers, microsoft]
        article: el
        kind: noun
        note: The authorisation server.
      - text: scope
        usedBy: [engineers]
        article: el
        kind: noun
        plural: los scopes
        note: 'Engineers keep the English word. Microsoft translates it: "ámbitos".'
    definition: >-
      Estándar abierto de autorización delegada, con el que una aplicación obtiene
      un token de acceso limitado sin conocer las credenciales del usuario.
    examples:
      - es: La API solo acepta peticiones con un token de acceso válido de OAuth 2.0.
        en: The API only accepts requests with a valid OAuth 2.0 access token.
    watchOut: >-
      OAuth is about autorización, not autenticación. The two words are as easy
      to mix up in Spanish as in English, and Microsoft's page spells it out:
      "Open Authorization (no de Open Authentication)".
  topics: [authz, iam]
  technology: [identity-platforms]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [sec.openid-connect, sec.authorization, sec.api, sec.idp]
  sources:
    - label: "INCIBE-CERT, blog"
      url: "https://www.incibe.es/incibe-cert/blog/seguridad-en-arquitectura-de-microservicios"
      found: ["OAuth2 introduce un servidor de autorización central", "que emite tokens de acceso", "desde el token de acceso"]
      checked: 2026-11-14
    - label: "Paradigma Digital, blog"
      url: "https://www.paradigmadigital.com/dev/oauth-2-0-equilibrio-y-usabilidad-en-la-securizacion-de-apis/"
      found: ["OAuth es un framework de autorización", "el token de acceso", "el servidor de autorización", "Los access token", "Los scopes son una lista"]
      checked: 2026-11-14
    - label: "Tecnoempleo, oferta de empleo en España"
      url: "https://www.tecnoempleo.com/arquitecto-it-autenticacion-hibrido/oauth2-openid-saml-jwt-ciberseguridad-/rf-107e16f472754307354c"
      found: ["gestión de protocolos OAuth2"]
      checked: 2026-11-14
