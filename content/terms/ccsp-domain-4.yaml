- id: cloud.application-virtualization
  en:
    term: application virtualization
    definition: >-
      Packaging an application so that it runs isolated from the underlying
      operating system, typically streamed or delivered from a central server
      instead of being installed on each device.
  es:
    verdict: translated
    forms:
      - text: virtualización de aplicaciones
        usedBy: [official, microsoft, aws]
        article: la
        kind: noun
        primary: true
        note: >-
          INCIBE lists it next to "virtualización de escritorio" (desktop
          virtualisation).
    definition: >-
      Técnica que permite ejecutar una aplicación aislada del sistema operativo
      del equipo, normalmente servida desde un servidor central en lugar de
      instalada en cada dispositivo.
    examples:
      - es: Con la virtualización de aplicaciones no hace falta instalar el programa en cada portátil.
        en: With application virtualization there is no need to install the program on every laptop.
