- id: tech.ci-cd
  en:
    term: continuous integration and delivery
    acronym: CI/CD
    definition: >-
      The practice of merging code changes frequently into a shared branch,
      where each one is built and tested automatically (CI), and of keeping
      every validated build ready to release, or releasing it automatically
      (CD).
  es:
    verdict: both
    acronym: CI/CD
    forms:
      - text: CI/CD
        usedBy: [engineers, microsoft, aws]
        article: el
        kind: noun
        primary: true
        note: >-
          The English acronym is the working term, usually after a noun or a
          preposition ("un pipeline de CI/CD", "técnicas de CI/CD") and
          masculine when it takes an article: "el código que llegue al
          CI/CD".
      - text: integración continua y entrega continua
        usedBy: [microsoft]
        headline: true
        article: la
        kind: noun
        note: >-
          The expansion as Microsoft writes it. AWS and Google shorten it to
          "integración y entrega continuas".
      - text: despliegue continuo
        usedBy: [engineers]
        article: el
        kind: noun
        note: >-
          Continuous deployment, the other reading of CD. Engineers say
          despliegue; Microsoft's documentation says "implementación
          continua".
    definition: >-
      Práctica de integrar los cambios de código con frecuencia, probarlos de
      forma automática y dejarlos listos para publicar.
    examples:
      - es: El pipeline de CI/CD ejecuta las pruebas en cada cambio de código.
        en: The CI/CD pipeline runs the tests on every code change.
  topics: [appsec]
  technology: [ci-cd]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [tech.pipeline, tech.devops, tech.devsecops, tech.version-control]
  sources:
