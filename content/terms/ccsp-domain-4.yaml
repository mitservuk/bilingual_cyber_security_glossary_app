- id: sec.api-gateway
  en:
    term: API gateway
    definition: >-
      A single entry point placed in front of a set of APIs or microservices that
      routes requests and centralises cross-cutting controls such as
      authentication, authorisation, rate limiting, TLS termination and logging.
  es:
    verdict: both
    forms:
      - text: API gateway
        usedBy: [official, engineers]
        article: el
        kind: noun
        primary: true
        note: >-
          Engineers keep the English, and make it masculine even though API on its
          own is feminine: "el API Gateway", "un API Gateway".
      - text: puerta de enlace de API
        usedBy: [microsoft, oracle]
        headline: true
        article: la
        kind: noun
        note: >-
          The vendors' translation. "Puerta de enlace" is the standard Spanish for
          a network gateway and has its own entry in INCIBE's glossary.
      - text: pasarela de API
        usedBy: [microsoft]
        article: la
        kind: noun
        note: A second translation, found alongside the first in Microsoft's documentation.
    definition: >-
      Punto de entrada único que se sitúa delante de un conjunto de API o
      microservicios para enrutar las peticiones y centralizar controles como la
      autenticación o la limitación de peticiones.
    examples:
      - es: El API gateway valida el token antes de pasar la petición al microservicio.
        en: The API gateway validates the token before passing the request to the microservice.
  topics: [appsec, architecture]
  technology: [networking]
  curriculum:
