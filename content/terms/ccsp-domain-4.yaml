- id: sec.waf
  en:
    term: web application firewall
    acronym: WAF
    definition: >-
      A layer-7 control placed in front of web applications and APIs that
      inspects HTTP traffic and blocks attacks such as injection and cross-site
      scripting, using signatures, rules and behavioural models.
  es:
    verdict: both
    acronym: WAF
    forms:
      - text: WAF
        usedBy: [official, engineers, google, microsoft]
        article: el
        kind: noun
        primary: true
        plural: los WAF
        note: >-
          The acronym is the everyday name: "un WAF". INCIBE-CERT and a 2026 royal
          decree both gloss it in English, "WAF (Web Application Firewall)".
      - text: cortafuegos de aplicaciones web
        usedBy: [official, google]
        headline: true
        article: el
        kind: noun
        plural: los cortafuegos de aplicaciones web
        note: The expansion in INCIBE's guidance for businesses and on Google's pages for Spain.
      - text: firewall de aplicaciones web
        usedBy: [engineers, microsoft, aws]
        article: el
        kind: noun
        note: The expansion used by Telefónica Tech, Microsoft and AWS.
    say: Said as a word, "uaf".
    definition: >-
      Control de capa 7 que se coloca delante de las aplicaciones web y las API
      para inspeccionar el tráfico HTTP y bloquear ataques.
    examples:
      - es: Hemos puesto un WAF delante de la aplicación para bloquear las inyecciones SQL.
        en: We have put a WAF in front of the application to block SQL injection.
  topics: [appsec, network]
  technology: [networking]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [sec.firewall, sec.api-gateway, sec.sql-injection, fw.owasp-top-10]
