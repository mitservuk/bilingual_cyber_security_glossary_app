- id: sec.buffer-overflow
  en:
    term: buffer overflow
    definition: >-
      A memory-safety flaw in which a program writes more data to a buffer
      than it can hold, overwriting adjacent memory. An attacker can use it
      to crash the program or to execute arbitrary code.
  es:
    verdict: both
    forms:
      - text: desbordamiento de búfer
        usedBy: [official, microsoft]
        article: el
        kind: noun
        primary: true
        plural: los desbordamientos de búfer
        note: >-
          The headword in INCIBE's glossary and the wording of INCIBE-CERT's
          security advisories.
      - text: buffer overflow
        usedBy: [official, engineers]
        headline: true
        article: el
        kind: noun
        note: >-
          INCIBE's glossary gives the English name as a synonym, and El Lado
          del Mal uses it as it stands.
    definition: >-
      Fallo de programación por el que un programa escribe en un búfer más
      datos de los que caben y sobrescribe la memoria contigua.
    examples:
      - es: El parche corrige un desbordamiento de búfer en el servidor web.
        en: The patch fixes a buffer overflow in the web server.
    watchOut: >-
      The Spanish spelling is búfer, with an accent and one f. Engineers
      often keep the English spelling, as in "desbordamiento de buffer" on El
      Lado del Mal.
  topics: [appsec, vulnmgmt]
  technology: []
  curriculum:
