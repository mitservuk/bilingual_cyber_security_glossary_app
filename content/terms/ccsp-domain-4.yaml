- id: sec.openid-connect
  en:
    term: OpenID Connect
    acronym: OIDC
    definition: >-
      An identity layer on top of OAuth 2.0 that adds authentication. The
      identity provider issues a signed ID token describing the user and how
      they were authenticated, alongside the OAuth access token.
  es:
    verdict: english-kept
    acronym: OIDC
    forms:
      - text: OpenID Connect
        usedBy: [official, engineers, microsoft]
        kind: noun
        primary: true
        note: 'Used as a bare name: "OpenID Connect es un protocolo de autenticación".'
      - text: OIDC
        usedBy: [official, engineers, microsoft]
        kind: noun
        note: 'The acronym, used the same way: "en el caso de OIDC".'
      - text: ID token
        usedBy: [official]
        article: el
        kind: noun
        note: INCIBE-CERT leaves the token's name in English.
      - text: token de identificador
        usedBy: [microsoft]
        article: el
        kind: noun
        note: >-
          Microsoft's translation of ID token in its developer documentation. Its
          security pages also say "token de identidad" and "token de
          identificación".
    definition: >-
      Capa de identidad sobre OAuth 2.0 que añade la autenticación del usuario
      mediante un ID token firmado.
    examples:
      - es: Usamos OpenID Connect para autenticar a los usuarios en la aplicación web.
        en: We use OpenID Connect to authenticate users in the web application.
    watchOut: >-
      Microsoft's Spanish pages call the relying party "el usuario de confianza",
      which reads like "the trusted user". It means the application that relies
      on the identity provider, not a person.
  topics: [authn, iam]
  technology: [identity-platforms]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [sec.oauth, sec.idp, sec.sso, sec.authentication]
  sources:
    - label: "INCIBE-CERT, blog"
      url: "https://www.incibe.es/incibe-cert/blog/seguridad-en-arquitectura-de-microservicios"
      found: ["OpenID Connect (OIDC) añade un mecanismo para autenticar a los usuarios", "mediante un ID token", "OIDC proporciona un modelo estándar"]
      checked: 2026-11-14
    - label: "Paradigma Digital, blog"
      url: "https://www.paradigmadigital.com/dev/oauth-2-0-equilibrio-y-usabilidad-en-la-securizacion-de-apis/"
      found: ["OpenID Connect es un protocolo de autenticación de usuarios"]
      checked: 2026-11-14
    - label: "Paradigma Digital, blog"
      url: "https://www.paradigmadigital.com/dev/administracion-centralizada-grupos-usuarios-keycloak-azuread/"
      found: ["En el caso de OIDC"]
      checked: 2026-11-14
    - label: "Microsoft Learn, es-ES"
