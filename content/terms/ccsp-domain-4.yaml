- id: sec.xml-firewall
  en:
    term: XML firewall
    definition: >-
      An application-layer gateway that validates, filters and transforms XML and
      SOAP messages, enforcing schema checks, message-level security and
      protection against XML-based attacks before requests reach a web service.
  es:
    verdict: both
    forms:
      - text: firewall XML
        article: el
        kind: noun
        primary: true
        note: >-
          Not found in any of the Spanish sources checked. The term is rare
          today; this form follows the pattern of "firewall de aplicaciones web",
          with the qualifier after the noun.
      - text: cortafuegos XML
        article: el
        kind: noun
        register: formal
        plural: los cortafuegos XML
        note: >-
          The same compound built on cortafuegos, the word INCIBE's glossary
          gives for firewall. Also without a source of its own.
    definition: >-
      Pasarela de capa de aplicación que valida y filtra los mensajes XML y SOAP
      antes de que lleguen a un servicio web.
    examples:
      - es: El firewall XML rechaza los mensajes SOAP que no cumplen el esquema.
        en: The XML firewall rejects SOAP messages that do not comply with the schema.
  topics: [appsec, network]
  technology: [networking]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [sec.waf, sec.api-gateway, sec.firewall, sec.api]
  sources:
    - label: "INCIBE, Glosario de términos de ciberseguridad (2021)"
      url: "https://www.incibe.es/sites/default/files/contenidos/guias/doc/guia_glosario_ciberseguridad_2021.pdf"
      found: ["Cortafuegos", "Sinónimo: Firewall"]
      checked: 2026-11-14
  status: draft

