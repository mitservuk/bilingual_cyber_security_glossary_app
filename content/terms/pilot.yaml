- id: cloud.shared-responsibility
  en:
    term: shared responsibility model
    definition: >-
      The division of security duties between a cloud provider and its
      customer. The split moves with the service model: the more the provider
      manages, the less the customer has to secure directly.
  es:
    verdict: translated
    forms:
      - text: modelo de responsabilidad compartida
        article: el
        kind: noun
        primary: true
    definition: >-
      Reparto de las obligaciones de seguridad entre el proveedor de la nube y
      el cliente.
    examples:
      - es: >-
          Según el modelo de responsabilidad compartida, el cifrado de los
          datos es responsabilidad del cliente.
        en: >-
          Under the shared responsibility model, encrypting the data is the
          customer's responsibility.
    watchOut: >-
      The two parties are el proveedor (the provider) and el cliente (the
      customer).
  topics: [architecture, grc]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
  related: [cloud.cloud-computing, cloud.iaas]
  sources:
    - label: "CCN-STIC 499, Arquitecturas de seguridad cloud"
      url: "https://www.ccn-cert.cni.es/pdf/guias/series-ccn-stic/guias-de-acceso-publico-ccn-stic/6807-ccn-stic-499-arquitecturas-de-seguridad-cloud/file.html"
      lead: "modelo de responsabilidad compartida en el que pueden existir diferentes actores con diferentes responsabilidades"
    - label: "Google Cloud, páginas para España"
      url: "https://cloud.google.com/learn/what-is-cloud-security?hl=es"
      found: ["modelos de responsabilidad compartida"]
      checked: 2026-11-14
    - label: "Microsoft Security, es-ES"
      url: "https://www.microsoft.com/es-es/security/business/security-101/what-is-cloud-security"
      found: ["modelo de responsabilidad compartida"]
      checked: 2026-11-14
    - label: "Oracle España"
      url: "https://www.oracle.com/es/security/cloud-security/what-is-cloud-security/"
      found: ["responsabilidad compartida entre el proveedor de la nube y el cliente"]
      checked: 2026-11-14
    - label: "Paradigma Digital, blog"
      url: "https://www.paradigmadigital.com/techbiz/8-razones-las-tus-desarrollos-estan-mas-seguros-cloud/"
      found: ["modelo de responsabilidad compartida"]
      checked: 2026-11-14
