# Pilot entries: 25 CCSP terms, written to settle the entry format.
# Format is described in content/README.md.
#
# Sources come in two strengths:
#   found + checked  the page was fetched on that date and contains that text.
#   lead             text a web search attributed to the URL; the page itself
#                    could not be opened. A place to check, not evidence.
# An entry is `sourced` only when every form and note rests on checked sources.

- id: cloud.cloud-computing
  en:
    term: cloud computing
    definition: >-
      Delivering computing resources (servers, storage, networks, applications)
      as on-demand services over a network, with self-service provisioning,
      pooled capacity and metered use.
  es:
    verdict: both
    forms:
      - text: computación en la nube
        article: la
        kind: noun
        primary: true
        note: The full term, used in documents and official guidance.
      - text: nube
        article: la
        kind: noun
        note: >-
          The everyday short form. "En la nube" is "in the cloud".
      - text: cloud computing
        article: el
        kind: noun
        note: >-
          The English term is also used as it stands, including in vendor
          documentation written for Spain.
      - text: informática en la nube
        article: la
        kind: noun
        note: Microsoft's wording in its Spanish documentation.
      - text: cloud
        article: el
        kind: noun
        note: >-
          The English word, common in engineering blogs and job adverts: "dar
          el salto al cloud". Also used as an adjective: "seguridad cloud".
    definition: >-
      Prestación de recursos informáticos como servicios bajo demanda a través
      de la red.
    examples:
      - es: Vamos a migrar la aplicación a la nube el próximo trimestre.
        en: We're going to migrate the application to the cloud next quarter.
    watchOut: >-
      Nube is feminine (la nube). The English word is usually masculine (el
      cloud), though "la cloud" also appears.
  topics: [architecture]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
  related: [cloud.iaas, cloud.shared-responsibility, cloud.multitenancy]
  sources:
    - label: "INCIBE, Glosario de términos de ciberseguridad"
      url: "https://www.incibe.es/sites/default/files/contenidos/guias/doc/guia_glosario_ciberseguridad_2021.pdf"
      found: ["cloud computing o computación en la nube"]
      checked: 2026-11-14
    - label: "Esquema Nacional de Seguridad (RD 311/2022), medida op.nub.1"
      url: "https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191"
      lead: "Los sistemas que suministran un servicio en la nube a organismos del sector público deberán cumplir con el conjunto de medidas de seguridad"
    - label: "Google Cloud, páginas para España"
