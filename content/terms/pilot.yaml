- id: fw.gdpr
  en:
    term: GDPR
    expansion: General Data Protection Regulation
    definition: >-
      The EU regulation governing the processing of personal data. It sets
      obligations for controllers and processors and gives rights to the
      people the data is about.
  es:
    verdict: translated
    acronym: RGPD
    forms:
      - text: RGPD
        article: el
        kind: noun
        primary: true
        note: >-
          The acronym changes, because the name is translated: Reglamento
          General de Protección de Datos.
    say: Said letter by letter, "erre-ge-pe-de".
    definition: >-
      Reglamento de la Unión Europea que regula el tratamiento de los datos
      personales.
    examples:
      - es: Esta transferencia de datos no cumple con el RGPD.
        en: This data transfer does not comply with the GDPR.
    watchOut: >-
      People will understand "GDPR", but Spanish documents say RGPD. In Spain
      it is complemented by a national law, the LOPDGDD, and enforced by the
      AEPD (Agencia Española de Protección de Datos).
  topics: [grc, data]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 6 }
  related: [law.data-controller, law.personal-data]
  sources:
    - label: "EUR-Lex, Reglamento (UE) 2016/679: síntesis"
      url: "https://eur-lex.europa.eu/ES/legal-content/summary/general-data-protection-regulation-gdpr.html"
      lead: "Reglamento general de protección de datos (RGPD)"
    - label: "Ley Orgánica 3/2018 (LOPDGDD)"
      url: "https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673"
  status: draft

- id: law.data-controller
  en:
    term: data controller
    definition: >-
      The person or organisation that decides why and how personal data is
      processed, and that carries the primary legal responsibility for it
      under the GDPR.
  es:
    verdict: translated
    forms:
      - text: responsable del tratamiento
        article: el
        kind: noun
        primary: true
        note: The official term in the Spanish text of the GDPR.
      - text: encargado del tratamiento
        article: el
        kind: noun
        note: >-
          The counterpart, the data processor: whoever processes the data on
          the controller's behalf.
      - text: tratamiento
        article: el
        kind: noun
        note: >-
          Processing, in the legal sense. Not "procesamiento".
    definition: >-
      Persona u organización que decide los fines y los medios del
      tratamiento de los datos personales.
    examples:
      - es: >-
          El cliente es el responsable del tratamiento y el proveedor de la
          nube, el encargado.
        en: >-
          The customer is the controller and the cloud provider is the
          processor.
    watchOut: >-
      Do not translate these word for word. Un controlador is a device driver
      or a controller in the engineering sense, and un procesador is a CPU.
  topics: [grc, data]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 6 }
  related: [fw.gdpr, law.personal-data, cloud.shared-responsibility]
  sources:
    - label: "Reglamento (UE) 2016/679, artículo 4, apartados 7 y 8"
      url: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679"
    - label: "AEPD, informe jurídico 2019-0007 (cita el artículo 4.8)"
      url: "https://www.aepd.es/documento/2019-0007.pdf"
      lead: "encargado del tratamiento o encargado"
  status: draft

- id: law.personal-data
  en:
    term: personal data
    definition: >-
      Any information relating to an identified or identifiable natural
      person. This is the GDPR's term, and it is broader than the American
      "PII".
  es:
    verdict: translated
    forms:
      - text: datos personales
        article: los
        kind: noun
        primary: true
        note: The official term in the Spanish text of the GDPR.
      - text: datos de carácter personal
        article: los
        kind: noun
        note: >-
          The wording of earlier Spanish law, still heard.
      - text: interesado
        article: el
        kind: noun
        note: >-
          The data subject: the person the data is about.
    definition: >-
      Toda información sobre una persona física identificada o identificable.
    examples:
      - es: No se pueden guardar datos personales en los entornos de desarrollo.
        en: Personal data must not be stored in development environments.
    watchOut: >-
      Interesado looks like "interested", but in data protection it means the
      data subject.
  topics: [data, grc]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 6 }
  related: [fw.gdpr, law.data-controller, sec.dlp]
  sources:
    - label: "Reglamento (UE) 2016/679, artículo 4, apartado 1"
      url: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679"
      lead: "«datos personales»: toda información sobre una persona física identificada o identificable («el interesado»)"
  status: draft

- id: sec.risk-assessment
  en:
    term: risk assessment
    definition: >-
      Identifying the threats and vulnerabilities that affect an asset, and
      estimating the likelihood and impact of harm, in order to decide how the
      risk should be treated.
  es:
    verdict: translated
    forms:
      - text: análisis de riesgos
        article: el
        kind: noun
        primary: true
        note: >-
          What Spanish job adverts and INCIBE call the activity, and the term
          of Spain's national security framework (ENS) and its methodology,
          MAGERIT.
      - text: evaluación de riesgos
        article: la
        kind: noun
        note: >-
          The direct translation, used by Google, Microsoft and Oracle in
          Spanish and also seen in practitioner writing. In the ISO
          vocabulary it has the narrower meaning of "risk evaluation", the
          step after analysis.
      - text: apreciación del riesgo
        article: la
        kind: noun
        register: formal
        note: >-
          The wording of the Spanish edition of ISO/IEC 27001 for "risk
          assessment". Expect it in certification and audit documents.
    definition: >-
      Identificación de las amenazas y vulnerabilidades de un activo y
      estimación de la probabilidad y el impacto del daño.
    examples:
      - es: Antes de migrar a la nube hay que hacer un análisis de riesgos.
        en: Before migrating to the cloud, a risk assessment has to be done.
    watchOut: >-
      Three Spanish terms compete for this one English term, and standards
      give each a slightly different meaning. Check which standard a document
      follows.
  topics: [grc]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 6 }
  related: [sec.threat-modelling, fw.gdpr]
  sources:
    - label: "Esquema Nacional de Seguridad (RD 311/2022), Anexo IV: Glosario"
      url: "https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191"
      lead: "Análisis de riesgos: estudio de las consecuencias previsibles de un posible incidente de seguridad"
    - label: "CCN-STIC 401, Glosario y abreviaturas: Evaluación de riesgos"
