# Pilot entries: 25 CCSP terms, written to settle the entry format.
# Format is described in content/README.md.
#
# Every entry is status: draft. The Spanish usage was written from general
# knowledge and has NOT been checked against the sources listed. Each `lead`
# is text that a web search attributed to that URL; none of the pages was
# opened and read. Treat leads as places to check, not as evidence.

- id: cloud.cloud-computing
  en:
    term: cloud computing
    definition: >-
      Delivering computing resources (servers, storage, networks, applications)
      as on-demand services over a network, with self-service provisioning,
      pooled capacity and metered use.
  es:
    verdict: both
    forms:
      - text: computación en la nube
        article: la
        kind: noun
        primary: true
        note: The full term, used in documents and official guidance.
      - text: nube
        article: la
        kind: noun
        note: >-
          The everyday short form. "En la nube" is "in the cloud".
      - text: cloud
        article: el
        kind: noun
        register: informal
        note: >-
          The English word, common in speech and in marketing: "migrar al
          cloud". Often used as an adjective too: "servicios cloud".
    definition: >-
      Prestación de recursos informáticos como servicios bajo demanda a través
      de la red.
    examples:
      - es: Vamos a migrar la aplicación a la nube el próximo trimestre.
        en: We're going to migrate the application to the cloud next quarter.
    watchOut: >-
      Nube is feminine (la nube), but the English word is used as a masculine
      noun (el cloud).
  topics: [architecture]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
  related: [cloud.iaas, cloud.shared-responsibility, cloud.multitenancy]
  sources:
    - label: "INCIBE, Glosario de términos de ciberseguridad"
      url: "https://www.incibe.es/sites/default/files/contenidos/guias/doc/guia_glosario_ciberseguridad_2021.pdf"
      lead: "El término cloud computing o computación en la nube se refiere a un paradigma que permite ofrecer servicios de computación a través de una red"
    - label: "Esquema Nacional de Seguridad (RD 311/2022), medida op.nub.1"
      url: "https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191"
      lead: "Los sistemas que suministran un servicio en la nube a organismos del sector público deberán cumplir con el conjunto de medidas de seguridad"
  status: draft

- id: cloud.shared-responsibility
  en:
    term: shared responsibility model
    definition: >-
      The division of security duties between a cloud provider and its
      customer. The split moves with the service model: the more the provider
      manages, the less the customer has to secure directly.
  es:
    verdict: translated
    forms:
      - text: modelo de responsabilidad compartida
        article: el
        kind: noun
        primary: true
    definition: >-
      Reparto de las obligaciones de seguridad entre el proveedor de la nube y
      el cliente.
    examples:
      - es: >-
          Según el modelo de responsabilidad compartida, el cifrado de los
          datos es responsabilidad del cliente.
        en: >-
          Under the shared responsibility model, encrypting the data is the
          customer's responsibility.
    watchOut: >-
      The two parties are el proveedor (the provider) and el cliente (the
      customer).
  topics: [architecture, grc]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
  related: [cloud.cloud-computing, cloud.iaas]
  sources:
    - label: "CCN-STIC 499, Arquitecturas de seguridad cloud"
      url: "https://www.ccn-cert.cni.es/pdf/guias/series-ccn-stic/guias-de-acceso-publico-ccn-stic/6807-ccn-stic-499-arquitecturas-de-seguridad-cloud/file.html"
      lead: "modelo de responsabilidad compartida en el que pueden existir diferentes actores con diferentes responsabilidades"
  status: draft

- id: cloud.multitenancy
  en:
    term: multitenancy
    definition: >-
      An architecture in which one instance of a service serves several
      customers (tenants) on shared infrastructure, relying on logical
      isolation to keep each tenant's data and workloads apart.
  es:
    verdict: both
    forms:
      - text: multi-tenant
        kind: adjective
        primary: true
        note: >-
          The English adjective is widely kept: "una arquitectura
          multi-tenant". Each customer's space is "el tenant".
      - text: tenencia múltiple
        article: la
        kind: noun
        register: formal
        note: The translated noun, found in official Spanish guidance.
      - text: multiinquilino
        kind: adjective
        note: >-
          A translated adjective seen in vendor documentation, where "tenant"
          becomes "inquilino".
    definition: >-
      Arquitectura en la que una misma instancia del servicio atiende a varios
      clientes sobre una infraestructura compartida, aislados entre sí de forma
      lógica.
    examples:
      - es: >-
          En un entorno multi-tenant, el aislamiento entre clientes es
          fundamental.
        en: >-
          In a multi-tenant environment, isolation between customers is
          essential.
    watchOut: >-
      There is no single settled translation. Expect to meet all three forms,
      and expect "tenant" itself to stay in English in conversation.
  topics: [architecture]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
  related: [cloud.cloud-computing, cloud.hypervisor]
  sources:
    - label: "CCN-STIC 499, Arquitecturas de seguridad cloud"
      url: "https://www.ccn-cert.cni.es/pdf/guias/series-ccn-stic/guias-de-acceso-publico-ccn-stic/6807-ccn-stic-499-arquitecturas-de-seguridad-cloud/file.html"
      lead: "La tenencia múltiple y la compartición de recursos son características inherentes de la computación en la nube."
  status: draft

- id: cloud.iaas
  en:
    term: infrastructure as a service
    acronym: IaaS
    definition: >-
      A cloud service model in which the provider supplies virtualised
      compute, storage and networking, and the customer manages everything
      from the operating system upwards.
  es:
    verdict: translated
    acronym: IaaS
    forms:
      - text: infraestructura como servicio
        article: la
        kind: noun
        primary: true
        note: >-
          The expansion is translated; the acronym IaaS stays as it is and is
          what people actually say.
    definition: >-
      Modelo de servicio en la nube en el que el proveedor ofrece cómputo,
      almacenamiento y red virtualizados, y el cliente gestiona todo lo demás
      a partir del sistema operativo.
    examples:
      - es: Con IaaS, el cliente se encarga del sistema operativo y de los parches.
        en: With IaaS, the customer looks after the operating system and patching.
    watchOut: >-
      The same pattern covers the other models: plataforma como servicio
      (PaaS) and software como servicio (SaaS).
  topics: [architecture]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
  related: [cloud.cloud-computing, cloud.shared-responsibility, cloud.virtual-machine]
  sources:
    - label: "CCN-STIC 823, Seguridad en entornos cloud"
      url: "https://www.ccn-cert.cni.es/es/800-guia-esquema-nacional-de-seguridad/541-ccn-stic-823-seguridad-en-entornos-cloud/file.html"
      lead: "las soluciones IaaS proporcionan una infraestructura, por norma general virtualizada, en la que el cliente es responsable del software que esa infraestructura soportará"
  status: draft

- id: sec.encryption
  en:
    term: encryption
    definition: >-
      Transforming data with a cryptographic algorithm and a key, so that only
      someone holding the right key can read it.
  es:
    verdict: translated
    forms:
      - text: cifrado
        article: el
        kind: noun
        primary: true
        note: The standard term, in documents and in speech.
      - text: cifrar
        kind: verb
        note: To encrypt. The opposite is descifrar.
      - text: encriptar
        kind: verb
        register: informal
        note: >-
          Also heard in speech, with the noun la encriptación. The RAE
          dictionary lists encriptar as a synonym of cifrar, but formal
          writing prefers cifrado.
    definition: >-
      Transformación de los datos mediante un algoritmo y una clave, de modo
      que solo quien tenga la clave correcta pueda leerlos.
    examples:
      - es: Los datos se cifran en reposo y en tránsito.
        en: Data is encrypted at rest and in transit.
    watchOut: >-
      Cifra also means a figure or number. "Las cifras de ventas" are the
      sales figures, nothing to do with encryption.
  topics: [crypto]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
  related: [sec.key-management, sec.data-at-rest, sec.tokenization]
  sources:
    - label: "Diccionario de la lengua española (RAE): cifrar"
      url: "https://dle.rae.es/cifrar"
      lead: "Transcribir, con una clave, un mensaje o texto cuyo contenido se quiere proteger"
    - label: "Diccionario de la lengua española (RAE): encriptar"
      url: "https://dle.rae.es/encriptar"
      lead: "Del ingl. to encrypt. Sinónimo: cifrar"
    - label: "Esquema Nacional de Seguridad (RD 311/2022), medida mp.com.2"
      url: "https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191"
      lead: "Se cifrará toda la información transmitida."
  status: draft

- id: sec.data-at-rest
  en:
    term: data at rest
    definition: >-
      Data held in persistent storage (disks, databases, object stores,
      backups), as opposed to data moving across a network or being processed.
  es:
    verdict: translated
    forms:
      - text: datos en reposo
        article: los
        kind: noun
        primary: true
      - text: datos en tránsito
        article: los
        kind: noun
        note: The counterpart, data in transit.
      - text: datos en uso
        article: los
        kind: noun
        note: Data in use.
    definition: >-
      Datos guardados en un almacenamiento persistente, a diferencia de los
      que viajan por la red o se están procesando.
    examples:
      - es: >-
          Todos los datos en reposo deben estar cifrados con claves gestionadas
          por el cliente.
        en: >-
          All data at rest must be encrypted with customer-managed keys.
    watchOut: >-
      Datos is always plural in Spanish, so the verb is plural too: "los datos
      están cifrados", never "está".
  topics: [data, crypto]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
  related: [sec.encryption, sec.key-management, sec.dlp]
  sources:
    - label: "CCN-STIC 499, Arquitecturas de seguridad cloud"
      url: "https://www.ccn-cert.cni.es/pdf/guias/series-ccn-stic/guias-de-acceso-publico-ccn-stic/6807-ccn-stic-499-arquitecturas-de-seguridad-cloud/file.html"
      lead: "Todos los productos o servicios de cifrado en reposo deberán estar incluidos en el CPSTIC"
  status: draft

- id: sec.key-management
  en:
    term: key management
    definition: >-
      Generating, storing, distributing, rotating and destroying cryptographic
      keys across their whole lifecycle.
  es:
    verdict: translated
    acronym: KMS
    forms:
      - text: gestión de claves
        article: la
        kind: noun
        primary: true
        note: >-
          A key management service keeps its English acronym: "el KMS".
      - text: rotación de claves
        article: la
        kind: noun
        note: Key rotation.
    definition: >-
      Generación, almacenamiento, distribución, rotación y destrucción de las
      claves criptográficas durante todo su ciclo de vida.
    examples:
      - es: La rotación de claves se hace automáticamente cada noventa días.
        en: Key rotation happens automatically every ninety days.
    watchOut: >-
      A cryptographic key is una clave, not una llave. In Spain, llave is the
      physical key for a door; llave for cryptographic keys is Latin American
      usage.
  topics: [crypto]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
  related: [sec.encryption, sec.data-at-rest]
  sources:
    - label: "CCN-STIC 401, Glosario y abreviaturas: Gestión de claves"
      url: "https://www.ccn-cert.cni.es/es/series-ccn-stic/guias/glosario-de-terminos.html"
      lead: "2.533 Gestión de claves"
    - label: "Esquema Nacional de Seguridad (RD 311/2022), medida op.exp.10"
      url: "https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191"
      lead: "Protección de claves criptográficas"
  status: draft

- id: sec.tokenization
  en:
    term: tokenization
    definition: >-
      Replacing a sensitive value with a substitute (a token) that has no
      exploitable meaning, while the mapping back to the original is kept in a
      separate, protected store.
  es:
    verdict: translated
    forms:
      - text: tokenización
        article: la
        kind: noun
        primary: true
      - text: token
        article: el
        kind: noun
        note: Kept from English. Plural los tokens.
    definition: >-
      Sustitución de un dato sensible por un valor sin significado propio (un
      token), guardando la correspondencia en un almacén protegido aparte.
    examples:
      - es: Usamos tokenización para no almacenar los números de tarjeta.
        en: We use tokenization so that we don't store card numbers.
  topics: [data]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
  related: [sec.encryption, sec.dlp, law.personal-data]
  sources: []
  status: draft

- id: sec.dlp
  en:
    term: data loss prevention
    acronym: DLP
    definition: >-
      Controls that detect and block sensitive data leaving the organisation
      through unauthorised channels, typically by inspecting content in use,
      in motion and at rest.
  es:
    verdict: both
    acronym: DLP
    forms:
      - text: prevención de pérdida de datos
        article: la
        kind: noun
        primary: true
        note: >-
          The literal translation. In practice the acronym is what people
          say: "una solución DLP", "las políticas de DLP".
      - text: prevención de fugas de datos
        article: la
        kind: noun
        note: >-
          "Data leak prevention". Fuga (leak) is the usual Spanish word for
          data escaping: "una fuga de datos", "una fuga de información".
    definition: >-
      Controles que detectan e impiden que la información sensible salga de la
      organización por canales no autorizados.
    examples:
      - es: La política de DLP bloquea el envío de datos personales por correo.
        en: The DLP policy blocks personal data being sent by email.
    watchOut: >-
      Official Spanish sources do not agree on one expansion; both appear.
  topics: [data]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
  related: [sec.data-at-rest, sec.tokenization, law.personal-data]
  sources:
    - label: "INCIBE, Glosario de términos de ciberseguridad: DLP"
      url: "https://www.incibe.es/sites/default/files/contenidos/guias/doc/guia_glosario_ciberseguridad_2021.pdf"
      lead: "herramientas que sirven para prevenir las fugas o pérdidas de información"
    - label: "CCN-STIC 140, Anexo E.4: Sistemas de prevención de fugas de datos"
      url: "https://www.ccn-cert.cni.es/es/pdf/guias/series-ccn-stic/guias-de-acceso-publico-ccn-stic/3965-guia-140-anexo-e-4-sistemas-de-prevencion-de-fugas-de-datos/file"
      lead: "impiden y evitan la transferencia de datos no autorizados y la fuga de información con nivel alto de confidencialidad"
  status: draft

- id: cloud.hypervisor
  en:
    term: hypervisor
    definition: >-
      Software that creates and runs virtual machines by abstracting the
      physical hardware and isolating the guests from one another.
  es:
    verdict: translated
    forms:
      - text: hipervisor
        article: el
        kind: noun
        primary: true
        plural: los hipervisores
    definition: >-
      Software que crea y ejecuta máquinas virtuales, abstrayendo el hardware
      físico y aislándolas entre sí.
    examples:
      - es: >-
          Una vulnerabilidad en el hipervisor afectaría a todas las máquinas
          virtuales del host.
        en: >-
          A vulnerability in the hypervisor would affect every virtual machine
          on the host.
    watchOut: >-
      Spelt with an i, and the h is silent.
  topics: [hardening, architecture]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [cloud.virtual-machine, cloud.multitenancy]
  sources:
    - label: "CCN-STIC 887D, Guía de configuración segura multi-cuenta AWS"
      url: "https://www.ccn-cert.cni.es/es/800-guia-esquema-nacional-de-seguridad/5876-ccn-stic-887d-guia-de-configuracion-segura-multi-cuenta-aws/file.html"
      lead: "Un hipervisor o monitor de máquina virtual es una capa de software para realizar una virtualización de hardware"
  status: draft

- id: cloud.virtual-machine
  en:
    term: virtual machine
    acronym: VM
    definition: >-
      A software emulation of a complete computer, with its own operating
      system, running on shared physical hardware under a hypervisor.
  es:
    verdict: translated
    acronym: VM
    forms:
      - text: máquina virtual
        article: la
        kind: noun
        primary: true
        plural: las máquinas virtuales
        note: >-
          The English acronym VM is commonly kept and takes the feminine:
          "una VM".
    definition: >-
      Emulación por software de un ordenador completo, con su propio sistema
      operativo, que se ejecuta sobre hardware compartido.
    examples:
      - es: Hay que apagar la máquina virtual antes de cambiar su tamaño.
        en: The virtual machine has to be shut down before resizing it.
  topics: [architecture]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [cloud.hypervisor, cloud.iaas]
  sources:
    - label: "INCIBE, Guía de buenas prácticas de ciberseguridad en redes privadas 5G: glosario"
      url: "https://www.incibe.es/sites/default/files/2025-12/INCIBE&ULE_GuiaBuenasPracticasCiberseguridadRedesPrivadas5G.pdf"
      lead: "Máquina virtual: Emulación por software de un sistema informático completo."
  status: draft

- id: sec.disaster-recovery
  en:
    term: disaster recovery
    acronym: DR
    definition: >-
      The plans and capabilities for restoring IT services after a major
      disruption, measured against a recovery time objective (RTO) and a
      recovery point objective (RPO).
  es:
    verdict: translated
    acronym: DR
    forms:
      - text: recuperación ante desastres
        article: la
        kind: noun
        primary: true
        note: >-
          The plan is "el plan de recuperación ante desastres". The acronyms
          DR, RTO and RPO stay in English.
      - text: continuidad de negocio
        article: la
        kind: noun
        note: Business continuity, the wider discipline it belongs to.
      - text: plan de contingencia
        article: el
        kind: noun
        register: formal
        note: >-
          Contingency plan. The term official Spanish guidance tends to use.
    definition: >-
      Planes y capacidades para restablecer los servicios de TI después de una
      interrupción grave.
    examples:
      - es: El plan de recuperación ante desastres se prueba dos veces al año.
        en: The disaster recovery plan is tested twice a year.
    watchOut: >-
      In full, RTO is "tiempo objetivo de recuperación" and RPO is "punto
      objetivo de recuperación", but in conversation people use the acronyms.
  topics: [incident]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [sec.backup, sec.incident-response]
  sources:
    - label: "INCIBE, Guía de gestión de crisis"
      url: "https://www.incibe.es/sites/default/files/contenidos/guias/doc/guia_gestion_de_crisis.pdf"
      lead: "deberían contar con un plan de continuidad de negocio y un plan de recuperación ante desastres"
    - label: "CCN, ayuda de PILAR: continuidad"
      url: "https://www.ccn-cert.cni.es/publico/herramientas/Pilar-5.4.8/Pilar_5.4.8/bcm_es/topics/6.html"
      lead: "RTO Tiempo objetivo de recuperación"
  status: draft

- id: sec.firewall
  en:
    term: firewall
    definition: >-
      A control that filters network traffic between zones of differing trust
      according to a defined set of rules.
  es:
    verdict: both
    forms:
      - text: cortafuegos
        article: el
        kind: noun
        primary: true
        plural: los cortafuegos
        register: formal
        note: >-
          The term in official guidance and formal documents, and the one the
          RAE recommends.
      - text: firewall
        article: el
        kind: noun
        plural: los firewalls
        note: >-
          Very common in speech, and kept in vendor product names.
    definition: >-
      Sistema que filtra el tráfico de red entre zonas con distinto nivel de
      confianza según unas reglas definidas.
    examples:
      - es: Hay que abrir el puerto 443 en el cortafuegos.
        en: Port 443 needs to be opened on the firewall.
    watchOut: >-
      Cortafuegos ends in -s even in the singular: un cortafuegos, dos
      cortafuegos.
  topics: [network]
  technology: [networking]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 3 }
  related: [sec.log, sec.api]
  sources:
    - label: "Diccionario panhispánico de dudas (RAE): cortafuegos"
      url: "https://www.rae.es/dpd/cortafuegos"
      lead: "se recomienda evitar, por innecesario, el anglicismo firewall"
    - label: "CCN-STIC 408, Seguridad perimetral: cortafuegos"
      url: "https://www.ccn-cert.cni.es/es/guias-de-acceso-publico-ccn-stic/74-ccn-stic-408-seguridad-perimetral-cortafuegos/file.html"
      lead: "Un cortafuegos (firewall) es aquel sistema formado por aplicaciones, dispositivos o combinación de éstos encargado de hacer cumplir una política de control de acceso"
    - label: "INCIBE, guía sectorial de turismo y ocio"
      url: "https://www.incibe.es/sites/default/files/contenidos/guias/doc/guia-turismo-ocio.pdf"
      lead: "Un firewall puede ser implementado tanto por software como por hardware."
  status: draft

- id: sec.sdlc
  en:
    term: software development lifecycle
    acronym: SDLC
    definition: >-
      The structured sequence of phases (requirements, design, build, test,
      release, maintenance) through which software is produced, and into which
      security activities are integrated.
  es:
    verdict: translated
    acronym: SDLC
    forms:
      - text: ciclo de vida de desarrollo de software
        article: el
        kind: noun
        primary: true
        note: >-
          The acronym SDLC stays in English. The word software is not
          translated: "el software".
    definition: >-
      Secuencia de fases por las que pasa la creación de un software, desde
      los requisitos hasta el mantenimiento.
    examples:
      - es: >-
          La seguridad debe integrarse en todas las fases del ciclo de vida de
          desarrollo.
        en: >-
          Security must be built into every phase of the development
          lifecycle.
  topics: [appsec]
  technology: [ci-cd]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [sec.threat-modelling, sec.sandbox]
  sources:
    - label: "CCN-STIC 812, Seguridad en entornos y aplicaciones web"
      url: "https://www.ccn-cert.cni.es/es/series-ccn-stic/800-guia-esquema-nacional-de-seguridad/522-ccn-stic-812-seguridad-en-entornos-y-app-web/file"
      lead: "incluir todos los aspectos de seguridad en el ciclo de vida de desarrollo de software (SDLC)"
  status: draft

- id: sec.sandbox
  en:
    term: sandbox
    definition: >-
      An isolated environment in which untrusted or untested code can run
      without being able to affect the host system or production data.
  es:
    verdict: english-kept
    forms:
      - text: sandbox
        article: el
        kind: noun
        primary: true
        note: >-
          Kept in English, including in official Spanish guidance.
      - text: entorno aislado
        article: el
        kind: noun
        note: >-
          "Isolated environment", used to explain the idea rather than to name
          it.
    definition: >-
      Entorno aislado en el que se puede ejecutar código sospechoso o sin
      probar sin que afecte al sistema ni a los datos de producción.
    examples:
      - es: >-
          El fichero se ejecuta primero en un sandbox para analizar su
          comportamiento.
        en: >-
          The file is first run in a sandbox to analyse its behaviour.
    watchOut: >-
      The literal translation "caja de arena" is not used.
  topics: [hardening, appsec]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [sec.sdlc, cloud.virtual-machine]
  sources:
    - label: "INCIBE-CERT, blog: actuación frente a ciberincidentes"
      url: "https://www.incibe.es/incibe-cert/blog/lista-compra-actuacion-frente-ciberincidentes-gestion-y-resiliencia"
      lead: "Sandbox: entorno en el cual se puede ejecutar de forma aislada un código o aplicación sospechosa sin afectar al entorno de explotación."
  status: draft

- id: sec.threat-modelling
  en:
    term: threat modelling
    definition: >-
      A structured analysis of a system's assets, entry points and trust
      boundaries to identify plausible attacks and decide which controls are
      needed.
  es:
    verdict: both
    forms:
      - text: modelado de amenazas
        article: el
        kind: noun
        primary: true
      - text: threat modeling
        article: el
        kind: noun
        register: informal
        note: >-
          The English term is also used as it stands: "hacer threat modeling".
    definition: >-
      Análisis estructurado de los activos, los puntos de entrada y los
      límites de confianza de un sistema para identificar ataques posibles.
    examples:
      - es: >-
          Hacemos un modelado de amenazas en la fase de diseño de cada
          servicio.
        en: >-
          We do threat modelling in the design phase of each service.
    watchOut: >-
      A threat is una amenaza. Do not confuse it with un riesgo (a risk) or
      una vulnerabilidad (a vulnerability).
  topics: [threat, appsec]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [sec.sdlc, sec.risk-assessment]
  sources:
    - label: "INCIBE, diccionario de controles C4V (borrador)"
      url: "https://www.incibe.es/sites/default/files/paginas/publicaciones/ensi/ensi_c4v_02_diccionario-controles_borrador.pdf"
      lead: "Modelado de amenazas/Análisis de riesgos."
  status: draft

- id: sec.api
  en:
    term: API
    expansion: application programming interface
    definition: >-
      A defined contract through which one piece of software requests services
      or data from another. In the cloud, APIs are both the main management
      plane and a major attack surface.
  es:
    verdict: english-kept
    acronym: API
    forms:
      - text: API
        article: la
        kind: noun
        primary: true
        plural: las API
        note: >-
          Feminine, because the full form is "interfaz de programación de
          aplicaciones" and interfaz is feminine.
    say: Said as a word, "A-pi", not letter by letter.
    definition: >-
      Contrato definido mediante el cual un programa solicita servicios o
      datos a otro.
    examples:
      - es: La API está protegida con autenticación OAuth 2.0.
        en: The API is protected with OAuth 2.0 authentication.
    watchOut: >-
      The RAE's rule is that acronyms do not take an -s in writing (las API).
      You will nevertheless see "las APIs" everywhere, and in speech the
      plural is pronounced with the s.
  topics: [appsec]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 4 }
  related: [sec.firewall, sec.sdlc]
  sources:
    - label: "Diccionario panhispánico de dudas (RAE): sigla"
      url: "https://www.rae.es/dpd/sigla"
      lead: "se debe evitar el recurso, tomado del inglés, de añadir al final de la sigla una s minúscula"
    - label: "INCIBE, Guía de buenas prácticas de ciberseguridad en redes privadas 5G: glosario"
      url: "https://www.incibe.es/sites/default/files/2025-12/INCIBE&ULE_GuiaBuenasPracticasCiberseguridadRedesPrivadas5G.pdf"
      lead: "API (Application Programming Interface / Interfaz de Programación de Aplicaciones)"
  status: draft

- id: sec.incident-response
  en:
    term: incident response
    definition: >-
      The organised process of detecting, containing, eradicating and
      recovering from a security incident, and learning from it afterwards.
  es:
    verdict: translated
    forms:
      - text: respuesta a incidentes
        article: la
        kind: noun
        primary: true
        note: >-
          The team is "el equipo de respuesta a incidentes". The acronyms
          CSIRT and CERT stay in English.
      - text: gestión de incidentes
        article: la
        kind: noun
        register: formal
        note: >-
          "Incident management". The heading used in Spain's national security
          framework for the whole process.
      - text: ciberincidente
        article: el
        kind: noun
        note: >-
          A cyber incident. Common in Spanish public-sector guidance.
    definition: >-
      Proceso organizado para detectar, contener y erradicar un incidente de
      seguridad, recuperarse de él y aprender de lo ocurrido.
    examples:
      - es: >-
          El equipo de respuesta a incidentes ha contenido el ataque en menos
          de una hora.
        en: >-
          The incident response team contained the attack in under an hour.
  topics: [incident]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 5 }
  related: [sec.log, sec.disaster-recovery]
  sources:
    - label: "Esquema Nacional de Seguridad (RD 311/2022), medida op.exp.7: Gestión de incidentes"
      url: "https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191"
      lead: "Se dispondrá de un proceso integral para hacer frente a los incidentes que puedan tener un impacto en la seguridad del sistema"
    - label: "CCN-STIC 401, Glosario y abreviaturas: Gestión de incidentes"
      url: "https://www.ccn-cert.cni.es/es/series-ccn-stic/guias/glosario-de-terminos.html"
      lead: "Procesos para la detección, notificación, evaluación, respuesta, tratamiento, y aprendizaje de incidentes de seguridad de información."
  status: draft

- id: sec.patch-management
  en:
    term: patch management
    definition: >-
      Identifying, testing and deploying software updates that fix
      vulnerabilities or defects, in a controlled and timely way.
  es:
    verdict: translated
    forms:
      - text: gestión de parches
        article: la
        kind: noun
        primary: true
      - text: parche
        article: el
        kind: noun
        note: >-
          A patch. To apply one is "aplicar un parche".
      - text: parchear
        kind: verb
        register: informal
        note: >-
          To patch. Everyday engineering usage; formal documents say "aplicar
          parches" or "aplicar actualizaciones de seguridad".
    definition: >-
      Identificación, prueba y despliegue controlado de las actualizaciones
      que corrigen vulnerabilidades o defectos del software.
    examples:
      - es: Todavía no hemos parcheado los servidores de preproducción.
        en: We haven't patched the pre-production servers yet.
  topics: [vulnmgmt]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 5 }
  related: [sec.incident-response, cloud.iaas]
  sources:
    - label: "INCIBE-CERT, blog: Gestión de parches en sistemas de control"
      url: "https://www.incibe.es/incibe-cert/blog"
      lead: "cada proceso es único y todos los parches deben probarse en un entorno controlado"
    - label: "Diccionario de la lengua española (RAE): parchear"
      url: "https://dle.rae.es/parchear"
      lead: "Poner parches."
  status: draft

- id: sec.log
  en:
    term: log
    definition: >-
      A time-ordered record of events produced by a system or application,
      used for troubleshooting, monitoring and security investigation.
  es:
    verdict: both
    forms:
      - text: registro
        article: el
        kind: noun
        primary: true
        register: formal
        note: >-
          The term in formal documents: "registro de actividad" (activity
          log), "registro de auditoría" (audit log).
      - text: log
        article: el
        kind: noun
        plural: los logs
        note: >-
          The English word, standard in day-to-day engineering speech.
    definition: >-
      Registro cronológico de los eventos que genera un sistema o una
      aplicación.
    examples:
      - es: Revisa los logs del servidor para ver qué ha pasado.
        en: Check the server logs to see what happened.
    watchOut: >-
      Registro has several other meanings (a register, a record, a
      registration, the Windows registry), which is one reason engineers say
      "logs" when they want to be unambiguous.
  topics: [detection]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 5 }
  related: [sec.incident-response, sec.firewall]
  sources:
    - label: "Esquema Nacional de Seguridad (RD 311/2022), medida op.exp.8: Registro de la actividad"
      url: "https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191"
      lead: "se registrarán las actividades en el sistema, de forma que se genere un registro de auditoría"
    - label: "INCIBE, Taxonomía de soluciones de ciberseguridad"
      url: "https://www.incibe.es/sites/default/files/contenidos/guias/doc/taxonomia_ciberseguridad.pdf"
      lead: "Son herramientas de gestión y análisis de logs, para la protección de activos e información frente a amenazas."
  status: draft

- id: sec.backup
  en:
    term: backup
    definition: >-
      A copy of data kept separately from the original, so that it can be
      restored after loss, corruption or attack.
  es:
    verdict: both
    forms:
      - text: copia de seguridad
        article: la
        kind: noun
        primary: true
        note: >-
          The standard term, and the one the RAE recommends. To take one is
          "hacer una copia de seguridad".
      - text: backup
        article: el
        kind: noun
        plural: los backups
        register: informal
        note: >-
          The English word, very common in speech: "hacer un backup".
    definition: >-
      Copia de los datos que se guarda aparte del original para poder
      restaurarlos en caso de pérdida, corrupción o ataque.
    examples:
      - es: Se hace una copia de seguridad completa todas las noches.
        en: A full backup is taken every night.
    watchOut: >-
      "Respaldo" or "copia de respaldo" is the Latin American term. It is
      understood in Spain but not the usual choice.
  topics: [incident, data]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 5 }
  related: [sec.disaster-recovery, sec.data-at-rest]
  sources:
    - label: "Diccionario panhispánico de dudas (RAE): copia de seguridad"
      url: "https://www.rae.es/dpd/copia%20de%20seguridad"
      lead: "especialmente en América, (copia de) resguardo o respaldo"
  status: draft

- id: fw.gdpr
  en:
    term: GDPR
    expansion: General Data Protection Regulation
    definition: >-
      The EU regulation governing the processing of personal data. It sets
      obligations for controllers and processors and gives rights to the
      people the data is about.
  es:
    verdict: translated
    acronym: RGPD
    forms:
      - text: RGPD
        article: el
        kind: noun
        primary: true
        note: >-
          The acronym changes, because the name is translated: Reglamento
          General de Protección de Datos.
    say: Said letter by letter, "erre-ge-pe-de".
    definition: >-
      Reglamento de la Unión Europea que regula el tratamiento de los datos
      personales.
    examples:
      - es: Esta transferencia de datos no cumple con el RGPD.
        en: This data transfer does not comply with the GDPR.
    watchOut: >-
      People will understand "GDPR", but Spanish documents say RGPD. In Spain
      it is complemented by a national law, the LOPDGDD, and enforced by the
      AEPD (Agencia Española de Protección de Datos).
  topics: [grc, data]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 6 }
  related: [law.data-controller, law.personal-data]
  sources:
    - label: "EUR-Lex, Reglamento (UE) 2016/679: síntesis"
      url: "https://eur-lex.europa.eu/ES/legal-content/summary/general-data-protection-regulation-gdpr.html"
      lead: "Reglamento general de protección de datos (RGPD)"
    - label: "Ley Orgánica 3/2018 (LOPDGDD)"
      url: "https://www.boe.es/buscar/act.php?id=BOE-A-2018-16673"
  status: draft

- id: law.data-controller
  en:
    term: data controller
    definition: >-
      The person or organisation that decides why and how personal data is
      processed, and that carries the primary legal responsibility for it
      under the GDPR.
  es:
    verdict: translated
    forms:
      - text: responsable del tratamiento
        article: el
        kind: noun
        primary: true
        note: The official term in the Spanish text of the GDPR.
      - text: encargado del tratamiento
        article: el
        kind: noun
        note: >-
          The counterpart, the data processor: whoever processes the data on
          the controller's behalf.
      - text: tratamiento
        article: el
        kind: noun
        note: >-
          Processing, in the legal sense. Not "procesamiento".
    definition: >-
      Persona u organización que decide los fines y los medios del
      tratamiento de los datos personales.
    examples:
      - es: >-
          El cliente es el responsable del tratamiento y el proveedor de la
          nube, el encargado.
        en: >-
          The customer is the controller and the cloud provider is the
          processor.
    watchOut: >-
      Do not translate these word for word. Un controlador is a device driver
      or a controller in the engineering sense, and un procesador is a CPU.
  topics: [grc, data]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 6 }
  related: [fw.gdpr, law.personal-data, cloud.shared-responsibility]
  sources:
    - label: "Reglamento (UE) 2016/679, artículo 4, apartados 7 y 8"
      url: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679"
    - label: "AEPD, informe jurídico 2019-0007 (cita el artículo 4.8)"
      url: "https://www.aepd.es/documento/2019-0007.pdf"
      lead: "encargado del tratamiento o encargado"
  status: draft

- id: law.personal-data
  en:
    term: personal data
    definition: >-
      Any information relating to an identified or identifiable natural
      person. This is the GDPR's term, and it is broader than the American
      "PII".
  es:
    verdict: translated
    forms:
      - text: datos personales
        article: los
        kind: noun
        primary: true
        note: The official term in the Spanish text of the GDPR.
      - text: datos de carácter personal
        article: los
        kind: noun
        note: >-
          The wording of earlier Spanish law, still heard.
      - text: interesado
        article: el
        kind: noun
        note: >-
          The data subject: the person the data is about.
    definition: >-
      Toda información sobre una persona física identificada o identificable.
    examples:
      - es: No se pueden guardar datos personales en los entornos de desarrollo.
        en: Personal data must not be stored in development environments.
    watchOut: >-
      Interesado looks like "interested", but in data protection it means the
      data subject.
  topics: [data, grc]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 6 }
  related: [fw.gdpr, law.data-controller, sec.dlp]
  sources:
    - label: "Reglamento (UE) 2016/679, artículo 4, apartado 1"
      url: "https://eur-lex.europa.eu/legal-content/ES/TXT/?uri=CELEX:32016R0679"
      lead: "«datos personales»: toda información sobre una persona física identificada o identificable («el interesado»)"
  status: draft

- id: sec.risk-assessment
  en:
    term: risk assessment
    definition: >-
      Identifying the threats and vulnerabilities that affect an asset, and
      estimating the likelihood and impact of harm, in order to decide how the
      risk should be treated.
  es:
    verdict: translated
    forms:
      - text: análisis de riesgos
        article: el
        kind: noun
        primary: true
        note: >-
          The term used by Spain's national security framework (ENS) and its
          public-sector methodology, MAGERIT. The safest choice in Spain.
      - text: evaluación de riesgos
        article: la
        kind: noun
        note: >-
          Common as a general translation. In the ISO vocabulary it has the
          narrower meaning of "risk evaluation", the step after analysis.
      - text: apreciación del riesgo
        article: la
        kind: noun
        register: formal
        note: >-
          The wording of the Spanish edition of ISO/IEC 27001 for "risk
          assessment". Expect it in certification and audit documents.
    definition: >-
      Identificación de las amenazas y vulnerabilidades de un activo y
      estimación de la probabilidad y el impacto del daño.
    examples:
      - es: Antes de migrar a la nube hay que hacer un análisis de riesgos.
        en: Before migrating to the cloud, a risk assessment has to be done.
    watchOut: >-
      Three Spanish terms compete for this one English term, and standards
      give each a slightly different meaning. Check which standard a document
      follows.
  topics: [grc]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 6 }
  related: [sec.threat-modelling, fw.gdpr]
  sources:
    - label: "Esquema Nacional de Seguridad (RD 311/2022), Anexo IV: Glosario"
      url: "https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191"
      lead: "Análisis de riesgos: estudio de las consecuencias previsibles de un posible incidente de seguridad"
    - label: "CCN-STIC 401, Glosario y abreviaturas: Evaluación de riesgos"
      url: "https://www.ccn-cert.cni.es/es/series-ccn-stic/guias/glosario-de-terminos.html"
      lead: "Proceso de comparación de los resultados del análisis del riesgo con los criterios de riesgo"
    - label: "MAGERIT v3, Libro I: Método"
      url: "https://www.ccn-cert.cni.es/documentos-publicos/1789-magerit-libro-i-metodo/file.html"
      lead: "Proceso sistemático para estimar la magnitud de los riesgos a que está expuesta una Organización."
  status: draft
