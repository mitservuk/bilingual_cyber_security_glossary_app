- id: cloud.multitenancy
  en:
    term: multitenancy
    definition: >-
      An architecture in which one instance of a service serves several
      customers (tenants) on shared infrastructure, relying on logical
      isolation to keep each tenant's data and workloads apart.
  es:
    verdict: both
    forms:
      - text: multi-tenant
        kind: adjective
        primary: true
        note: >-
          The English adjective is what Spain-based engineering blogs write:
          "un escenario multi-tenant". Each customer's space is "el tenant".
      - text: multiinquilino
        kind: adjective
        note: >-
          Microsoft's wording in its Spanish documentation, where a tenant is
          "un inquilino".
      - text: multicliente
        kind: adjective
        note: Google Cloud's wording on its pages for Spain.
      - text: tenencia múltiple
        article: la
        kind: noun
        register: formal
        note: The translated noun, found in official Spanish guidance.
    definition: >-
      Arquitectura en la que una misma instancia del servicio atiende a varios
      clientes sobre una infraestructura compartida, aislados entre sí de forma
      lógica.
    examples:
      - es: >-
          En un entorno multi-tenant, el aislamiento entre clientes es
          fundamental.
        en: >-
          In a multi-tenant environment, isolation between customers is
          essential.
    watchOut: >-
      Practitioners keep the English, while each vendor's documentation uses a
      different translation. Say multi-tenant; recognise the others when you
      read them.
  topics: [architecture]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
  related: [cloud.cloud-computing, cloud.hypervisor]
  sources:
    - label: "CCN-STIC 499, Arquitecturas de seguridad cloud"
      url: "https://www.ccn-cert.cni.es/pdf/guias/series-ccn-stic/guias-de-acceso-publico-ccn-stic/6807-ccn-stic-499-arquitecturas-de-seguridad-cloud/file.html"
      lead: "La tenencia múltiple y la compartición de recursos son características inherentes de la computación en la nube."
    - label: "Microsoft Security, es-ES"
      url: "https://www.microsoft.com/es-es/security/business/security-101/what-is-cloud-security"
      found: ["multiinquilino"]
      checked: 2026-11-14
    - label: "Google Cloud, páginas para España"
      url: "https://cloud.google.com/learn/what-is-a-virtual-machine?hl=es"
      found: ["multicliente"]
      checked: 2026-11-14
    - label: "Paradigma Digital, blog"
      url: "https://www.paradigmadigital.com/dev/arquitecturas-eda-en-que-consisten-que-tener-en-cuenta/"
      found: ["escenario multi-tenant"]
      checked: 2026-11-14
    - label: "Paradigma Digital, blog"
      url: "https://www.paradigmadigital.com/dev/podcast-webassembly-fuera-navegador-wasi-y-component-model/"
