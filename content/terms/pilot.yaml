- id: sec.log
  en:
    term: log
    definition: >-
      A time-ordered record of events produced by a system or application,
      used for troubleshooting, monitoring and security investigation.
  es:
    verdict: both
    forms:
      - text: registro
        article: el
        kind: noun
        primary: true
        register: formal
        note: >-
          The term in formal documents: "registro de actividad" (activity
          log), "registro de auditoría" (audit log).
      - text: log
        article: el
        kind: noun
        plural: los logs
        note: >-
          The English word, standard in engineering blogs, job adverts and
          INCIBE's own guidance.
    definition: >-
      Registro cronológico de los eventos que genera un sistema o una
      aplicación.
    examples:
      - es: Revisa los logs del servidor para ver qué ha pasado.
        en: Check the server logs to see what happened.
    watchOut: >-
      Registro has several other meanings (a register, a record, a
      registration, the Windows registry), which is one reason engineers say
      "logs" when they want to be unambiguous.
  topics: [detection]
  technology: []
  curriculum:
