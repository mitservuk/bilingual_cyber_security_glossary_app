- id: cloud.iaas
  en:
    term: infrastructure as a service
    acronym: IaaS
    definition: >-
      A cloud service model in which the provider supplies virtualised
      compute, storage and networking, and the customer manages everything
      from the operating system upwards.
  es:
    verdict: translated
    acronym: IaaS
    forms:
      - text: infraestructura como servicio
        article: la
        kind: noun
        primary: true
        note: >-
          The expansion is translated; the acronym IaaS stays as it is.
    definition: >-
      Modelo de servicio en la nube en el que el proveedor ofrece cómputo,
      almacenamiento y red virtualizados, y el cliente gestiona todo lo demás
      a partir del sistema operativo.
    examples:
      - es: Con IaaS, el cliente se encarga del sistema operativo y de los parches.
        en: With IaaS, the customer looks after the operating system and patching.
    watchOut: >-
      The same pattern covers the other models: plataforma como servicio
      (PaaS) and software como servicio (SaaS).
  topics: [architecture]
  technology: [cloud-general]
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 1 }
  related: [cloud.cloud-computing, cloud.shared-responsibility, cloud.virtual-machine]
  sources:
    - label: "CCN-STIC 823, Seguridad en entornos cloud"
      url: "https://www.ccn-cert.cni.es/es/800-guia-esquema-nacional-de-seguridad/541-ccn-stic-823-seguridad-en-entornos-cloud/file.html"
      lead: "las soluciones IaaS proporcionan una infraestructura, por norma general virtualizada, en la que el cliente es responsable del software que esa infraestructura soportará"
    - label: "Google Cloud, páginas para España"
      url: "https://cloud.google.com/learn/what-is-iaas?hl=es"
      found: ["infraestructura como servicio", "plataforma como servicio", "software como servicio"]
      checked: 2026-11-14
    - label: "Oracle España"
      url: "https://www.oracle.com/es/cloud/what-is-iaas/"
      found: ["infraestructura como servicio"]
      checked: 2026-11-14
  status: sourced

- id: sec.encryption
  en:
    term: encryption
    definition: >-
      Transforming data with a cryptographic algorithm and a key, so that only
      someone holding the right key can read it.
  es:
    verdict: translated
    forms:
      - text: cifrado
        article: el
        kind: noun
        primary: true
        note: The standard term, in documents and in speech.
      - text: cifrar
        kind: verb
        note: To encrypt. The opposite is descifrar.
      - text: encriptar
        kind: verb
        register: informal
        note: >-
          Also heard in speech, with the nouns la encriptación and el
          encriptado. The RAE dictionary lists encriptar as a synonym of
          cifrar, and Google Cloud's pages for Spain use encriptado alongside
          cifrado, but formal writing prefers cifrado.
    definition: >-
      Transformación de los datos mediante un algoritmo y una clave, de modo
      que solo quien tenga la clave correcta pueda leerlos.
    examples:
      - es: Los datos se cifran en reposo y en tránsito.
        en: Data is encrypted at rest and in transit.
    watchOut: >-
      Cifra also means a figure or number. "Las cifras de ventas" are the
      sales figures, nothing to do with encryption.
  topics: [crypto]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
  related: [sec.key-management, sec.data-at-rest, sec.tokenization]
  sources:
    - label: "Diccionario de la lengua española (RAE): cifrar"
      url: "https://dle.rae.es/cifrar"
      lead: "Transcribir, con una clave, un mensaje o texto cuyo contenido se quiere proteger"
    - label: "Diccionario de la lengua española (RAE): encriptar"
      url: "https://dle.rae.es/encriptar"
      lead: "Del ingl. to encrypt. Sinónimo: cifrar"
    - label: "Esquema Nacional de Seguridad (RD 311/2022), medida mp.com.2"
      url: "https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191"
      lead: "Se cifrará toda la información transmitida."
    - label: "Google Cloud, páginas para España"
      url: "https://cloud.google.com/learn/what-is-encryption?hl=es"
      found: ["cifrado", "encriptado"]
      checked: 2026-11-14
    - label: "INCIBE, Glosario de términos de ciberseguridad (2021)"
      url: "https://www.incibe.es/sites/default/files/contenidos/guias/doc/guia_glosario_ciberseguridad_2021.pdf"
      found: ["Cifrado", "Proceso de codificación de información"]
      checked: 2026-11-14
    - label: "Telefónica Tech, blog"
      url: "https://telefonicatech.com/blog/diferencias-cifrado-hashing-codificacion-ofuscacion"
      found: ["El cifrado de datos es el proceso"]
      checked: 2026-11-14
    - label: "Genbeta"
      url: "https://www.genbeta.com/actualidad/anunciaron-que-gmail-tendra-cifrado-extremo-a-extremo-definicion-expertos-no-coincide-google"
      found: ["permanece encriptado"]
      checked: 2026-11-14
  status: draft

- id: sec.data-at-rest
  en:
    term: data at rest
    definition: >-
      Data held in persistent storage (disks, databases, object stores,
      backups), as opposed to data moving across a network or being processed.
  es:
    verdict: translated
    forms:
      - text: datos en reposo
        article: los
        kind: noun
        primary: true
      - text: datos en tránsito
        article: los
        kind: noun
        note: The counterpart, data in transit.
      - text: datos en uso
        article: los
        kind: noun
        note: Data in use.
    definition: >-
      Datos guardados en un almacenamiento persistente, a diferencia de los
      que viajan por la red o se están procesando.
    examples:
      - es: >-
          Todos los datos en reposo deben estar cifrados con claves gestionadas
          por el cliente.
        en: >-
          All data at rest must be encrypted with customer-managed keys.
    watchOut: >-
      Datos is always plural in Spanish, so the verb is plural too: "los datos
      están cifrados", never "está".
  topics: [data, crypto]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
  related: [sec.encryption, sec.key-management, sec.dlp]
  sources:
    - label: "CCN-STIC 499, Arquitecturas de seguridad cloud"
      url: "https://www.ccn-cert.cni.es/pdf/guias/series-ccn-stic/guias-de-acceso-publico-ccn-stic/6807-ccn-stic-499-arquitecturas-de-seguridad-cloud/file.html"
      lead: "Todos los productos o servicios de cifrado en reposo deberán estar incluidos en el CPSTIC"
    - label: "Microsoft Security, es-ES"
      url: "https://www.microsoft.com/es-es/security/business/security-101/what-is-data-security"
      found: ["en reposo y en tránsito"]
      checked: 2026-11-14
  status: draft

- id: sec.key-management
  en:
    term: key management
    definition: >-
      Generating, storing, distributing, rotating and destroying cryptographic
      keys across their whole lifecycle.
  es:
    verdict: translated
    acronym: KMS
    forms:
      - text: gestión de claves
        article: la
        kind: noun
        primary: true
        note: >-
          A key management service keeps its English acronym: "el KMS".
      - text: administración de claves
        article: la
        kind: noun
        note: >-
          Microsoft's wording. Its Spanish documentation says administración
          and administrar where Google, Oracle and official Spanish guidance
          say gestión and gestionar.
      - text: rotación de claves
        article: la
        kind: noun
        note: Key rotation.
    definition: >-
      Generación, almacenamiento, distribución, rotación y destrucción de las
      claves criptográficas durante todo su ciclo de vida.
    examples:
      - es: La rotación de claves se hace automáticamente cada noventa días.
        en: Key rotation happens automatically every ninety days.
    watchOut: >-
      A cryptographic key is una clave, not una llave. In Spain, llave is the
      physical key for a door; llave for cryptographic keys is Latin American
      usage.
  topics: [crypto]
  technology: []
  curriculum:
    - { cert: CCSP, outline: "2026-08", domain: 2 }
  related: [sec.encryption, sec.data-at-rest]
  sources:
    - label: "CCN-STIC 401, Glosario y abreviaturas: Gestión de claves"
      url: "https://www.ccn-cert.cni.es/es/series-ccn-stic/guias/glosario-de-terminos.html"
      lead: "2.533 Gestión de claves"
    - label: "Esquema Nacional de Seguridad (RD 311/2022), medida op.exp.10"
      url: "https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191"
      lead: "Protección de claves criptográficas"
    - label: "Google Cloud, páginas para España"
      url: "https://cloud.google.com/learn/what-is-encryption?hl=es"
      found: ["gestión de claves"]
      checked: 2026-11-14
    - label: "Oracle España"
      url: "https://www.oracle.com/es/security/cloud-security/what-is-cloud-security/"
