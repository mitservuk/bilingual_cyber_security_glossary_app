- id: sec.patch-management
  en:
    term: patch management
    definition: >-
      Identifying, testing and deploying software updates that fix
      vulnerabilities or defects, in a controlled and timely way.
  es:
    verdict: translated
    forms:
      - text: gestión de parches
        article: la
        kind: noun
        primary: true
      - text: parche
        article: el
        kind: noun
        note: A patch. INCIBE's glossary lists it as "parche de seguridad".
      - text: parchear
        kind: verb
        note: >-
          To patch. Used in engineering blogs and by INCIBE-CERT: "una
          vulnerabilidad que no ha sido parcheada". The fuller phrase is
          "aplicar parches".
      - text: revisiones
        article: las
        kind: noun
        note: >-
          Microsoft's word for patches in its Spanish documentation:
          "administración de revisiones" is patch management.
    definition: >-
      Identificación, prueba y despliegue controlado de las actualizaciones
      que corrigen vulnerabilidades o defectos del software.
    examples:
      - es: Todavía no hemos parcheado los servidores de preproducción.
        en: We haven't patched the pre-production servers yet.
