# CISSP terms that the CCSP list did not already cover.
# Format is described in content/README.md. These entries were written from
# working knowledge of usage in Spain; each `found` text was then located in a
# page already downloaded for earlier entries and confirmed with
# scripts/check_sources.py. Forms with no usedBy have not been seen in a source.

- id: law.cybercrime
  en:
    term: cybercrime
    definition: Crime committed using computers or networks, or directed against them.
  es:
    verdict: translated
    forms:
      - text: ciberdelito
        article: el
        kind: noun
        primary: true
        usedBy:
          - official
      - text: ciberdelincuencia
        article: la
        kind: noun
        usedBy:
          - official
        note: The phenomenon as a whole. A cybercriminal is un ciberdelincuente.
      - text: delito informático
        article: el
        kind: noun
        note: The older term, still used by lawyers and the police.
    definition: Delito cometido mediante sistemas informáticos o redes, o dirigido contra
      ellos.
    examples:
      - es: La estafa se denunció a la unidad de ciberdelincuencia de la Policía Nacional.
        en: The fraud was reported to the National Police's cybercrime unit.
    watchOut: Cibercrimen is a calque of the English. Spanish law speaks of delitos, so ciberdelito
      is the better word.
  topics:
    - grc
    - threat
  technology: []
  curriculum:
    - cert: CISSP
      outline: 2027-04
      domain: 1
  related:
    - sec.data-breach
    - sec.ransomware
    - sec.phishing
  sources:
    - label: INCIBE, blog para empresas
      url: https://www.incibe.es/empresas/blog/beneficios-implantar-modelo-zero-trust-tu-empresa
      found:
        - prácticas Ciberdelito Concienciación
      checked: 2026-11-14
    - label: INCIBE, blog para empresas
      url: https://www.incibe.es/empresas/blog/honeypot-una-trampa-para-los-ciberdelincuentes
      found:
        - la ciberdelincuencia
      checked: 2026-11-14
  status: sourced

- id: law.copyright
  en:
    term: copyright
    definition: The exclusive right of an author over an original work, including software
      code.
  es:
    verdict: translated
    forms:
      - text: derechos de autor
        article: los
        kind: noun
        primary: true
        usedBy:
          - official
      - text: copyright
        article: el
        kind: noun
        usedBy:
          - official
        note: The English word is also used, especially for the © notice.
    definition: Derecho exclusivo del autor sobre una obra original, incluido el código de
      un programa.
    examples:
      - es: El código está protegido por derechos de autor.
        en: The code is protected by copyright.
    watchOut: Spanish law calls this propiedad intelectual. Patents and trade marks are propiedad
      industrial.
  topics:
    - grc
  technology: []
  curriculum:
    - cert: CISSP
      outline: 2027-04
      domain: 1
  related:
    - law.intellectual-property
    - law.software-licence
    - law.patent
    - law.trademark
  sources:
    - label: INCIBE, Glosario de términos de ciberseguridad (2021)
      url: https://www.incibe.es/sites/default/files/contenidos/guias/doc/guia_glosario_ciberseguridad_2021.pdf
      found:
        - derechos de autor
      checked: 2026-11-14
    - label: Real Decreto 43/2021, de seguridad de las redes y sistemas de información (BOE)
      url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2021-1192
      found:
        - Derechos de autor
      checked: 2026-11-14
    - label: AEPD, traducción del informe de ENISA «Ingeniería de la protección de datos»
        (2022)
      url: https://www.aepd.es/documento/enisa-ingenieria-de-la-proteccion-de-datos.pdf
      found:
        - DE COPYRIGHT
      checked: 2026-11-14
  status: sourced

