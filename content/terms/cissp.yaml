- id: grc.preventive-control
  en:
    term: preventive control
    definition: A control that stops an unwanted event from happening, such as a firewall
      rule or a locked door.
  es:
    verdict: translated
    forms:
      - text: control preventivo
        article: el
        kind: noun
        primary: true
        usedBy:
          - microsoft
          - oracle
      - text: medida preventiva
        article: la
        kind: noun
        usedBy:
          - official
    definition: Control que impide que ocurra un suceso no deseado.
    examples:
