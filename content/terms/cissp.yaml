- id: grc.offboarding
  en:
    term: offboarding
    definition: The process followed when someone leaves, including recovering equipment and
      removing access.
  es:
    verdict: both
    forms:
      - text: baja
        article: la
        kind: noun
        primary: true
        usedBy:
          - official
        note: As in dar de baja a un usuario, to remove a user.
      - text: offboarding
        article: el
        kind: noun
        headline: true
      - text: desvinculación
        article: la
        kind: noun
        register: formal
        usedBy:
          - official
        note: HR's word for the end of the employment relationship.
    definition: Proceso que se sigue cuando alguien deja la organización, con la devolución
      de equipos y la retirada de accesos.
    examples:
      - es: El mismo día de la baja se desactivan todas las cuentas del empleado.
        en: On the day they leave, all the employee's accounts are disabled.
    watchOut: 'Baja also means sick leave: estar de baja is to be off sick.'
  topics:
    - human
    - iam
  technology: []
  curriculum:
    - cert: CISSP
      outline: 2027-04
      domain: 1
  related:
    - grc.onboarding
    - sec.deprovisioning
    - sec.access-review
  sources:
