- id: law.nda
  en:
    term: non-disclosure agreement
    acronym: NDA
    definition: A contract in which the parties agree not to reveal the confidential information
      they share.
  es:
    verdict: both
    forms:
      - text: acuerdo de confidencialidad
        article: el
        kind: noun
        primary: true
        usedBy:
          - official
          - google
      - text: NDA
        article: el
        kind: noun
        headline: true
        usedBy:
          - aws
        note: The English acronym is very common in business.
      - text: acuerdo de no divulgación
        article: el
        kind: noun
        note: The literal translation.
    say: 'NDA is spelled out: ene-de-a.'
    definition: Contrato por el que las partes se comprometen a no revelar la información
      confidencial que comparten.
    examples:
      - es: Antes de la auditoría, el proveedor firmó un acuerdo de confidencialidad.
        en: Before the audit, the supplier signed a non-disclosure agreement.
  topics:
