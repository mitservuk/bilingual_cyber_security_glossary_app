- id: ens.marco-organizativo
  headword: es
  en:
    term: organisational framework
    definition: The first group of ENS measures, coded org, covering the security policy,
      rules, procedures and the authorisation process.
  es:
    verdict: translated
    forms:
      - text: marco organizativo
        article: el
        kind: noun
        primary: true
        usedBy:
          - official
    definition: Primer grupo de medidas del ENS, de código org, que cubre la política de seguridad,
      la normativa, los procedimientos y el proceso de autorización.
    examples:
      - es: La política de seguridad es la medida org.1 del marco organizativo.
        en: The security policy is measure org.1 of the organisational framework.
  topics:
    - grc
  technology: []
  frameworks:
    - ENS
  related:
