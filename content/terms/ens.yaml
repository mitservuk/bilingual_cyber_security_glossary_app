# The vocabulary of the Esquema Nacional de Seguridad (Real Decreto 311/2022).
# Format is described in content/README.md. These entries were written from
# working knowledge of usage in Spain; each `found` text was then located in a
# page already downloaded for earlier entries and confirmed with
# scripts/check_sources.py. Forms with no usedBy have not been seen in a source.

- id: ens.categoria-de-seguridad
  headword: es
  en:
    term: security category
    definition: The overall rating the ENS gives an information system, BÁSICA, MEDIA or ALTA,
      which decides which measures apply and how strictly.
  es:
    verdict: translated
    forms:
      - text: categoría de seguridad
        article: la
        kind: noun
        primary: true
        usedBy:
          - official
          - microsoft
      - text: categoría básica
        article: la
        kind: noun
        usedBy:
          - official
        note: The three categories are BÁSICA, MEDIA and ALTA, written in capitals in the
          decree.
      - text: categorización
        article: la
        kind: noun
        usedBy:
          - official
        note: The act of working out a system's category.
    definition: Valoración global que el ENS asigna a un sistema de información, BÁSICA, MEDIA
      o ALTA, y que determina qué medidas se aplican.
    examples:
      - es: El sistema de nóminas es de categoría media.
        en: The payroll system is in the medium category.
    watchOut: A system has a categoría; each dimension has a nivel. The category is the highest
      level among the dimensions.
  topics:
    - grc
  technology: []
  frameworks:
    - ENS
  related:
    - ens.dimensiones-de-seguridad
    - ens.nivel-de-seguridad
    - sec.data-classification
  sources:
    - label: Esquema Nacional de Seguridad (RD 311/2022), medida mp.if.1
      url: https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191
      found:
        - categoría de seguridad
        - de categoría BÁSICA solo
      checked: 2026-11-14
    - label: Microsoft Learn, es-ES
      url: https://learn.microsoft.com/es-es/azure/web-application-firewall/overview
      found:
        - categoría de seguridad
      checked: 2026-11-14
    - label: AEPD, Orientaciones y garantías en los procedimientos de anonimización de datos
        personales
      url: https://www.aepd.es/guias/guia-orientaciones-procedimientos-anonimizacion.pdf
      found:
        - CATEGORIZACIÓN DE
      checked: 2026-11-14
  status: sourced

- id: ens.dimensiones-de-seguridad
  headword: es
  en:
    term: security dimensions
    definition: 'The five properties the ENS assesses separately for a system: confidentiality,
      integrity, traceability, authenticity and availability.'
  es:
    verdict: translated
    forms:
      - text: dimensiones de seguridad
        article: las
        kind: noun
        primary: true
        usedBy:
          - official
      - text: confidencialidad, integridad, trazabilidad, autenticidad y disponibilidad
        kind: noun
        note: The five, often abbreviated C, I, T, A, D.
    definition: 'Las cinco propiedades que el ENS valora por separado en un sistema: confidencialidad,
      integridad, trazabilidad, autenticidad y disponibilidad.'
    examples:
      - es: Hay que valorar cada servicio en las cinco dimensiones de seguridad.
        en: Each service has to be rated in the five security dimensions.
    watchOut: The ENS adds trazabilidad and autenticidad to the classic confidentiality, integrity
      and availability triad.
  topics:
    - grc
    - data
  technology: []
  frameworks:
    - ENS
  related:
    - sec.confidentiality
    - sec.integrity
    - sec.availability
    - sec.traceability
    - ens.categoria-de-seguridad
  sources:
    - label: Esquema Nacional de Seguridad (RD 311/2022), medida mp.if.1
      url: https://www.boe.es/buscar/act.php?id=BOE-A-2022-7191
      found:
        - dimensiones de seguridad
      checked: 2026-11-14
  status: sourced

- id: ens.nivel-de-seguridad
  headword: es
  en:
    term: security level
    definition: The rating, BAJO, MEDIO or ALTO, given to each security dimension of a system
      according to the harm an incident would cause.
  es:
    verdict: translated
    forms:
      - text: nivel de seguridad
        article: el
        kind: noun
        primary: true
        usedBy:
          - official
      - text: nivel alto
        article: el
        kind: noun
        usedBy:
          - official
        note: The levels are BAJO, MEDIO and ALTO.
    definition: Valoración, BAJO, MEDIO o ALTO, de cada dimensión de seguridad de un sistema
      según el perjuicio que causaría un incidente.
    examples:
      - es: La disponibilidad se ha valorado en nivel alto.
        en: Availability has been rated at the high level.
  topics:
    - grc
  technology: []
  frameworks:
    - ENS
  related:
    - ens.categoria-de-seguridad
    - ens.dimensiones-de-seguridad
