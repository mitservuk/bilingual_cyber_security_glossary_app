      found:
        - declaración de aplicabilidad
      checked: 2026-11-14
  status: sourced

- id: ens.medidas-compensatorias
  headword: es
  en:
    term: compensating measures
    definition: Alternative measures that an organisation may use in place of those the ENS
      requires, if it can show they protect equally well.
  es:
    verdict: translated
    forms:
      - text: medidas compensatorias
        article: las
        kind: noun
        primary: true
        usedBy:
          - official
      - text: control compensatorio
        article: el
        kind: noun
        note: A compensating control, the general term outside the ENS.
    definition: Medidas alternativas que una organización puede emplear en lugar de las exigidas
      por el ENS si justifica que protegen igual o mejor.
    examples:
      - es: Las medidas compensatorias deben constar en la declaración de aplicabilidad.
        en: Compensating measures must be recorded in the statement of applicability.
  topics:
    - grc
  technology: []
  frameworks:
    - ENS
  related:
    - ens.declaracion-de-aplicabilidad
    - grc.control
    - grc.risk-treatment
  sources:
