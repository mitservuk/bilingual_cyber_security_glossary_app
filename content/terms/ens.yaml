      checked: 2026-11-14
  status: sourced

- id: ens.marco-operacional
  headword: es
  en:
    term: operational framework
    definition: The second group of ENS measures, coded op, covering planning, access control,
      operations, external resources, cloud services, continuity and monitoring.
  es:
    verdict: translated
    forms:
      - text: marco operacional
        article: el
        kind: noun
        primary: true
        usedBy:
          - official
    definition: Segundo grupo de medidas del ENS, de código op, que cubre la planificación,
      el control de acceso, la explotación, los recursos externos, la nube, la continuidad
      y la monitorización.
    examples:
      - es: El control de acceso pertenece al marco operacional.
        en: Access control belongs to the operational framework.
    watchOut: 'The decree calls day-to-day operations explotación, a word worth knowing: it
      does not mean exploitation in the attack sense.'
  topics:
    - grc
  technology: []
  frameworks:
    - ENS
  related:
