- id: ens.declaracion-de-aplicabilidad
  headword: es
  en:
    term: statement of applicability
    definition: The signed document listing which ENS measures apply to a system and justifying
      any that do not; ISO 27001 has the same concept.
  es:
    verdict: translated
    forms:
      - text: declaración de aplicabilidad
        article: la
        kind: noun
        primary: true
        usedBy:
          - official
      - text: SoA
        article: la
        kind: noun
        note: The English acronym, common among people who also work with ISO 27001.
    definition: Documento firmado que relaciona las medidas del ENS que se aplican a un sistema
      y justifica las que no.
    examples:
      - es: El auditor empezó por revisar la declaración de aplicabilidad.
        en: The auditor began by reviewing the statement of applicability.
  topics:
    - grc
  technology: []
  frameworks:
    - ENS
    - ISO-27001
  related:
    - ens.medidas-compensatorias
    - ens.perfil-de-cumplimiento
    - grc.isms
  sources:
