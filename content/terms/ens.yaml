      found:
        - de medidas compensatorias
      checked: 2026-11-14
  status: sourced

- id: ens.perfil-de-cumplimiento
  headword: es
  en:
    term: specific compliance profile
    definition: A tailored set of ENS measures approved by the CCN for a particular type of
      organisation or technology, such as town councils or a cloud service.
  es:
    verdict: translated
    forms:
      - text: perfil de cumplimiento específico
        article: el
        kind: noun
        primary: true
        plural: los perfiles de cumplimiento específicos
        usedBy:
          - official
      - text: PCE
        article: el
        kind: noun
        note: The usual abbreviation.
    definition: Conjunto adaptado de medidas del ENS, validado por el CCN, para un tipo concreto
      de entidad o de tecnología.
    examples:
      - es: El ayuntamiento aplica el perfil de cumplimiento específico para entidades locales.
        en: The town council applies the specific compliance profile for local bodies.
  topics:
