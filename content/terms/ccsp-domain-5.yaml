- id: tech.capacity-management
  en:
    term: capacity management
    definition: Making sure that compute, storage and network capacity matches current and
      forecast demand at an acceptable cost.
  es:
    verdict: translated
    forms:
      - text: gestión de la capacidad
        article: la
        kind: noun
        primary: true
        usedBy:
          - official
          - eu
      - text: gestión de capacidad
        article: la
        kind: noun
        note: The same term without the article, equally common.
    definition: Proceso que asegura que la capacidad de cómputo, almacenamiento y red cubre
      la demanda actual y prevista con un coste razonable.
    examples:
      - es: La gestión de la capacidad evita quedarse sin recursos en los picos de demanda.
        en: Capacity management avoids running out of resources at peak demand.
