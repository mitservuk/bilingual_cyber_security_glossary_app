- id: tech.performance-monitoring
  en:
    term: performance monitoring
    definition: Continuously measuring how systems behave, such as response time, throughput
      and resource use, to spot degradation before users do.
  es:
    verdict: translated
    forms:
      - text: monitorización del rendimiento
        article: la
        kind: noun
        primary: true
      - text: supervisión del rendimiento
        article: la
        kind: noun
        usedBy:
          - microsoft
        note: The wording usual in Microsoft documentation.
    definition: Medición continua del comportamiento de los sistemas, como tiempos de respuesta
      y uso de recursos, para detectar degradaciones.
    examples:
      - es: La monitorización del rendimiento mostró un cuello de botella en la base de datos.
        en: Performance monitoring showed a bottleneck in the database.
    watchOut: Rendimiento is performance in the technical sense. Monitoreo del rendimiento
      is the Latin American form.
