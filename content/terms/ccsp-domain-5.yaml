- id: sec.secure-by-default
  en:
    term: secure by default
    definition: The principle that a product ships with its safest settings switched on, so
      that staying secure takes no extra work.
  es:
    verdict: translated
    forms:
      - text: seguro por defecto
        kind: adjective
        primary: true
        usedBy:
          - eu
          - engineers
      - text: seguridad por defecto
        article: la
        kind: noun
        usedBy:
          - microsoft
        note: The noun form, used for the principle itself.
      - text: seguro de forma predeterminada
        kind: adjective
        usedBy:
          - microsoft
        note: Microsoft's rendering; predeterminado is its standard word for default.
    definition: Principio según el cual un producto se entrega con su configuración más segura
      ya activada.
    examples:
      - es: 'El servicio es seguro por defecto: el cifrado viene activado.'
        en: 'The service is secure by default: encryption comes switched on.'
  topics:
    - hardening
    - architecture
  technology: []
  curriculum:
    - cert: CCSP
      outline: 2026-08
      domain: 5
    - cert: CISSP
      outline: 2027-04
