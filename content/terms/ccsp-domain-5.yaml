# CCSP Domain 5: Cloud Security Operations.
# Format is described in content/README.md. These entries were written from
# working knowledge of usage in Spain; each `found` text was then located in a
# page already downloaded for earlier entries and confirmed with
# scripts/check_sources.py. Forms with no usedBy have not been seen in a source.

- id: sec.tpm
  en:
    term: trusted platform module
    acronym: TPM
    definition: A tamper-resistant chip, or its virtual equivalent, that stores keys and measures
      the boot sequence so a machine can prove it started in a known state.
  es:
    verdict: both
    acronym: TPM
    forms:
      - text: módulo de plataforma segura
        article: el
        kind: noun
        primary: true
        usedBy:
          - microsoft
          - eu
        note: The name used in Windows and Azure in Spanish.
      - text: TPM
        article: el
        kind: noun
        headline: true
        usedBy:
          - microsoft
        note: What people say day to day.
      - text: módulo de plataforma de confianza
        article: el
        kind: noun
        note: A more literal translation that also circulates.
    say: 'TPM is spelled out in Spanish: te-pe-eme.'
    definition: Chip resistente a manipulaciones que guarda claves y mide el arranque para
      demostrar que el equipo se ha iniciado en un estado conocido.
    examples:
      - es: Las máquinas virtuales de producción llevan un TPM virtual para el arranque medido.
        en: The production virtual machines have a virtual TPM for measured boot.
  topics:
    - crypto
    - hardening
  technology:
    - endpoint
  curriculum:
    - cert: CCSP
      outline: 2026-08
      domain: 5
    - cert: CISSP
      outline: 2027-04
      domain: 3
  related:
    - sec.hsm
    - cloud.confidential-computing
    - sec.key-management
  sources:
    - label: Microsoft Learn, es-ES
      url: https://learn.microsoft.com/es-es/azure/databox/data-box-security
      found:
        - Módulo de plataforma segura
        - TPM
      checked: 2026-11-14
    - label: Reglamento de Ejecución (UE) 2024/482 (EUCC), en el BOE
      url: https://www.boe.es/buscar/doc.php?id=DOUE-L-2024-80181
      found:
        - módulo de plataforma segura
      checked: 2026-11-14
  status: sourced

