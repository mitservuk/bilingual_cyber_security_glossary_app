      - text: escalar
        kind: verb
        note: 'To escalate: hay que escalar la incidencia.'
      - text: escalamiento
        article: el
        kind: noun
        note: A variant, more common in Latin America.
    definition: Traspaso de un incidente a una persona o equipo de mayor nivel o especialización
      cuando no puede resolverse en el nivel actual.
